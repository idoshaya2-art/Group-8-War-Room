/* ==========================================================================
   DECISION ENRICHMENT — the fourth layer.
   The action list is built deterministically from three layers: (1) the game's rule
   book, (2) the current position from the latest ingested results, (3) the team's
   goals. That backbone is verifiable and costs nothing to compute.

   This adds the fourth: the model looks at all three plus the engine's own list and
   proposes moves the deterministic rules did not think to generate. Same contract as
   everywhere else — the model proposes, the ENGINE validates. Every suggestion is run
   through the legality guards and scored before it is allowed onto the list, and it is
   labelled so nobody confuses it with an engine-derived action.
   It runs on demand, not on render: it costs an API call, and the page must work offline.
   ========================================================================== */
const REVIEW_SYSTEM = `אתה אסטרטג INTOPIA בכיר לחברה 8. המנוע הדטרמיניסטי בנה רשימת החלטות מ-3 שכבות: חוקי המשחק, המצב מהדוח האחרון, והיעדים. תפקידך: **לבחון כל פעולה שלו ולהחזיר את רשימת הפעולות המלאה והמומלצת** לרבעון היעד.

לכל פעולה של המנוע החלט אחת מ:
- "keep" — נכונה כמו שהיא.
- "modify" — הכיוון נכון אך המספרים/העדיפות שגויים. החזר sim מתוקן ונמק מה שינית ולמה.
- "drop" — לא כדאית ברבעון הזה. נמק. (פעולות שסומנו "חובה" לא יוסרו — ההסתייגות שלך תוצג עליהן.)
ובנוסף הוסף פעולות שהמנוע פספס לגמרי.

סדר את הרשימה המלאה לפי מה שממקסם את הציון הסופי (50% ביצועים פיננסיים + 50% פוטנציאל), בהתחשב במה שדחוף באמת ובמה שכובל מזומן.

כללים מחייבים — הפרה תגרום לדחיית הפעולה על-ידי המנוע:
- אל תמציא מספרים. השתמש רק בעוגנים שבהקשר.
- ייצור רק באזור עם מפעל. מכירה לא מעבר להיצע. משרדי מכירות 0 או 2–10. מו״פ ≥ המינימום החוקי.
- כל פעולה חייבת להיות ניתנת לביצוע בטופס INTOPIA אמיתי ברבעון היעד.

החזר **JSON תקין בלבד**:
{"rationale":"משפט-שניים: מה העיקרון שהנחה את הסדר שקבעת",
 "plan":[
  {"ref":1,"verdict":"keep","why":"קצר"},
  {"ref":3,"verdict":"modify","why":"מה שינית ולמה","level":"red","sim":{"q":"Q4","regions":{"europe":{"advertising":60000}}}},
  {"ref":2,"verdict":"drop","why":"למה לא ברבעון הזה"},
  {"ref":null,"verdict":"add","title":"כותרת קצרה","form":"A3-3","level":"amber","why":"למה זה משתלם, עם המספר מההקשר","sim":{"q":"Q4","regions":{"brazil":{"invest":500000}}}}
 ]}

ref = מספר הפעולה ברשימת המנוע. הסדר במערך plan הוא הסדר המומלץ. כלול **כל** פעולה של המנוע בדיוק פעם אחת.`;

function parseReviewJSON(txt,targetQ,engineCount){
  let raw=String(txt||'').trim();
  const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) raw=fence[1].trim();
  const a=raw.indexOf('{'), b=raw.lastIndexOf('}'); if(a<0||b<=a) throw new Error('התשובה לא הכילה JSON');
  let obj; try{ obj=JSON.parse(raw.slice(a,b+1)); }catch(e){ throw new Error('JSON לא תקין: '+e.message); }
  const n=v=>{ const x=Number(v); return isFinite(x)&&x>=0?x:0; };
  const simOf=(sim)=>{ if(!sim) return null; const regions={};
    Object.entries(sim.regions||{}).forEach(([rid,g])=>{ if(!REGIONS.some(r=>r.id===rid)) return;
      const price=n(g.price), qty=n(g.qtySold);
      regions[rid]={ production:n(g.production), unitCost:n(g.unitCost), price, qtySold:qty,
        sales:(price&&qty)?Math.round(price*qty):n(g.sales), advertising:n(g.advertising), invest:n(g.invest),
        transferIn:n(g.transferIn), offices:Math.round(n(g.offices)),
        product:(g.product==='X'?'X':'Y'), model:g.model==='Deluxe'?'Deluxe':'Standard' }; });
    const rd=(sim.rd!=null)?n(sim.rd):null;
    return (Object.keys(regions).length||rd!=null)?{q:targetQ, rd:(rd!=null?rd:undefined), regions}:null; };
  const plan=(obj.plan||[]).slice(0,24).map(e=>{
    const ref=(e.ref==null||e.ref==='')?null:parseInt(e.ref,10);
    const verdict=['keep','modify','drop','add'].includes(e.verdict)?e.verdict:'keep';
    return { ref:(Number.isInteger(ref)&&ref>=1&&ref<=engineCount)?ref-1:null, verdict,
      why:String(e.why||'').slice(0,400),
      title:e.title?String(e.title).slice(0,90):null,
      form:e.form?String(e.form).slice(0,60):null,
      level:['red','amber','info'].includes(e.level)?e.level:null,
      sim:simOf(e.sim) };
  });
  return { rationale:String(obj.rationale||'').slice(0,400), plan };
}
/* Engine-side validation: a proposed action only reaches the list if a scenario built from
   it breaks no rule. This is what keeps the model advisory — it may judge, it may not
   override the rule book. */
function validateEnriched(act,targetQ){
  const base=S.activeQuarter;
  const levers={}; planHorizon(base).forEach(hq=>{ levers[hq]={rd:0,regions:{}};
    REGIONS.forEach(r=>levers[hq].regions[r.id]={production:0,unitCost:0,sales:0,advertising:0,invest:0,transferIn:0,product:'Y',model:'Standard',newFac:0,offices:0}); });
  const tq=levers[targetQ]?targetQ:Object.keys(levers)[0];
  if(!tq) return {ok:false,why:'אין רבעון יעד'};
  if(!act||!act.sim) return {ok:false,why:'ללא מנופים'};
  if(act.sim.rd!=null) levers[tq].rd=act.sim.rd;
  Object.entries(act.sim.regions||{}).forEach(([rid,p])=>{ if(levers[tq].regions[rid]) levers[tq].regions[rid]=Object.assign(levers[tq].regions[rid],p); });
  const fake={levers}; const v=[];
  if(phantomSales(fake,tq).length) v.push('מכירה מעבר להיצע');
  const ol=officeLegality(fake,tq); if(ol.length) v.push(ol[0].region+': '+ol[0].why);
  const caps=capacityCheck(fake,tq); if(caps.length) v.push('חריגת קיבולת ב'+caps[0].name);
  const plantsBy=S.quarters[base].operational.plantsByRegion;
  if(plantsBy) REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    if((levers[tq].regions[r.id].production||0)>0 && !(plantsBy[r.id]>0)) v.push('ייצור ב'+r.name+' ללא מפעל'); });
  const rd=levers[tq].rd||0;
  if(rd>0 && rd<DATALOG.rdMinPerQuarter.X) v.push('מו״פ מתחת למינימום החוקי');
  return {ok:v.length===0, why:v.join(' · ')};
}
/* Turn the model's review into the list the page renders. The engine has the last word:
   a modified or added action is only accepted if it passes the legality guards, and a
   MANDATORY engine action can never be removed — the model's objection is shown on it
   instead. Nothing the model said disappears silently. */
function applyReview(engineItems, review, targetQ){
  const seen=new Set(), list=[], dropped=[], rejected=[];
  (review.plan||[]).forEach(e=>{
    if(e.ref!=null){
      if(seen.has(e.ref)) return; seen.add(e.ref);
      const base=engineItems[e.ref]; if(!base) return;
      if(e.verdict==='drop'){
        if(base.level==='red'){ list.push({...base, aiNote:'⚠ ה-AI המליץ לוותר: '+e.why+' — הפעולה נשארת כי היא מסומנת חובה', aiVerdict:'drop-blocked'}); }
        else dropped.push({...base, aiNote:e.why});
        return;
      }
      if(e.verdict==='modify' && e.sim){
        const cand={...base, sim:e.sim, level:e.level||base.level};
        const v=validateEnriched(cand,targetQ);
        if(v.ok) list.push({...cand, aiNote:'שונה ע״י AI: '+e.why, aiVerdict:'modify'});
        else { rejected.push({title:base.title, why:v.why}); list.push({...base, aiNote:'ה-AI הציע שינוי שנדחה על-ידי המנוע ('+v.why+') — נשמרה גרסת המנוע', aiVerdict:'modify-rejected'}); }
        return;
      }
      list.push({...base, aiNote:e.why?('אושר ע״י AI: '+e.why):null, aiVerdict:'keep'});
      return;
    }
    if(e.verdict==='add' && e.sim && e.title){
      // SECURITY: an action card renders `title`/`form`/`detail` as raw HTML on purpose — the
      // engine authors markup there. A model-authored action is untrusted text (the fact pack is
      // built from uploaded report files, so text a report carries can come back out as a title)
      // and this page holds the API key in localStorage. Escape the model's strings here, where
      // they first become an engine-shaped item. `aiNote` is escaped at its own render site.
      const cand={ cat:'strat', level:e.level||'info', conf:'est', ai:true,
        title:esc(e.title), form:esc(e.form||''), detail:esc(e.why), sim:e.sim };
      const v=validateEnriched(cand,targetQ);
      if(v.ok) list.push({...cand, aiVerdict:'add'});
      else rejected.push({title:e.title, why:v.why});
    }
  });
  // Any engine action the model forgot to mention stays in the list — never lost by omission.
  engineItems.forEach((it,i)=>{ if(!seen.has(i) && !dropped.some(d=>d.title===it.title)) list.push({...it, aiVerdict:'untouched'}); });
  return {list, dropped, rejected};
}

const ADVISOR_SYSTEM = `אתה יועץ בכיר ומנוסה לצוות INTOPIA (חברה 8). "המנוע" הדטרמיניסטי כבר חישב את המספרים וההמלצות הקונקרטיות לרבעון {targetQ}. תפקידך: לוודא שכל פעולה מדויקת, חוקית וכדאית — ולהוציא רשימת פעולות מוכנה-להזנה. שיפוט, לא חשבון.

## איך אתה עובד — ביקורת 4 עמודים לכל פעולה
עבור כל פעולה שהמנוע מציע, בדוק אותה מול ארבעת עמודי-ההצדקה, ותקן/דחה/אשר בהתאם:

2. מחקרי שוק — הכמות/המחיר עולים בקנה אחד עם הביקוש והגמישות שנלמדו? אם ה-MR הרלוונטי חסר — סמן "לא מכויל" והמלץ לקנות אותו (H1-2).
3. מצב פיננסי — יש מזומן *באזור ובמטבע הנכונים* לממן? "מאוחד" אינו ארנק. אם האזור דק — מה מקדימים או מעבירים (A3-1, בעיכוב ושער).

## כללי ברזל
- המספרים מהמנוע הם עובדות — צטט אותם. אל תמציא כמות/מחיר/סכום/קוד שלא סופק. אם אתה מכוונן כמות בגלל אילוץ מזומן, אמור זאת במפורש כ"אומדן" והישאר בגבולות המזומן שסופק.

ענֵה בעברית עסקית, RTL, בשלושה חלקים בדיוק:
## פעולות מאושרות ל-{targetQ} (מתועדפות)
2–4 פעולות בסדר ביצוע. לכל אחת: **קוד טופס + שדות מדויקים** (אזור/מוצר/דגם/מספר/מטבע מהמנוע) · שורת אימות 4-עמודים קצרה (חוק✓ · MR✓/לא-מכויל · מזומן-אזור✓ · 50/50: איזו מחצית ובכמה) · אם אין מזומן לכולן — מה דוחים ולמה.

  L.push(`- מאוחד ${fmt(unifiedCashOf(q))} SF. "מאוחד" הוא סכום חשבונאי, לא ארנק. העברה בין אזורים = A3-1, בעיכוב ובשער.`);

// Every request is time-boxed. Without this a stalled mobile connection leaves the
// "מנתח…" placeholder on screen forever with no error and no way to retry.
const LLM_TIMEOUT_MS=90000;
async function fetchLLM(url,init){
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(),LLM_TIMEOUT_MS);
  try{ return await fetch(url,Object.assign({signal:ac.signal},init)); }
  catch(e){ throw new Error(e&&e.name==='AbortError'
    ? `הבקשה לא חזרה תוך ${LLM_TIMEOUT_MS/1000} שניות (TIMEOUT). נסה שוב, או בדוק חיבור/מכסה.`
    : 'לא ניתן להגיע לשרת ה-AI: '+((e&&e.message)||e)); }
  finally{ clearTimeout(t); }
}
async function callLLM(messages, system, opts={}){
  const prov=aiProvider(), key=getApiKey(prov);
  if(!key) throw new Error('NO_KEY');
  const readErr=async(res)=>{ let msg=res.status+' '+res.statusText; try{ const j=await res.json(); if(j.error&&j.error.message)msg=j.error.message; }catch(e){} return msg; };
  if(prov==='openai'){
    const res=await fetchLLM('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{ 'content-type':'application/json', 'Authorization':'Bearer '+key },
      body:JSON.stringify({ model:aiModel(), max_completion_tokens:opts.max_tokens||1200,
        messages:[{role:'system',content:system},...messages] }),
    });
    if(!res.ok) throw new Error(await readErr(res));
    const data=await res.json();
    const txt=((data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'').trim();
    if(!txt) throw new Error('המודל החזיר תשובה ריקה (ייתכן שנגמרו הטוקנים). נסה שאלה קצרה יותר.');
    return txt;
  }
  // Anthropic (default)
  const res=await fetchLLM('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({ model:aiModel(), max_tokens:opts.max_tokens||1200, system, messages }),
  });
  if(!res.ok) throw new Error(await readErr(res));
  const data=await res.json();
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!txt) throw new Error(data.stop_reason==='max_tokens'
    ? 'התשובה נקטעה לפני שנכתב טקסט (max_tokens). נסה שאלה ממוקדת יותר.'
    : 'המודל החזיר תשובה ריקה.');
  return txt;
}

window.retryChat=(i)=>{
  const chat=(S.ai&&S.ai.chat)||[]; let ui=-1;
  for(let k=i-1;k>=0;k--){ if(chat[k].role==='user'){ ui=k; break; } }
  if(ui<0)return;
  const q=chat[ui].content;
  S.ai.chat=chat.slice(0,ui).concat(chat.slice(i+1));
  save(); renderChatLog();
  const el=$('#chatInput'); if(el){ el.value=q; sendChat(); }
};
window.quickAsk=(q)=>{ const el=$('#chatInput'); if(el){ el.value=q; sendChat(); } };
const CHAT_PENDING='מנתח…';
const CHAT_HISTORY_TURNS=10; // cap what we resend so the payload can't grow unbounded
let _chatBusy=false;
// A placeholder left behind by a tab that was closed mid-request would otherwise sit
// in localStorage forever, and would also be resent as conversation history.
function dropStalePending(){
  if(_chatBusy)return false; // never touch a placeholder that a live request still owns
  if(!S.ai||!Array.isArray(S.ai.chat))return false;
  const n=S.ai.chat.length; S.ai.chat=S.ai.chat.filter(m=>m&&m.content!==CHAT_PENDING);
  return S.ai.chat.length!==n;
}
// Resolve the placeholder by object identity, not by index: a team-sync snapshot can
// replace S (and therefore S.ai.chat) while the request is in flight, which would make
// any saved index point at the wrong message — or at nothing.
function settlePending(ph,msg){
  if(!S.ai) S.ai={}; if(!Array.isArray(S.ai.chat)) S.ai.chat=[];
  const i=S.ai.chat.indexOf(ph);
  if(i>=0) S.ai.chat[i]=msg; else S.ai.chat.push(msg); // placeholder was wiped — never drop the answer
}
window.sendChat=async()=>{
  const input=$('#chatInput'); const q=(input.value||'').trim(); if(!q)return;
  if(_chatBusy){ toast('יש שאלה בעיבוד — המתן לתשובה','a'); return; } // Enter could re-enter past the disabled button
  if(!getApiKey()){ openAISettings(); return; }
  S.ai.chat=S.ai.chat||[]; dropStalePending();
  _chatBusy=true;
  S.ai.chat.push({role:'user',content:q}); input.value='';
  const ph={role:'assistant',content:CHAT_PENDING}; S.ai.chat.push(ph);
  save(); renderChatLog();
  const btn=$('#chatSend'); if(btn){ btn.disabled=true; btn.textContent='...'; }
  try{
    const ctx=buildAIContext();
    const history=S.ai.chat.filter(m=>m.content!==CHAT_PENDING).map(m=>({role:m.role,content:m.content})).slice(-CHAT_HISTORY_TURNS);
    // prepend context to the latest user turn
    history[history.length-1]={role:'user',content:ctx+'\n\n---\nשאלה: '+q};
    settlePending(ph,{role:'assistant',content:await callLLM(history, AI_SYSTEM)});
  }catch(e){
    settlePending(ph,{role:'assistant',content:aiErr(e),err:true});
  }
  _chatBusy=false;
  save(); renderChatLog();
  const b2=$('#chatSend'); if(b2){ b2.disabled=false; b2.textContent='שלח'; }
};
function aiErr(e){
  if(e.message==='NO_KEY') return 'לא הוגדר מפתח API. פתח "הגדרות AI".';
  return 'שגיאת API: '+e.message+'\n(בדוק מפתח, מזהה מודל, ומכסת שימוש. אם מופיע CORS — ודא שה-header לגישה ישירה מהדפדפן פעיל.)';
}
window.runCouncil=async()=>{
  const q=($('#councilQ').value||'').trim(); if(!q)return;
  if(!getApiKey()){ openAISettings(); return; }
  const out=$('#councilOut'); const btn=$('#councilRun'); btn.disabled=true; btn.textContent='מכנס…';
  out.innerHTML=`<div class="chip">${IC('clock')} שלב 1/3 — 5 יועצים מנתחים במקביל…</div>`;
  const ctx=buildAIContext();
  try{
    // Stage 1: independent analyses (parallel)
    const analyses=await Promise.all(COUNCIL.map(async(p)=>{
      const sys=AI_SYSTEM+`\n\nאתה ממלא את הפרסונה "${p.name}": ${p.brief} נתח מזווית זו בלבד, 3–5 משפטים, ממוקד.`;
      const txt=await callLLM([{role:'user',content:ctx+'\n\n---\nהמהלך לדיון: '+q}], sys, {max_tokens:700});
      return {name:p.name, txt};
    }));
    out.innerHTML=`<div class="chip">${IC('clock')} שלב 2/3 — ביקורת עמיתים…</div>`;
    // Stage 3: synthesis (anonymized)
    const anon=analyses.map((a,i)=>`יועץ ${i+1}:\n${a.txt}`).join('\n\n');
    const synSys=AI_SYSTEM+`\n\nאתה יו״ר המועצה. קיבלת 5 ניתוחים אנונימיים. בצע ביקורת עמיתים קצרה, אתר הסכמות ומחלוקות, והכרע לפסק דין מעשי: המלצה, נימוק, וסיכון עיקרי. פורמט: "פסק דין" + "נימוק" + "מה לבדוק בסימולטור".`;
    const verdict=await callLLM([{role:'user',content:ctx+'\n\nהמהלך: '+q+'\n\nהניתוחים:\n'+anon}], synSys, {max_tokens:900});
    out.innerHTML=`
      <div class="card pad" style="margin-bottom:14px">
        <div class="between"><b>${IC('scale')} פסק דין המועצה</b><span class="tag b">סינתזה</span></div>
        <div style="margin-top:8px;line-height:1.7;white-space:pre-wrap">${esc(verdict)}</div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        ${analyses.map(a=>`<div class="card pad"><b style="color:var(--purple)">${esc(a.name)}</b><div class="small" style="margin-top:6px;line-height:1.6;white-space:pre-wrap">${esc(a.txt)}</div></div>`).join('')}
      </div>`;
  }catch(e){ out.innerHTML=`<div class="tag r">${esc(aiErr(e))}</div>`; }
  btn.disabled=false; btn.textContent='כנס מועצה';
};

/* =========================================================================
   TEAM SYNC (F9) — live shared state via Firebase Realtime Database (REST).
   Bring-your-own backend: config stored locally, NOT in the JSON backup.
   Model: last-write-wins with a "who edited last" indicator (F9.2). Suited to
   the classroom turn-based workflow; not a CRDT. Fully optional — the app
   works entirely offline without it.
   ========================================================================= */
const SYNC_LS='intopia_sync_cfg';
const sync={ cfg:null, es:null, connected:false, applying:false, clientId:uid(), lastPushedAt:0, pushTimer:null };
function getSyncCfg(){ try{ const r=localStorage.getItem(SYNC_LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function setSyncCfg(c){ try{ c?localStorage.setItem(SYNC_LS,JSON.stringify(c)):localStorage.removeItem(SYNC_LS); }catch(e){} sync.cfg=c; }
function normalizeDbUrl(u){
  u=(u||'').trim(); if(!u) return '';
  u=u.replace(/^http:\/\//i,'https://');                 // Firebase is https-only
  if(!/^https:\/\//i.test(u)) u='https://'+u.replace(/^\/+/,''); // add scheme if missing
  try{ const x=new URL(u); return 'https://'+x.host; }catch(e){ return u.replace(/\/+$/,''); } // keep host only
}
function syncUrl(cfg){ return `${normalizeDbUrl(cfg.url)}/rooms/${encodeURIComponent(cfg.room||'')}.json${cfg.auth?('?auth='+encodeURIComponent(cfg.auth)):''}`; }
function setSyncDot(color,title){ const d=$('#syncDot'); if(d){ d.style.background=color; d.parentElement.title=title||'סנכרון צוותי'; } }

function connectSync(){
  const cfg=getSyncCfg(); sync.cfg=cfg;
  if(!cfg||!cfg.url||!cfg.room){ setSyncDot('var(--muted2)','לא מחובר'); return; }
  disconnectSync();
  try{
    const es=new EventSource(syncUrl(cfg));
    es.addEventListener('put', onSyncEvent);
    es.addEventListener('patch', onSyncEvent);
    es.onopen=()=>{ sync.connected=true; setSyncDot('var(--green)','מסונכרן — '+cfg.room); };
    es.onerror=()=>{ setSyncDot('var(--amber)','מתחבר מחדש…'); };
    sync.es=es; sync.connected=true;
  }catch(e){ setSyncDot('var(--red)','שגיאת חיבור'); }
}
function disconnectSync(){ if(sync.es){ try{ sync.es.close(); }catch(e){} sync.es=null; } sync.connected=false; }
function onSyncEvent(e){
  let msg; try{ msg=JSON.parse(e.data); }catch(err){ return; }
  if(!msg) return;
  if(msg.path==='/'){ if(msg.data) applyRemote(msg.data); }
  else { fetchRemoteAndApply(); } // nested patch — refetch whole room
}
function fetchRemoteAndApply(){
  const cfg=sync.cfg; if(!cfg)return;
  fetch(syncUrl(cfg)).then(r=>r.json()).then(d=>{ if(d)applyRemote(d); }).catch(()=>{});
}
function applyRemote(remote){
  if(!remote||!remote.quarters||!remote.config) return;
  // ignore our own echo
  if(remote.meta && remote.meta.syncOrigin===sync.clientId && remote.meta.lastEdited===sync.lastPushedAt) return;
  sync.applying=true;
  // The AI chat, provider and model are per-member local state: they are never pushed,
  // so a remote snapshot must not overwrite them (and must not clobber an in-flight answer).
  const localAI=S.ai;
  S=deepMerge(defaultState(), remote); migrateIntel();
  if(localAI) S.ai=localAI;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  sync.applying=false;
  renderNav(); renderQuarterSelect(); renderQBox();
  if(currentPage) go(currentPage);
  setSyncDot('var(--green)','עודכן ע״י '+(remote.meta&&remote.meta.lastEditor||'צוות'));
}
function schedulePush(){ clearTimeout(sync.pushTimer); sync.pushTimer=setTimeout(pushSync,400); }
function pushSync(){
  const cfg=sync.cfg; if(!sync.connected||!cfg) return;
  S.meta.syncOrigin=sync.clientId; sync.lastPushedAt=S.meta.lastEdited;
  // Strip the personal AI chat: it is scratch space, it is large (a single answer is KBs
  // pushed on every save), and sharing it let one member's snapshot wipe another's answer.
  const payload=Object.assign({},S); delete payload.ai;
  fetch(syncUrl(cfg),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>{ if(!r.ok) setSyncDot('var(--red)','שגיאת כתיבה ('+r.status+')'); else setSyncDot('var(--green)','מסונכרן'); })
    .catch(()=>setSyncDot('var(--amber)','אין חיבור'));
}
$('#btnSync').onclick=()=>{
  const cfg=getSyncCfg()||{url:'',room:'',auth:'',name:''};
  openModal('סנכרון צוותי (F9)',`
    <div class="small muted" style="margin-bottom:12px">מצב משותף חי לכל הצוות דרך Firebase Realtime Database (חינם). ההגדרות נשמרות מקומית בלבד ואינן נכללות בגיבוי.
    כל שינוי אצל חבר צוות אחד מתעדכן אצל כולם. מודל: "העריכה האחרונה מנצחת" + סימון מי ערך אחרון.</div>
    <div class="field"><label class="fl">Firebase Database URL</label>
      <input class="f" id="syncUrl" value="${esc(cfg.url)}" placeholder="https://your-project-default-rtdb.firebaseio.com"></div>
    <div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label class="fl">קוד חדר צוות</label><input class="f" id="syncRoom" value="${esc(cfg.room)}" placeholder="company8"></div>
      <div class="field" style="flex:1"><label class="fl">השם שלך</label><input class="f" id="syncName" value="${esc(cfg.name)}" placeholder="עידו (COO)"></div>
    </div>
    <div class="field"><label class="fl">Auth secret (אופציונלי)</label><input class="f" id="syncAuth" type="password" value="${esc(cfg.auth)}" placeholder="למסד מאובטח בלבד"></div>
    <details class="small muted"><summary style="cursor:pointer">איך מקימים? (3 דקות)</summary>
      <ol style="padding-inline-start:18px;line-height:1.8;margin:8px 0 0">
        <li>console.firebase.google.com ← Add project</li>
        <li>Build ← Realtime Database ← Create ← Start in test mode</li>
        <li>העתק את ה-URL לשדה למעלה, בחר קוד חדר משותף, ולחץ התחבר</li>
        <li>כל הצוות מזין אותו URL + אותו קוד חדר</li>
      </ol>
      <div style="color:var(--amber)">${IC('warn')} test mode פתוח לקריאה/כתיבה — למשחק כיתתי סביר; לאבטחה מלאה הגדר rules + auth.</div>
    </details>`,
    `${getSyncCfg()?`<button class="btn danger" onclick="disconnectSyncUI()">נתק</button><button class="btn" onclick="copyShareLink()">${IC('share')} העתק לינק שיתוף</button>`:''}<button class="btn primary" onclick="saveSyncCfg()">התחבר</button>`);
};
function buildShareLink(url,room){
  const base=location.origin+location.pathname;
  return base+'#room='+encodeURIComponent(room)+'&db='+encodeURIComponent(normalizeDbUrl(url));
}
window.copyShareLink=()=>{
  const cfg=getSyncCfg()||{};
  const url=($('#syncUrl')?.value||cfg.url||'').trim(), room=($('#syncRoom')?.value||cfg.room||'').trim();
  if(!url||!room){ toast('התחבר קודם (URL + קוד חדר)','r'); return; }
  const link=buildShareLink(url,room);
  const done=()=>toast('לינק השיתוף הועתק — שלח לצוות ✓','g');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(link).then(done).catch(()=>showShareLink(link)); }
  else showShareLink(link);
};
function showShareLink(link){
  openModal('לינק שיתוף לחלל העבודה', `
    <div class="small muted" style="margin-bottom:8px">שלח את הלינק לצוות — לחיצה עליו תחבר אותם אוטומטית לאותו מצב שמור:</div>
    <input class="f" value="${esc(link)}" onclick="this.select()" readonly>
    <div class="small muted" style="margin-top:8px">${IC('warn')} כל מי שיש לו את הלינק יכול לצפות ולערוך את נתוני הצוות.</div>`, '');
}
function applyShareLink(){
  try{
    const h=location.hash||''; if(!/(?:room|db)=/.test(h)) return false;
    const params=new URLSearchParams(h.replace(/^#/,''));
    const db=params.get('db'), room=params.get('room');
    if(db&&room){ const existing=getSyncCfg()||{};
      setSyncCfg({url:normalizeDbUrl(db), room:room, name:existing.name||'', auth:existing.auth||''});
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } // clean the URL
      return true;
    }
  }catch(e){}
  return false;
}
window.saveSyncCfg=()=>{
  const url=normalizeDbUrl($('#syncUrl').value);
  const cfg={url, room:$('#syncRoom').value.trim(), name:$('#syncName').value.trim(), auth:$('#syncAuth').value.trim()};
  if(!cfg.url||!cfg.room){ toast('נדרשים URL וקוד חדר','r'); return; }
  if(!/firebaseio\.com$|firebasedatabase\.app$/i.test(url)){
    toast('כתובת לא נראית כמו Realtime Database (צריכה להסתיים ב-firebaseio.com או firebasedatabase.app)','r'); return;
  }
  setSyncCfg(cfg); closeModal();
  // pull existing room state first, then connect + push if room empty
  fetch(syncUrl(cfg)).then(r=>{
    if(!r.ok) throw new Error('סטטוס '+r.status+' — בדוק את חוקי ה-Database (Rules: read/write=true)');
    return r.json();
  }).then(d=>{
    if(d&&d.quarters){ applyRemote(d); toast('התחבר — מצב הצוות נטען ✓','g'); }
    else { connectSync(); pushSync(); toast('התחבר — חדר חדש נוצר ✓','g'); return; }
    connectSync();
  }).catch(e=>{
    const net=/failed to fetch|networkerror|load failed/i.test(e.message);
    toast('שגיאת חיבור: '+(net?'לא ניתן להגיע לכתובת. ודא https://, שזו Realtime Database, ושאין חוסם פרסומות':e.message),'r');
    setSyncDot('var(--red)','שגיאה');
  });
};
window.disconnectSyncUI=()=>{ disconnectSync(); setSyncCfg(null); setSyncDot('var(--muted2)','לא מחובר'); closeModal(); toast('הסנכרון נותק'); };

/* ---------- Boot ---------- */
window.go=go;
function boot(){
  load();
  const joined=applyShareLink();
  renderNav(); renderQuarterSelect(); renderQBox(); go('dashboard');
  const ver=$('#appVer'); if(ver) ver.textContent=APP_VERSION;
  document.title=`Group 8 — EMBA 41 — TAU · INTOPIA ${APP_VERSION}`;
  window.addEventListener('resize',()=>{ if(currentPage==='dashboard')drawTrend($('#trendChart')); });
  if(getSyncCfg()) connectSync();
  if(joined) setTimeout(()=>toast('התחברת לחלל העבודה המשותף של הצוות ✓','g'),400);
}
boot();
</script>
