        + ` <br>${IC('warn')} ההלוואה האזורית מוגבלת לאחוז מעודף הנכסים השוטפים — <b>חריגה תקוצץ אוטומטית</b>. ואם יש באזור ני״ע ממשלתי קצר, לקיחת הלוואה <b>תמכור אותו אוטומטית</b>.</div>`;
      out.push({cat:'fin',level:'amber',conf:'rule',title:`מימון גישור — A3-2${citiClosed?'':' / H (CitiBank)'}`,form:'A3-2 (Invest or Borrow — Borrow) / H4',
        detail:`ההקרנה יורדת למינימום <b>${fmt(Math.round(minProj))} SF</b> מול כרית ביטחון ${fmt(safety)}${Object.values(g.floors||{}).some(v=>v>0)?' (הרצפה שהוגדרה)':' (ברירת מחדל — הגדר רצפות ביעדים)'}. הלוואה מקומית (ריבית ${S.config.params.interest.bank}%) עד כניסת הגבייה. חלופה: H4 בין-חברות. <b>מומלץ: לווה ${fmt(need)} SF</b> (גישור מינימלי). אופציות אחרות למטה.${windowWarn}`,
        dep:`קח את המימון רבעון לפני הצורך — הגבייה המדורגת מעכבת את המזומן גם אחרי שהמכירות מתחילות.`,
        optionCols:fo.optionCols, options:fo.options, sim:fo.options[0].sim});
    }
  }
  // Market research to buy (H1-2) — close the most expensive information gap
  const gaps=(S.learning&&S.learning.gaps)||[];
  // Separate the two completely different problems: a missing FREE study is an ingestion
  // failure, and a missing PAID study is a purchasing decision against only three slots.
  const gapsFree=gaps.filter(x=>x.free), gapsPaid=gaps.filter(x=>!x.free);
  const slots=mrPaidSlots(targetQ);
  if(gapsFree.length) out.push({cat:'strat',level:'amber',conf:'rule',
    title:`נתוני מחקר חינמיים חסרים — ${gapsFree.map(x=>x.mr).join(', ')} (אל תקנה!)`,
    form:'קליטה מחדש של הדוח — לא H1-2',
    detail:`<b>MR3, MR17 ו-MR28 מגיעים חינם ואוטומטית בכל רבעון</b> (מדריך §VI) — בדיוק בגלל זה יש רק <b>3 מקומות בתשלום</b>. `
      +`אם הם חסרים אצלך, זו תקלת קליטה ולא החלטת רכש:<br>`
      +gapsFree.map(x=>`<b>${x.mr}</b> — ${x.why}`).join('<br>')
      +`<br><b>קניית מחקר חינמי שורפת מקום בתשלום על מידע שכבר יש לך.</b>`,
    dep:'הדוח הרבעוני מכיל אותם ⟵ קליטה בלשונית 1 ⟵ מנוע הביקוש מתכייל.',
    action:"go('ingest')", actionLabel:'לקליטה מחדש'});
  if(gapsPaid.length) out.push({cat:'strat',level:'info',conf:'data',
    title:`קנה מחקרי שוק ב-${targetQ}: ${gapsPaid.slice(0,slots.left||3).map(x=>x.mr).join(' + ')}`,
    form:`H1-2 (Market Research) — ${slots.left} מתוך ${slots.max} מקומות בתשלום פנויים`,
    detail:`<b>3 מחקרים מגיעים חינם ואוטומטית</b> (MR3 מכירות תעשייה · MR17 דרגות שנמכרו · MR28 מחירי צרכן), ומעליהם מותר להזמין <b>עד 3 בתשלום לרבעון</b>. `
      +`אלה המשתלמים ביותר במצב הנוכחי:<br>`
      +gapsPaid.map(x=>`<b>${x.mr}</b> — ${x.why}`).join('<br>')
      +(slots.used?`<br><span class="small muted">כבר הוזמנו בתוכנית: ${slots.ordered.join(', ')}</span>`:''),
    dep:`תוצאות המחקר הן קלט להמלצות הרבעון הבא — בלעדיהן מנוע הביקוש נשאר לא מכויל.`,
    action:"openMRCatalog()", actionLabel:'הקטלוג המלא',
    sim:{q:targetQ,actions:[{form:'H1-2',note:gapsPaid.slice(0,slots.left||3).map(x=>x.mr).join(', ')}]}});
  // Sales offices (A1-3) — needed where we plan to sell
  const pcsNow=(op.inventory||[]).filter(i=>i.product==='Y').reduce((a,i)=>a+(i.qty||0),0);
  if(pcsNow>0 && (op.offices||0)===0){
    const sellRegion=((op.inventory||[]).find(i=>i.product==='Y')||{}).region||'europe';
    const regName=(REGIONS.find(r=>r.id===sellRegion)||{}).name||sellRegion;
    out.push({cat:'mkt',level:'amber',conf:'rule',title:`אין משרדי מכירות — פתח 2 ב${regName}`,form:'A1-3 (Open or Close Sales Offices)',
      detail:`מתכננים למכור ${fmt(pcsNow)} מחשבים אך רשומים 0 משרדי מכירות. משרדים מגבילים את תקרת המכירה לצרכן — פתח <b>2</b> ב${regName} יחד עם התמחור.`,
      dep:`נכנס לתוקף עם ההזנה — חייב להיות באותו רבעון של פתיחת המכירות.`,
      sim:{q:targetQ,regions:{[sellRegion]:{offices:2}}}});
  }
  // 8. Contracts at risk
  // Group contracts by product+grade so two near-identical cards (e.g. X3 for Q5 and Q6) become ONE
  // action with the combined shortfall, driven by the earliest delivery date.
  const _ctGroups={};
  S.config.contracts.forEach(c=>{ if(!c.deliveryQuarter || qIndex(c.deliveryQuarter)<qIndex(q)) return;
    const k=(c.product||'')+'|'+(c.grade!=null?c.grade:'');
    (_ctGroups[k]=_ctGroups[k]||[]).push(c); });
  Object.values(_ctGroups).map(list=>{
    const sorted=list.slice().sort((a,b)=>qIndex(a.deliveryQuarter)-qIndex(b.deliveryQuarter));
    const first=sorted[0];
    return Object.assign({},first,{
      qty:list.reduce((a,c)=>a+(c.qty||0),0),
      deliveryQuarter:first.deliveryQuarter,
      counterparty:list.length>1?`${first.counterparty||'התחייבות'} +${list.length-1}`:first.counterparty,
      note:list.length>1?`מקובץ מ-${list.length} חוזים: ${sorted.map(c=>`${c.deliveryQuarter} (${fmt(c.qty)})`).join(', ')}`:first.note,
      _schedule:sorted.map(c=>({q:c.deliveryQuarter, qty:c.qty||0})),
    });
  }).forEach(ct=>{ if(ct.deliveryQuarter && qIndex(ct.deliveryQuarter)>=qIndex(q)){
    // Grade matters: X0 chips cannot satisfy an X3 commitment. Only stock at or above the
    // contracted grade counts (the alert was fixed for this; this card had been left behind).
    const _cg=ct.grade!=null?ct.grade:0;
    const inv=op.inventory.filter(i=>i.product===ct.product && (i.grade!=null?i.grade:0)>=_cg).reduce((a,i)=>a+(i.qty||0),0);
    const short=(ct.qty||0)-inv; const prodGrade=(ct.product||'')+(ct.grade!=null?ct.grade:'');
    // Existing stock covers the tranches in delivery order. Drive the card from the FIRST
    // tranche still short — a grouped commitment shown against its earliest date would demand
    // the whole quantity a quarter (or more) too early and tie up cash for nothing.
    const sched=(ct._schedule&&ct._schedule.length)?ct._schedule:[{q:ct.deliveryQuarter,qty:ct.qty||0}];
    let _left=inv, due=null;
    for(const t of sched){ const unmet=Math.max(0,t.qty-_left); _left=Math.max(0,_left-t.qty);
      if(unmet>0){ due={q:t.q, qty:unmet}; break; } }
    if(!due) return;                      // every tranche already covered by stock of a suitable grade
    const dueNow=due.qty, dueQ=due.q;
    // Goods produced in a quarter enter inventory only at its end, so production must finish
    // one quarter before delivery (Data Log 08).
    const prodQ=QUARTERS[qIndex(dueQ)-1]||dueQ;
    const lead=qIndex(dueQ)-qIndex(q);
    if(short>0){ const urgent=qIndex(prodQ)<=qIndex(q)+1; // the deadline is the decision being made now
      const grd=ct.grade!=null?ct.grade:null, prd=ct.product||'X';
      const curGrade=prd==='X'?op.techX:op.techY;
      const gradeReady=grd==null||curGrade>=grd; // is the required tech grade already achieved?
      // Capacity only from plants DECLARED as making this product — never assumed.
      const _ci=capacityForProduct(prd);
      // How many plants of this product a quantity needs — "?" when the split is undeclared.
      const _perPlant=(DATALOG.capacity[prd]||{}).europe||0;
      const _plantsNeeded=n=> !_ci.known ? '?' : (_perPlant?String(Math.ceil(n/_perPlant)):'—');
      const capNote = !_ci.known
        ? `<b style="color:var(--amber)">קיבולת ${prd} לא ידועה — לא הוצהר אילו מפעלים מייצרים ${prd}. הצהר ב"הגדרות ויעדים → פרמטרים" לפני שתסמוך על המספר.</b>`
        : (_ci.units===0
          ? `<b style="color:var(--red)">אין מפעל שמייצר ${prd} — לא ניתן לייצר את ההתחייבות עצמאית. נדרש מפעל חדש (רבעון בנייה, זמין רק מ-${QUARTERS[qIndex(q)+2]||'מאוחר יותר'}) או רכישה מחברה אחרת (H6).</b>`
          : `קיבולת ${prd} מוצהרת ${fmt(_ci.units)}/רבעון → ${fmt(dueNow)} ${dueNow>_ci.units?`<b style="color:var(--red)">מעל הקיבולת — חסרים ${fmt(dueNow-_ci.units)}</b>`:'נכנס בקיבולת הקיימת'}`);
      out.push({cat:'ops',level:(urgent||!gradeReady)?'red':'amber',conf:'data',
      blocked: !gradeReady ? `נדרש קודם מו״פ להעלאת דרגה ל-${prodGrade} (אתה ב-${prd}${curGrade}). בצע את פעולת המו״פ (H1-1) לפני שאפשר לייצר.` : null,
      title:`${(urgent||!gradeReady)?'⚠ ':''}התחייבות ${prodGrade} — ${fmt(dueNow)} עד ${dueQ}${sched.length>1?` (מתוך ${fmt(short)} בסך הכל)`:''}${urgent?' — ייצר עכשיו!':''}`,form:`A2-3 (${prd==='X'?'Chip':'Computer'} Production) · דגם Deluxe`,
      detail:`<b>${esc(ct.counterparty||'התחייבות')}</b>: ${fmt(ct.qty)} × <b>${prodGrade} Deluxe</b> עד ${ct.deliveryQuarter}, במלאי ${fmt(inv)} — חסרים <b>${fmt(short)}</b>. ${ct.note?ct.note+'. ':''}${!gradeReady?`<b style="color:var(--red)">⚠ הדרגה טרם הושגה: אתה ב-${prd}${curGrade}, נדרש ${prodGrade} — חובה מו״פ (H1-1) עכשיו כדי לפתוח את הייצור.</b> `:''}${capNote?capNote+'. ':''}ייצור נכנס למלאי בסוף הרבעון וזמין למסירה רבעון אחריו — לכן <b>הייצור חייב להתבצע ב-${prodQ}</b>${urgent?' — כלומר בהחלטה שאתה מקבל עכשיו':''}.${ct._schedule&&ct._schedule.length>1?`<br><b>לוח האספקה בפועל:</b> ${ct._schedule.map(x=>`${fmt(x.qty)} ל-${x.q} (ייצור ב-${QUARTERS[qIndex(x.q)-1]||x.q})`).join(' · ')} — <b>אל תייצר את הכל מראש</b>, זה כובל מזומן רבעון מוקדם מדי.`:''}`,
      dep:`מו״פ→דרגה ${prodGrade} ⟵ ייצור A2-3 ⟵ מלאי סוף רבעון ⟵ מסירה. §4.14.2: אי-אספקה אינה כשל אלא השלמה אוטומטית בתעריף מזורז על חשבוננו.`,
      routes:(()=>{ try{ const cp=contractPlan().find(x=>x.deliveryQuarter===dueQ&&x.prod===prd); return cp?contractRoutes(cp):null; }catch(e){ return null; } })(),
      optionCols:['יח׳','דגם','מפעלים נדרשים'],options:[
        {name:`מנת ${dueQ} בלבד`,favors:'מייצר רק את מה שחייב להיות מוכן למסירה הקרובה — לא כובל מזומן מראש',
          cells:[fmt(dueNow),'Deluxe',_plantsNeeded(dueNow)],
          sim:{q:targetQ,regions:{europe:{production:dueNow,product:prd,model:'Deluxe',unitCost:0}}}},
        {name:'+ מלאי ביטחון 10%',favors:'כרית מפני פסולת/סטייה',
          cells:[fmt(Math.round(dueNow*1.1)),'Deluxe',_plantsNeeded(Math.round(dueNow*1.1))],
          sim:{q:targetQ,regions:{europe:{production:Math.round(dueNow*1.1),product:prd,model:'Deluxe',unitCost:0}}}},
        ...(sched.length>1?[{name:'כל ההתחייבות מראש',favors:'מסיים את הנושא — אך כובל מזומן רבעון או יותר מוקדם מהנדרש',
          cells:[fmt(short),'Deluxe',_plantsNeeded(short)],
          sim:{q:targetQ,regions:{europe:{production:short,product:prd,model:'Deluxe',unitCost:0}}}}]:[]) ],
      sim:{q:targetQ,regions:{europe:{production:dueNow,product:prd,model:'Deluxe',unitCost:0}}}}); } } });
  // 9a. ADVERTISING (A1-1/A1-2, Guide §5.4) — a lever in its own right, not a footnote of the
  // sell action. The engine sets each region's budget where the next unit of spend still pays
  // for itself, and says plainly where NOT to spend: below the effectiveness threshold the
  // money is simply wasted, and when supply — not demand — is the constraint it buys nothing.
  (()=>{
    const rows=[]; const simRegions={};
    REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
      const stock=(op.inventory||[]).filter(i=>i.product==='Y'&&(i.region||'')===r.id).reduce((a,i)=>a+(i.qty||0),0);
      if(!stock) return;
      const pa=priceAnchors(r.id,'Y'); const price=pa.base||0;
      // Size the budget on the volume that will ACTUALLY sell, from the same demand authority
      // the sell action uses — not on the theoretical market potential. Advertising sized on
      // 21,600 units while the sell plan moves 6,248 is a budget for sales that will not happen.
      const units=Math.min(stock, demandCeiling(r.id,'Y',price).units);
      if(!units) return;
      const cost=(op.inventory||[]).filter(i=>i.product==='Y'&&(i.region||'')===r.id&&i.cost>0).map(i=>i.cost)[0]||0;
      const ar=recommendAdSpend(r.id,'Y',units,price,cost);
      rows.push({r,units,price,ar});
      if(ar.spend>0) simRegions[r.id]={advertising:ar.spend};
    });
    if(!rows.length) return;
    const worth=rows.filter(x=>x.ar.spend>0), skip=rows.filter(x=>x.ar.spend===0);
    const total=worth.reduce((a,x)=>a+x.ar.spend,0);
    out.push({cat:'mkt', level: worth.length?'amber':'info', conf:'est',
      title: worth.length ? `תקציב פרסום ל-${targetQ} — ${fmt(total)} סה״כ` : 'פרסום — לא כדאי ברבעון הזה',
      form:'A1-2 (PC Prices & Advertising) · A1-1 לשבבים',
      detail:`תקציב הפרסום נקבע בנקודה שבה <b>השקל הבא מפסיק להחזיר את עצמו</b> (גמישות וסף לפי §5.4), ולא כאחוז שרירותי מההכנסה.<br>`
        +(worth.length?`<b>כדאי:</b> ${worth.map(x=>`${x.r.name} <b>${fmt(x.ar.spend)} ${x.r.cur}</b> (סף ${fmt(x.ar.threshold)}; תוספת צפויה ~${fmt(Math.round((advResponse(x.r.id,'Y',x.ar.spend).now-1)*x.units))} יח׳${x.ar.nextQuarterTail>0?`, ועוד ~${fmt(x.ar.nextQuarterTail)} ${x.r.cur} זולגים לרבעון הבא`:''})`).join(' · ')}<br>`:'')
        +(skip.length?`<b>לא כדאי:</b> ${skip.map(x=>`${x.r.name} — ${esc(x.ar.why)}`).join(' · ')}<br>`:'')
        +`<b>תזמון (§5.4):</b> הפרסום עובד <b>באותו רבעון שבו שולם</b> — זה החלק הגדול; השארית זולגת לרבעון הבא (הזנב הגדול ביותר בארה״ב, הקטן בברזיל).`,
      dep:'מלאי/ייצור זמין למכירה ⟵ מחיר מוזן (A1-2) ⟵ פרסום. פרסום בלי מחיר או בלי סחורה = כסף שנשרף.',
      sim: Object.keys(simRegions).length?{q:targetQ,regions:simRegions}:null});
  })();

  // 9b. IDLE CASH (A3-3, Data Log 07) — the financing actions above are all defensive. Cash
  // sitting still is not free: government securities pay every quarter, and Brazil pays 4.5%
  // (about 19% annualised). Only offers what is genuinely spare after the derived floor.
  (()=>{
    const floorNext=(function(){ try{ return floorComponents(q).total; }catch(e){ return 0; } })();
    // Cash is only idle after the floor AND after everything already recommended above will
    // consume. Without this the tool offered to deposit money it had just told you to spend.
    const committed=out.reduce((a,it)=>a+actionCashCostSF(it),0);
    const reserved=floorNext+committed;
    const totalCash=REGIONS.reduce((a,r)=>a+((f.cash[r.id]||0)*fxRate(r.cur)),0);
    if(totalCash<=reserved) return;                              // nothing genuinely spare
    const spareFrac=Math.max(0,(totalCash-reserved)/Math.max(1,totalCash));
    const rows=[];
    REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
      const cash=f.cash[r.id]||0; if(cash<=0) return;
      const rate=(DATALOG.interest.govSecurities[r.id]||0);
      const idle=Math.round(cash*spareFrac);                     // only this region's share of the true surplus
      if(idle<50000||rate<=0) return;
      rows.push({r,idle,rate,gain:Math.round(idle*rate/100)});
    });
    const hq=f.cash.hq||0, hqIdle=Math.round(hq*spareFrac-DATALOG.minHOCashSF);
    const hqRate=DATALOG.interest.hoSecurities.sf||0;
    if(!rows.length && hqIdle<50000) return;
    const totalGain=rows.reduce((a,x)=>a+x.gain,0)+(hqIdle>=50000?Math.round(hqIdle*hqRate/100):0);
    if(totalGain<5000) return;                                   // not worth an action card
    out.push({cat:'fin', level:'info', conf:'rule',
      title:`מזומן סרק — הפקד ${fmt(totalGain)} SF/רבעון של ריבית שלא נגבית`,
      form:'A3-3 (Invest in Government Securities) · H2 לניירות ערך במטה',
      detail:`מזומן שיושב ללא שימוש אינו ניטרלי — הוא ריבית שלא נגבית. שיעורים רבעוניים (Data Log 07): `
        +`ארה״ב ${DATALOG.interest.govSecurities.us}% · אירופה ${DATALOG.interest.govSecurities.europe}% · <b>ברזיל ${DATALOG.interest.govSecurities.brazil}%</b> · מטה ${hqRate}%.<br>`
        +(rows.length?rows.map(x=>`<b>${x.r.name}</b>: פנוי ~${fmt(x.idle)} ${x.r.cur} → ${x.rate}% = <b>${fmt(x.gain)} ${x.r.cur}/רבעון</b>`).join(' · ')+'<br>':'')
        +(hqIdle>=50000?`<b>מטה</b>: פנוי ~${fmt(hqIdle)} SF → ${hqRate}% = <b>${fmt(Math.round(hqIdle*hqRate/100))} SF/רבעון</b><br>`:'')
        +`<b>שים לב:</b> החידוש דורש החלטה מפורשת בכל רבעון (Data Log 07). הסכום חושב <b>אחרי</b> רצפת המזומן הנגזרת (${fmt(Math.round(floorNext))} SF) <b>ואחרי</b> כל מה שההמלצות שמעליו כבר מוציאות (${fmt(Math.round(committed))} SF) — זהו העודף האמיתי בלבד.`,
      dep:'רצפת מזומן מכוסה ⟵ עודף אמיתי ⟵ הפקדה. חידוש נדרש כל רבעון מחדש.',
      sim: rows.length?{q:targetQ,regions:Object.fromEntries(rows.map(x=>[x.r.id,{invest:x.idle}]))}:null});
  })();

  // 9. Debt — only worth raising when the company is actually cash-healthy (positive RE, ample cash)
  if((f.loans||0)>0 && (f.retainedEarnings||0)>=0 && (f.consolidated||unifiedCashOf(q)) > (f.loans||0)*2 && !brk && minProj>=safety)
    out.push({cat:'fin',level:'info',title:'שקול פירעון חוב',form:'A3-2 / H4 (מימון)',
      detail:`יש חוב ${fmt(f.loans)} וריבית שוטפת. עם עודף מזומן ורווחים צבורים חיוביים, פירעון חלקי חוסך ריבית ומשפר יחסים — אם אין שימוש טוב יותר למזומן.`});
  if(!out.length) out.push({cat:'strat',level:'good',title:'המצב יציב — המשך התוכנית',detail:'אין נורות אדומות והרצפות נשמרות. המשך לפי היעדים ובחן תרחישים בסימולטור.'});
  // sort by severity
  const ord={red:0,amber:1,info:2,good:3};
  out.sort((a,b)=>ord[a.level]-ord[b.level]);
  return out;
}

  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)handleFile(f); });
}
function xlsxReady(){ return typeof XLSX!=='undefined' && XLSX && XLSX.read; }
function handleFile(file){
  const info=$('#sheetInfo');
  if(!xlsxReady()){ info.innerHTML=`<div class="tag r">ספריית קריאת האקסל לא נטענה (אין חיבור אינטרנט?). ניתן להזין את נתוני הרבעון ידנית בטופס למטה.</div>`; return; }
  info.innerHTML=`<div class="chip">${IC('clock')} מנתח ${esc(file.name)}…</div>`;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const parsed=parseWorkbook(wb); applyParsed(parsed);
      info.innerHTML=`
        <div class="tag g" style="margin-bottom:8px">✓ נקלט: ${esc(file.name)}</div>
        <div class="small muted">גיליונות: ${wb.SheetNames.map(n=>`<span class="chip" style="margin:2px">${esc(n)} ${matchSheet(n)?IC('check'):''}</span>`).join('')}</div>
        <div class="small" style="margin-top:8px">חולצו: ${parsed.summary}. אמת/תקן למטה ואשר. <b>MR שנקלטו: ${parsed.mrCount}</b></div>`;
      renderVerifyForm($('#verifyForm')); toast('קובץ נותח — אמת את הערכים','g');
    }catch(err){ info.innerHTML=`<div class="tag r">שגיאת ניתוח: ${esc(err.message)}</div><div class="small muted" style="margin-top:6px">ניתן להזין ידנית בטופס למטה.</div>`; }
  };
  reader.readAsArrayBuffer(file);
}
function matchSheet(name){ const n=name.toLowerCase();
  if(/balance/.test(n))return'balance'; if(/income|profit|p&l/.test(n))return'income';
  if(/manag|mgmt|info/.test(n))return'mgmt'; if(/curren|fx/.test(n))return'currency';
  if(/^mr\b|market research|mr\s*\d/.test(n))return'mr'; return null; }
function parseNumber(v){
  if(typeof v==='number')return isNaN(v)?null:v; if(typeof v!=='string')return null;
  const neg=/^\(.*\)$/.test(v.trim());
  const cleaned=v.replace(/[(),\s€$₪R]/g,''); if(cleaned===''||isNaN(cleaned))return null;
  let n=parseFloat(cleaned); if(neg)n=-Math.abs(n); return n;
}
/* Normalize a row label: uppercase, strip a leading digit artifact ("0TOTAL..."), collapse spaces. */
function normLabel(s){ return String(s==null?'':s).toUpperCase().replace(/^[^A-Z(]+/,'').replace(/\s+/g,' ').trim(); }
function rowsOf(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); }
function findRow(rows,re){ return rows.find(r=> re.test(normLabel(r&&r[0]))); }
function findRows(rows,re){ return rows.filter(r=> re.test(normLabel(r&&r[0]))); }

/* Balance Sheet / Income Statement share the column layout:
   col0=label, US=2, EC/EU=4, BRAZIL=6, LIECHTENSTEIN(HQ)=7, CONSOLIDATED=8. */
const IS_COL={us:2,europe:4,brazil:6,hq:7,cons:8};
function cell(rows,re,col){ const r=findRow(rows,re); return r?parseNumber(r[col]):null; }
function sumRows(rows,re,col){ return findRows(rows,re).reduce((a,r)=>{ const n=parseNumber(r[col]); return a+(n||0); },0); }

function extractBalance(rows,scan,f){
  const cashRow=findRow(rows,/^CASH$/);
  if(cashRow){ scan.cash={}; REGIONS.forEach(r=>{ const v=parseNumber(cashRow[IS_COL[r.id]]); if(v!==null)scan.cash[r.id]=v; });
    const cons=parseNumber(cashRow[IS_COL.cons]); if(cons!==null)scan.consolidated=cons; f.push('מזומן לפי אזור + מאוחד'); }
  const ar=sumRows(rows,/^A\/R PERIOD/,IS_COL.cons); if(findRow(rows,/^A\/R PERIOD/)){ scan.ar=ar; f.push('A/R'); }
  const ap=sumRows(rows,/^A\/P PERIOD/,IS_COL.cons); if(findRow(rows,/^A\/P PERIOD/)){ scan.ap=ap; f.push('A/P'); }
  const sc=cell(rows,/^SUPPLIER CREDIT/,IS_COL.cons); if(sc!==null){ scan.supplierCredit=sc; f.push('אשראי ספקים'); }
  const area=cell(rows,/^AREA BANK LOANS/,IS_COL.cons)||0, bank=cell(rows,/^BANK LOANS PAYABLE/,IS_COL.cons)||0, bonds=cell(rows,/^LONG.?TERM BONDS/,IS_COL.cons)||0;
  if(findRow(rows,/BANK LOANS/)){ scan.loans=area+bank+bonds; f.push('הלוואות'); }
  const re=cell(rows,/^RETAINED EARNINGS/,IS_COL.cons); if(re!==null){ scan.retainedEarnings=re; f.push('רווחים צבורים'); }
  const sec=cell(rows,/^GOVERNMENT SECURITIES/,IS_COL.cons); if(sec!==null){ scan.securities=sec; }
  const plant=cell(rows,/^NET PLANT AND EQUIPMENT/,IS_COL.cons); if(plant!==null) scan.netPlant=plant;
  const ta=cell(rows,/^TOTAL ASSETS/,IS_COL.cons); if(ta!==null) scan.totalAssets=ta;
  const cs=cell(rows,/^COMMON STOCK/,IS_COL.cons); if(cs!==null) scan.commonStock=cs;
  const teq=cell(rows,/^TOTAL EQUITY/,IS_COL.cons); if(teq!==null) scan.totalEquity=teq;
}
function extractIncome(rows,scan,f){
  const ne=cell(rows,/^NET EARNINGS$/,IS_COL.cons); if(ne!==null){ scan.netProfit=ne; f.push('רווח נקי'); }
  const gm=cell(rows,/^TOTAL GROSS MARGIN/,IS_COL.cons); if(gm!==null) scan.grossMargin=gm;
  // Revenue = consumer sales (standard + deluxe), consolidated
  const consumer=sumRows(rows,/^CONSUMER$/,IS_COL.cons); if(findRow(rows,/^CONSUMER$/)){ scan.revenue=consumer; f.push('מחזור (מכירות צרכן)'); }
  const rdChip=cell(rows,/^R & D NEW CHIP/,IS_COL.cons)||0, rdPc=cell(rows,/^R & D NEW PC/,IS_COL.cons)||0;
  if(findRow(rows,/R & D NEW/)){ scan.rd=rdChip+rdPc; f.push('מו״פ (Chip+Computer)'); }
  const mr=cell(rows,/^MARKET RESEARCH/,IS_COL.cons); if(mr!==null) scan.marketResearch=mr;
  const ie=cell(rows,/^INTEREST EXPENSE/,IS_COL.cons); if(ie!==null) scan.interestExp=ie;
}
/* Management Info layout: US chip=1 pc=3, EC/EU chip=4 pc=6, BRAZIL chip=7 pc=9 (single-value rows use the chip column). */
const MG_MAIN=[1,4,7], MG_PC=[3,6,9];
function extractMgmt(rows,scan,f){
  const sumCols=(re,cols)=>{ const r=findRow(rows,re); if(!r)return null; return cols.reduce((a,c)=>a+(parseNumber(r[c])||0),0); };
  const maxCols=(re,cols)=>{ const r=findRow(rows,re); if(!r)return null; return Math.max(...cols.map(c=>parseNumber(r[c])||0)); };
  // The MIS row is laid out CHIP,PC per area: [US-X, _, US-Y, EU-X, _, EU-Y, BR-X, _, BR-Y].
  // This used to read cells 1/4/7 as "the area total", which are in fact the CHIP columns —
  // so four European plants were reported as two, and the X/Y split the report states plainly
  // was thrown away and then asked of the user by hand.
  const pr=findRow(rows,/^PLANTS BUILT AND BUILDING/);
  if(pr){
    const byProd={ us:{X:parseNumber(pr[1])||0, Y:parseNumber(pr[3])||0},
                   europe:{X:parseNumber(pr[4])||0, Y:parseNumber(pr[6])||0},
                   brazil:{X:parseNumber(pr[7])||0, Y:parseNumber(pr[9])||0} };
    scan.plantsByProduct=byProd;
    scan.plantsByRegion={ us:byProd.us.X+byProd.us.Y, europe:byProd.europe.X+byProd.europe.Y, brazil:byProd.brazil.X+byProd.brazil.Y };
    scan.factories=scan.plantsByRegion.us+scan.plantsByRegion.europe+scan.plantsByRegion.brazil;
    f.push('מפעלים לפי מוצר');
  }
  const offices=sumCols(/REG.? SALES OFFICES/,MG_MAIN); if(offices!==null){ scan.offices=offices; f.push('משרדים'); }
  const ownChip=maxCols(/^MAX.? OWNED GRADE/,MG_MAIN), ownPc=maxCols(/^MAX.? OWNED GRADE/,MG_PC);
  if(ownChip!==null){ scan.techX=ownChip; scan.techY=ownPc; f.push('רמות Chip/Computer'); }
  const prod=maxCols(/^MAX.? PRODUCIBLE GRADE/,MG_MAIN); if(prod!==null){ scan.maxProducible=prod; f.push('Max Producible'); }
  // Ending inventory -> items (only where units>0)
  const inv=[];
  const addInv=(re,gradeLabel)=>{ const r=findRow(rows,re); if(!r)return;
    REGIONS.filter(x=>x.id!=='hq').forEach((reg,idx)=>{ const units=parseNumber(r[MG_MAIN[idx]])||0, pcUnits=parseNumber(r[MG_PC[idx]])||0;
      // canonical product codes (X=Chip, Y=PC) so the chip guard, demand model and role views all recognise items
      if(units>0) inv.push({product:'X',region:reg.id,grade:gradeLabel,qty:units,cost:0,price:0});
      if(pcUnits>0) inv.push({product:'Y',region:reg.id,grade:gradeLabel,qty:pcUnits,cost:0,price:0}); }); };
  addInv(/^STANDARD UNITS/,'Standard'); addInv(/^DELUXE UNITS/,'Deluxe');
  if(inv.length){ scan.inventory=inv; f.push('מלאי סגירה'); }
}
function extractCurrency(rows,scan){
  const er=findRow(rows,/^EXCHANGE RATE/); // US EC/EU BRAZIL LIECHT (units per CHF)
  if(er){ scan.gameRates={us:parseNumber(er[1]),europe:parseNumber(er[2]),brazil:parseNumber(er[3]),hq:parseNumber(er[4])}; }
}

function parseWorkbook(wb){
  const scan={}; let mrCount=0; const found=[];
  wb.SheetNames.forEach(sn=>{
    const type=matchSheet(sn); const ws=wb.Sheets[sn]; if(!ws)return;
    const rows=rowsOf(ws);
    if(type==='mr'){ mrCount++; ingestMR(sn,rows); return; }
    if(type==='balance') extractBalance(rows,scan,found);
    else if(type==='income') extractIncome(rows,scan,found);
    else if(type==='mgmt') extractMgmt(rows,scan,found);
    else if(type==='currency') extractCurrency(rows,scan);
  });
  const uniq=[...new Set(found)];
  return {scan,mrCount,summary: uniq.length? uniq.join(' · ') : 'לא זוהו שדות מוכרים — בדוק שהקובץ הוא דוח INTOPIA', applied:uniq};
}
function applyParsed({scan}){
  const Q=S.quarters[S.activeQuarter], f=Q.financial, op=Q.operational;
  if(scan.cash){ REGIONS.forEach(r=>{ if(scan.cash[r.id]!==undefined) f.cash[r.id]=scan.cash[r.id]; }); }
  ['consolidated','netProfit','revenue','grossMargin','retainedEarnings','loans','ap','ar','supplierCredit','securities','netPlant','totalAssets','commonStock','totalEquity','interestExp','marketResearch'].forEach(k=>{ if(scan[k]!==undefined&&scan[k]!==null) f[k]=scan[k]; });
  ['techX','techY','maxProducible','factories','offices','rd','plantsByRegion','plantsByProduct'].forEach(k=>{ if(scan[k]!==undefined&&scan[k]!==null) op[k]=scan[k]; });
  // The report states the split, so the manual declaration stops being required — it becomes
  // an override for the rare case the team knows better than the sheet.
  if(scan.plantsByProduct){ S.config.plantSplit=S.config.plantSplit||{};
    Object.entries(scan.plantsByProduct).forEach(([rid,v])=>{ S.config.plantSplit[rid]={X:v.X,Y:v.Y}; }); }
  if(scan.inventory&&scan.inventory.length) op.inventory=scan.inventory;
  if(scan.gameRates) S.config.params.gameRates=scan.gameRates;
  save();
}
function ingestMR(sheetName,rows){
  const Q=S.quarters[S.activeQuarter]; const mi=Q.marketIntel;
  // skip the "does not exist this quarter" placeholder sheet
  const flat=rows.map(r=>r.join(' ')).join(' ').toLowerCase();
  if(/does not exist in this quarter/.test(flat)) return;
  if(!mi.sources.includes(sheetName)) mi.sources.push(sheetName);
  if(/74/.test(sheetName)) extractMR74(rows,mi);
  else if(/17|28/.test(sheetName)) extractMR1728(rows,mi);
  else { if(!mi.generic.some(g=>g.source===sheetName)) mi.generic.push({source:sheetName,rows:rows.length}); }
  save(true);
}
/* MR74 = consolidated Balance Sheet + Income Statement for all companies (000s CHF).
   Companies are in columns 1..N under a "COMPANY | CO. 1 | CO. 2 ..." header row. */
function extractMR74(rows,mi){
  const hdr=rows.find(r=> /^COMPANY$/.test(normLabel(r[0])) && /CO\.?\s*\d/.test(String(r[1]||'')));
  if(!hdr) return;
  const cols=[]; // {idx, num}
  hdr.forEach((v,i)=>{ const m=String(v).match(/CO\.?\s*(\d+)/i); if(m) cols.push({idx:i, num:parseInt(m[1],10)}); });
  const val=(re,c)=>{ const r=findRow(rows,re); return r?(parseNumber(r[c])||0):null; };
  cols.forEach(c=>{
    const co='CO '+c.num;
    const rec={ num:c.num,
      cash: val(/^CASH$/,c.idx), securities: val(/^SECURITIES/,c.idx), plant: val(/^NET PLANT/,c.idx),
      totalAssets: val(/^TOTAL ASSETS/,c.idx), bankLoans: val(/^BANK LOANS PAYABLE/,c.idx),
      retainedEarnings: val(/^RETAINED EARNINGS/,c.idx), equity: val(/^TOTAL EQUITY/,c.idx),
      netEarnings: val(/^NET EARNINGS/,c.idx), grossMargin: val(/^TOTAL GROSS MARGIN/,c.idx),
      rdChip: val(/^R & D NEW CHIP/,c.idx), rdPc: val(/^R & D NEW PC/,c.idx),
      marketResearch: val(/^MARKET RESEARCH/,c.idx), interestExp: val(/^INTEREST EXPENSE/,c.idx),
      unit:'000 CHF' };
    mi.competitors[co]=Object.assign(mi.competitors[co]||{}, rec);
  });
}
/* MR17&28 cells come in two formats depending on the report:
   - "X0:50" / "Y1:130"  = grade:price (competitor PRICE intelligence) → mi.compPrices
   - a plain number       = consumer UNITS sold                        → mi.sales */
function extractMR1728(rows,mi){
  // column layout: US CHIP-STD=1 DEL=2 PC-STD=3 DEL=4 ; EU 5-8 ; BRAZIL 9-12
  const layout=[
    {region:'us',product:'Chip',grade:'Standard',col:1},{region:'us',product:'Chip',grade:'Deluxe',col:2},
    {region:'us',product:'Computer',grade:'Standard',col:3},{region:'us',product:'Computer',grade:'Deluxe',col:4},
    {region:'europe',product:'Chip',grade:'Standard',col:5},{region:'europe',product:'Chip',grade:'Deluxe',col:6},
    {region:'europe',product:'Computer',grade:'Standard',col:7},{region:'europe',product:'Computer',grade:'Deluxe',col:8},
    {region:'brazil',product:'Chip',grade:'Standard',col:9},{region:'brazil',product:'Chip',grade:'Deluxe',col:10},
    {region:'brazil',product:'Computer',grade:'Standard',col:11},{region:'brazil',product:'Computer',grade:'Deluxe',col:12},
  ];
  mi.sales=mi.sales.filter(s=>s.source!=='MR17&28');
  mi.compPrices=(mi.compPrices||[]).filter(s=>s.source!=='MR17&28');
  rows.forEach(r=>{ const m=String(r[0]||'').match(/COMPANY\s*(\d+)/i); if(!m)return; const num=parseInt(m[1],10);
    layout.forEach(L=>{ const raw=r[L.col]; if(raw==null||raw==='')return; const s=String(raw).trim();
      const gp=s.match(/([XY])\s*(\d+)\s*:\s*(\d+(?:\.\d+)?)/i); // "X0:50" grade:price
      if(gp){ mi.compPrices.push({company:num, region:L.region, product:L.product, model:L.grade, grade:parseInt(gp[2],10), price:parseFloat(gp[3]), source:'MR17&28'}); }
      else { const u=parseNumber(s); if(u&&u>0) mi.sales.push({company:num, region:L.region, product:L.product, grade:L.grade, units:u, source:'MR17&28'}); }
    });
  });
}
// Median observed competitor price for a region+product from the latest MR (null if none seen).
function mrMarketPrice(regionId, product){
  const prodName = product==='X' ? 'Chip' : 'Computer';
  const last=latestEntered(); if(!last) return null;
  const cp=((S.quarters[last].marketIntel||{}).compPrices||[]).filter(p=>p.region===regionId && p.product===prodName && p.company!==OUR_CO && p.price>0);
  if(!cp.length) return null;
  const ps=cp.map(p=>p.price).sort((a,b)=>a-b);
  return { median:ps[Math.floor(ps.length/2)], min:ps[0], max:ps[ps.length-1], n:cp.length };
}

function intelInsights(comps,mi){
  const out=[]; const us=comps.find(c=>c.num===OUR_CO); if(!us) return out;
  const sorted=(key,dir=1)=>[...comps].filter(c=>c[key]!=null).sort((a,b)=>(b[key]-a[key])*dir);
  const rankOf=(arr)=>arr.findIndex(c=>c.num===OUR_CO)+1;
  const n=comps.length;
  // Retained earnings position (= 50% of final score)
  const reRank=rankOf(sorted('retainedEarnings')); const reLeader=sorted('retainedEarnings')[0];
  out.push(`ברווחים צבורים אנחנו במקום <b>${reRank}/${n}</b> (המוביל: חברה ${reLeader.num} עם ${fmt(reLeader.retainedEarnings)}). זה 50% מהציון הסופי — ${reRank>n/2?'<span style="color:var(--amber)">פער לסגור: להאיץ מכירות ורווחיות</span>':'עמדה טובה, לשמר'}.`);
  // Cash war-chest
  const cashRank=rankOf(sorted('cash'));
  out.push(`במזומן אנחנו במקום <b>${cashRank}/${n}</b> (${fmt(us.cash)}) — ${cashRank<=3?'יתרון להשקעה אגרסיבית בייצור/פרסום כשמתחילות המכירות':'לשמור על נזילות מול הרצפות'}.`);
  // R&D pressure by product
  const rdChipLeaders=sorted('rdChip').filter(c=>c.num!==OUR_CO && c.rdChip>0).slice(0,2);
  const rdPcLeaders=sorted('rdPc').filter(c=>c.num!==OUR_CO && c.rdPc>0).slice(0,2);
  if(rdChipLeaders.length) out.push(`לחץ טכנולוגי ב-<b>Chip</b>: חברות ${rdChipLeaders.map(c=>c.num+' ('+fmt(c.rdChip)+')').join(', ')} משקיעות במו״פ Chip — שקול להדביק כדי לא לפגר בדרגה.`);
  if(rdPcLeaders.length) out.push(`לחץ טכנולוגי ב-<b>Computer</b>: חברות ${rdPcLeaders.map(c=>c.num+' ('+fmt(c.rdPc)+')').join(', ')} משקיעות במו״פ Computer.`);
  // Our own R&D vs field
  const avgRd=comps.reduce((a,c)=>a+((c.rdChip||0)+(c.rdPc||0)),0)/n; const ourRd=(us.rdChip||0)+(us.rdPc||0);
  out.push(`מו״פ שלנו ${fmt(ourRd)} מול ממוצע השוק ${fmt(Math.round(avgRd))} — ${ourRd>=avgRd?'מעל הממוצע, שומר על קצב טכנולוגי':'<span style="color:var(--amber)">מתחת לממוצע — סיכון לפיגור בדרגה</span>'}.`);
  // Aggressive intel gatherers
  const mrLeaders=sorted('marketResearch').filter(c=>c.num!==OUR_CO && c.marketResearch>0).slice(0,2);
  if(mrLeaders.length) out.push(`חברות ${mrLeaders.map(c=>c.num).join(', ')} רוכשות הכי הרבה מחקרי שוק — הן אוספות עלינו מודיעין; שמור על גמישות ואל תשדר כוונות.`);
  // Debt exposure of rivals (opportunity)
  const highDebt=sorted('bankLoans').filter(c=>c.num!==OUR_CO).slice(0,1)[0];
  if(highDebt&&highDebt.bankLoans>us.bankLoans*1.5) out.push(`חברה ${highDebt.num} ממונפת מאוד (הלוואות ${fmt(highDebt.bankLoans)}) — פגיעה לתחרות מחירים אם נלחץ.`);
  // Market share (if sales exist)
  if((mi.sales||[]).length){ const byCo={}; mi.sales.forEach(s=>byCo[s.company]=(byCo[s.company]||0)+s.units);
    const total=Object.values(byCo).reduce((a,b)=>a+b,0)||1; const ourShare=(byCo[OUR_CO]||0)/total*100;
    out.push(`נתח השוק שלנו ${ourShare.toFixed(1)}% — ${ourShare<10?'<span style="color:var(--red)">נמוך, בחן מחיר/פרסום</span>':'מבוסס'}.`);
  } else { out.push(`אין עדיין נתוני מכירות (MR17&28) — נצל את החלון להיערכות לפני שהמתחרים תופסים שוק.`); }
  out.push(`${IC('lock')} הבחנה: MR17&28 מראה יחידות <u>שנמכרו</u>, לא דרגות טכנולוגיה. לדרגות מתחרים — רכוש מחקר ייעודי לפני החלטת מו״פ גדולה.`);
  return out;
}

function marketCapUnits(product, regionId){
  const cap=(DATALOG.capacity[product]&&DATALOG.capacity[product][regionId])||0;
  const share=product==='X' ? (RULES.potential.chipShareOfPcMarket[regionId] ?? 0.25) : 1;
  let units=cap*share*RULES.potential.pcPlantsPerArea;

  const nn=marketingFirmsIn(regionId, product);

function marketingFirmsIn(regionId, product){

  const sales=last.sales||[]; if(!sales.length) return null;

// Additive/idempotent: make sure every non-zero engine field has a matching action card, without
// removing note actions or ones the user added. Used after applying a Decisions-tab recommendation.
function syncActionsToLevers(lv){ lv.actions=lv.actions||[]; const g=()=>Math.random().toString(36).slice(2,8);
  const has=(form,region)=>lv.actions.some(a=>a.form===form&&a.region===region);
  const add=(form,region)=>{ if(!has(form,region)) lv.actions.push({aid:g(),form,region}); };
  if((lv.rd||0)>0) add('H1-1',undefined);
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const rl=lv.regions[r.id]||{};
    if((rl.production||0)>0) add(rl.product==='X'?'A2-3':'A2-4',r.id);
    if((rl.sales||0)>0||(rl.price||0)>0||(rl.advertising||0)>0) add(rl.product==='X'?'A1-1':'A1-2',r.id);
    if((rl.newFac||0)>0) add('A2-1',r.id);
    if((rl.offices||0)>0) add('A1-3',r.id);
    if((rl.transferIn||0)>0) add('A3-1',r.id);
    if((rl.invest||0)>0) add('A3-2',r.id);
  });
}
// Zero out the engine fields an action controls, so the projection always matches the visible action list.
function clearActionFields(lv,act){ const sf=simForm(act.form); if(!sf)return;
  if(sf.kind==='rd'){ lv.rd=0; return; }
  const rl=lv.regions[act.region]; if(!rl)return;
  if(sf.kind==='produce'){ rl.production=0; rl.unitCost=0; }
  else if(sf.kind==='price'){ rl.price=0; rl.qtySold=0; rl.sales=0; rl.advertising=0; rl.advPct=null; rl.margin=null; }
  else if(sf.kind==='offices') rl.offices=0;
  else if(sf.kind==='factory') rl.newFac=0;
  else if(sf.kind==='transfer') rl.transferIn=0;
  else if(sf.kind==='invest') rl.invest=0;
}
/* FIX #74 — routing a field edit to the right production line.
   Line 0 is the region object itself (kept for backward compatibility with every saved
   scenario); a second product in the same area lives in rl.lines[0]. That is precisely the
   case the tool could not express: 48,000 chips AND 18,000 computers in Europe. */
function lineFor(lv, region, product){
  const rl=lv.regions[region]; if(!rl) return null;
  const want=(product==='X'?'X':'Y');
  const primaryEmpty=!(rl.production>0||rl.sales>0||rl.qtySold>0||rl.price>0);
  if(primaryEmpty || rl.product===want){ rl.product=want; return rl; }
  rl.lines=Array.isArray(rl.lines)?rl.lines:[];
  let ln=rl.lines.find(l=>l.product===want);
  if(!ln){ ln={product:want,grade:null,model:'Standard',production:0,unitCost:0,price:0,qtySold:0,sales:0,advertising:0}; rl.lines.push(ln); }
  return ln;
}
/* Which line an action edits, from its form's product. */
function lineOfAction(lv, act){
  const sf=simForm(act.form);
  if(!act.region||!sf||!sf.product) return lv.regions[act.region]||null;
  return lineFor(lv, act.region, sf.product);
}

  const sf=simForm(form); const region=sf.scope==='region'?'us':undefined;
  // FIX #74: two produce (or two price) actions in one area are legal when they are for
  // DIFFERENT products — a chip line and a PC line coexist. Only an identical form is a dupe.
  const dupe=lv.actions.some(a=>{ if(a.region!==region) return false; return a.form===form; });
  if(dupe){ toast('הפעולה הזו כבר קיימת באזור הזה — ערוך אותה או בחר אזור אחר','a'); return; }
  const act={aid:Math.random().toString(36).slice(2,8),form,region};

  // Production capability = PLANTS, not inventory. A region can hold finished goods (for selling) with no
  // plant, so inventory must never imply you can produce there. Authoritative signal: per-region plants.
  const plantsBy=op.plantsByRegion||null;
  const hasPlants=plantsBy && Object.keys(plantsBy).some(k=>plantsBy[k]>0);
  let activeRegions, activeSrc;
  if(hasPlants){ activeRegions=REGIONS.filter(r=>r.id!=='hq' && plantsBy[r.id]>0); activeSrc='מפעלים'; }
  else { // no per-region plant data yet — proxy by where FINISHED PCs sit (produced at a plant); re-ingest for accuracy
    activeRegions=REGIONS.filter(r=>r.id!=='hq' && (op.inventory||[]).some(i=>i.product==='Y'&&(i.region||'')===r.id&&(i.qty||0)>0));

  const totalPlantCap=prodRegions.reduce((a,r)=>a+regionCap(r),0)||1;

    const levers={};

    const exportMk=markets.filter(r=>!prodRegions.some(x=>x.id===r.id));
    const expDem=exportMk.reduce((a,r)=>a+demandBy[r.id],0)||1;
    exportMk.forEach(r=>{ const want=Math.round(remain*(demandBy[r.id]/expDem)); const s=Math.max(0,Math.min(want,demandBy[r.id],remain)); sellBy[r.id]=s; remain-=s; });

      // FIX #72 (P0): the price typed into A1-1/A1-2 is the PRICE lever, not revenue/output.
      const price=Math.round(linePrice(l));
      const tag=`${r.name} — ${isX?'Chip':'PC'} ${model}${l.grade!=null?` דרגה ${l.product}${l.grade}`:''}`;
      if(l.sales>0||l.advertising>0||price>0||l.qtySold>0)

          `מחיר/יח׳ ${r.cur} · כמות ${fmt(l.qtySold||0)} יח׳ · פרסום ${fmt(l.advertising||0)} ${r.cur} · מכירות ${fmt(l.sales||0)} ${r.cur}`,
          price>0?'':'חובה');
      if(l.production>0)
        add(isX?'A2-3':'A2-4',`ייצור ${tag}`,l.production,
          l.unitCost?`עלות/יח׳ ${fmt(l.unitCost)} ${r.cur} · נכנס למלאי בסוף ${targetQ}, נמכר מ-${QUARTERS[qIndex(targetQ)+1]||'הבא'}`:'',
          l.unitCost>0?'':'חסרה עלות');

    if((rl.offices||0)>0)
      add('A1-3',`משרדי מכירות — ${r.name}`,rl.offices,`יעד ${rl.offices} משרדים · נכנס לתוקף בסוף הרבעון`);
    if((rl.newFac||0)>0)

    if(rl.transferIn>0)
      add('A3-1',`Money Transfer — מהמטה אל ${r.name}`,rl.transferIn,`${r.cur} · From/To Home Office = To Area`);
    if(rl.transferOut>0)
      add('A3-1',`Money Transfer — מ${r.name} אל המטה`,rl.transferOut,
        `${r.cur} · עמלת המרה ${(DATALOG.exchangeCommission[r.id]||0)}% ≈ ${fmt(Math.round(rl.transferOut*(DATALOG.exchangeCommission[r.id]||0)/100))} ${r.cur}`);
    if(rl.invest>0)
      add('A3-2',`השקעה/הלוואה מקומית — ${r.name}`,rl.invest,`${r.cur} · סמן Borrow או Invest`);
    if(rl.convertAll) add('A3-3',`המרת כל המט״ח באזור — ${r.name}`,1,'כן — ממיר את כל היתרות הזרות למקומי');
    if(rl.chipsToPC>0)
      add('A4',`העברת שבבים למפעלי המחשבים — ${r.name}`,rl.chipsToPC,'מחיר העברה פנימי + יח׳ לשמירה לצרכן + עדיפות עיבוד');
  });

  /* ---------- H · Liechtenstein ---------- */
  // R&D: split when the plan carries a split, one line otherwise.
  const rdX=lev.rdX||0, rdY=lev.rdY||0;

    if(rdX>0) add('H1-1','מו״פ — Chip/X',rdX,`מינימום חוקי ${fmt(DATALOG.rdMinPerQuarter.X)} SF`,rdX<DATALOG.rdMinPerQuarter.X?'מתחת למינימום':'');
    if(rdY>0) add('H1-1','מו״פ — PC/Y',rdY,`מינימום חוקי ${fmt(DATALOG.rdMinPerQuarter.Y)} SF`,rdY<DATALOG.rdMinPerQuarter.Y?'מתחת למינימום':'');
  } else if((lev.rd||0)>0){
    add('H1-1','מו״פ (Liechtenstein) — Chip/X + PC/Y',lev.rd,

  if(mrs.length){
    const paid=mrs.filter(c=>!MR_FREE.includes(c));
    const cost=paid.reduce((a,c)=>{ const v=MR_COST(c); return a+(v==null?0:v); },0);
    add('H1-2','הזמנת מחקרי שוק',paid.length,
      `${paid.join(', ')||'—'} · עלות ${fmt(cost)}K SF · החינמיים (${MR_FREE.join(', ')}) מגיעים אוטומטית — אל תזמין אותם`,
      paid.length>3?'חריגה מ-3 סלוטים':'');
  }

  if((lev.securities||0)>0)
    add('H2','השקעה בניירות ערך',lev.securities,
      `בחר מטבע + Investment/Bonds · אג״ח ברזיל ${DATALOG.interest.govSecurities.brazil}%/רבעון היא התשואה הגבוהה הזמינה`);
  if((lev.h4Loan||0)>0) add('H4','הלוואה בין-חברות',lev.h4Loan,'חברה לווה · מטבע · קרן · תשלום סופי · רבעון · ריבית');

  /* ---------- H6 · industrial sales, incl. every signed commitment due this quarter ---------- */
  let contractRows=0;
  try{
    contractPlan().filter(c=>c.deliveryQuarter===targetQ).forEach(c=>{
      const useFb=c.fbAllowed && c.gap>0 && c.fbGap<=0;
      const grade=useFb?c.fbGrade:c.grade;
      const reg=REGIONS.find(x=>x.id===(c.region||'europe'))||{name:'אירופה',cur:'EUR'};
      add('H6',`מכירה תעשייתית — ${c.counterparty||'חוזה'} · ${c.prod}${grade} ל${reg.name}`,c.need,
        `${fmt(c.unitPrice||0)} ${c.currency||'EUR'}/יח׳ · סה״כ ${fmt(c.contractValueLC||0)} ${c.currency||'EUR'} · תשלום ${(c.collection||[]).join('/')}%`
        +` · הובלה ${c.freightOnSeller?'על המוכר':'על הקונה'}`
        +(useFb?` · אספקה בדרגה ${c.prod}${c.fbGrade} לפי סעיף 5`:'')
        +(c.fbBlockedNote?` · ${c.fbBlockedNote}`:''),
        'חוזה חתום — חובה');
      contractRows++;
    });
  }catch(e){}
  // discretionary B2B beyond the contracts
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const rl=lev.regions[r.id]||{};
    if((rl.b2bUnits||0)>0)
      add('H6',`מכירה תעשייתית — ${r.name}`,rl.b2bUnits,
        `${fmt(rl.b2bPrice||0)} ${r.cur}/יח׳ · אחוזי תשלום חייבים להסתכם ב-100%`);
  });

  /* ---------- W · cross-area ---------- */
  REGIONS.forEach(r=>{ const rl=(lev.regions&&lev.regions[r.id])||{};
    if((rl.fxSell||0)>0) add('W3',`המרת מטבע בבנק מקומי — ${r.name}`,rl.fxSell,`${r.cur} · Sell/Buy לכל מט״ח בנפרד`); });

  /* ---------- what the game asks for and the plan does not answer ---------- */
  const emitted=new Set(rows.map(r=>r.form));
  const alwaysAsk=[
    ['A1-1','מחיר ופרסום לשבבים בכל אזור שבו יש מלאי שבבים למכירה'],
    ['A1-2','מחיר ופרסום למחשבים בכל אזור שבו יש מלאי מחשבים למכירה'],
    ['H1-1','מו״פ — הפסקה גוררת קנס עקביות; שמור רצפה גם ברבעון חלש'],
    ['H1-2','שלושת המחקרים החינמיים מגיעים אוטומטית; עד 3 בתשלום'],
  ];
  const missing=alwaysAsk.filter(([f])=>!emitted.has(f));
  // price is the classic loss: any stock meant for sale with no price line is called out here
  const unpriced=(S.quarters[S.activeQuarter].operational.inventory||[]).filter(i=>(i.qty||0)>0&&!(i.price>0));
  if(unpriced.length){
    const u=unpriced.reduce((a,i)=>a+(i.qty||0),0);
    add('A1-1/A1-2','⚠ מלאי ללא מחיר — ללא הזנת מחיר לא תהיה מכירה',u,
      unpriced.slice(0,4).map(i=>`${i.product||'?'}${i.grade!=null?i.grade:''} ${(REGIONS.find(r=>r.id===i.region)||{}).name||'ללא אזור'} ${fmt(i.qty)} יח׳`).join(' · '),'חובה');
  }
  missing.forEach(([f,why])=> add(f,'לא תוכנן ברבעון זה',0,why,'לבדוק'));

  if(!rows.length) add('—','לא הוזנו מהלכים בתרחיש לרבעון זה',0,'הזן מנופים בסימולטור');
  const order={'A1-1':1,'A1-2':2,'A1-3':3,'A2-1':4,'A2-3':5,'A2-4':6,'A3-1':7,'A3-2':8,'A3-3':9,'A4':10,
    'H1-1':11,'H1-2':12,'H2':13,'H4':14,'H5':15,'H6':16,'W1':17,'W2':18,'W3':19,'A1-1/A1-2':2.5,'—':99};
  return rows.sort((a,b)=>(order[a.form]||50)-(order[b.form]||50));
}
/* Entering the real simulator is number-after-number off this sheet, so the value has to be one
   click away. `navigator.clipboard` needs a secure context and this app also runs from file://,
   hence the textarea fallback — without it the button would silently do nothing locally. */
window.copyText=async(txt,label)=>{
  const s=String(txt==null?'':txt);
  try{ await navigator.clipboard.writeText(s); toast((label||'הועתק')+' ✓','g'); return; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=s;
    ta.style.cssText='position:fixed;top:-1000px;opacity:0'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast((label||'הועתק')+' ✓','g'); }
  catch(e){ toast('ההעתקה נכשלה — סמן והעתק ידנית','a'); }
};

// WS-2: chip→computer constraint. PCs (Y) produced in a quarter need chips (X) already in inventory
// (1-quarter delay — chips produced this quarter are available only next quarter).
// Fix #2: chip→PC guard uses the real Data Log grade matrix (chips-per-PC varies 1–5 by grade,
// and some X/Y grade pairs are incompatible = 0), not a 1:1 assumption.
/* FIX #74 (P0) — an area runs more than one production line.
   The lever schema held a single `product` per area per quarter, so Group 8's actual Q4
   (48,000 X2 AND 18,000 Y1, both in Europe) could not be expressed at all: the second line
   overwrote the first. Every downstream check — chip coverage, capacity, the input sheet,
   the cash projection — therefore reasoned about half the plan.
   Rather than rewrite the stored shape (which would invalidate every saved scenario), the
   primary object stays line 0 and `rl.lines[]` carries the rest. `linesOf()` is the single
   normaliser every consumer now goes through, so adding a line cannot be forgotten in one
   place and honoured in another. */
function linesOf(lev, regionId){
  const rl=(lev&&lev.regions&&lev.regions[regionId])||{};
  const base={ product:rl.product==='X'?'X':'Y', grade:(rl.grade!=null?rl.grade:null),
    model:rl.model||'Standard', production:rl.production||0, unitCost:rl.unitCost||0,
    price:rl.price||0, qtySold:(rl.qtySold!=null?rl.qtySold:0), sales:rl.sales||0,
    advertising:rl.advertising||0, margin:rl.margin||null, _i:0, _primary:true };
  const extra=(Array.isArray(rl.lines)?rl.lines:[]).map((l,i)=>({
    product:l.product==='X'?'X':'Y', grade:(l.grade!=null?l.grade:null),
    model:l.model||'Deluxe', production:l.production||0, unitCost:l.unitCost||0,
    price:l.price||0, qtySold:(l.qtySold!=null?l.qtySold:0), sales:l.sales||0,
    advertising:l.advertising||0, margin:l.margin||null, _i:i+1, _primary:false }));
  return [base,...extra];
}
/* Lines that actually do something — the ones worth validating and printing. */
function activeLines(lev, regionId){
  return linesOf(lev,regionId).filter(l=>(l.production>0||l.sales>0||l.qtySold>0||l.advertising>0||l.price>0));
}
const linePrice=l=> l.price>0 ? l.price
  : (l.qtySold>0&&l.sales>0 ? l.sales/l.qtySold
  : (l.margin&&l.unitCost>0 ? l.unitCost*l.margin : 0));
/* Does this area sell BOTH products this quarter? Drives the Data Log 04 selling-cost tier. */
function sellsBothIn(lev, regionId){
  const ls=activeLines(lev,regionId).filter(l=>l.sales>0||l.qtySold>0);
  return ls.some(l=>l.product==='X') && ls.some(l=>l.product==='Y');
}
/* FIX #47 (P1) — ASSORTMENT. Guide 4.10.1: a company selling two models sells more in total
   than a company selling one, but its standard model alone sells less — the higher grade
   cannibalises the lower one. The engine listed 'assortment' as a demand determinant and then
   modelled nothing, so the whole two-model strategy (the jump from 15,000 to 26,000 units in
   Q5) rested on an assumption with no mechanism behind it.
   Two DISTINCT grades of the same product in one area is what counts — the same grade twice is
   one model, not two (Guide 4.3). Factors are ESTIMATES, deliberately below the plan's own
   assumption, and are labelled as estimates wherever they surface. */
const ASSORTMENT={ 1:1.00, 2:1.55, 3:1.70 };   // total-demand multiplier by distinct grades
function assortmentInfo(lev, regionId, product){
  const ls=activeLines(lev,regionId).filter(l=>l.product===product && (l.sales>0||l.qtySold>0));
  const grades=[...new Set(ls.map(l=>l.grade).filter(g=>g!=null))];
  const n=Math.max(1,Math.min(3,grades.length||(ls.length?1:0)));
  const factor=ASSORTMENT[n]||1;
  return { models:n, grades, factor,
    // the low grade loses share to the high one even as the total rises
    cannibalisation: n>1 ? 0.35 : 0,
    note: n>1 ? `שני דגמים בדרגות ${grades.join(' ו-')} — ביקוש כולל ×${factor} (אומדן), הדגם הנמוך מאבד ~35% לטובת הגבוה`
              : 'דגם אחד — אין אפקט מגוון. שתי דרגות שונות באותו אזור פותחות מאגר ביקוש שני' };
}
function chipGuard(sc,targetQ){
  const op=S.quarters[S.activeQuarter].operational;
  const inv=(op.inventory||[]);
  const gx=Math.max(0,Math.min(9,op.techX||0)), gy=Math.max(0,Math.min(9,op.techY||0));
  const ratio=(DATALOG.chipPerPC[gx]&&DATALOG.chipPerPC[gx][gy])||0; // chips per PC for X{gx}→Y{gy}
  const lev=sc&&sc.levers[targetQ];
  // FIX #2 (P1): chips already promised under a signed contract are NOT available to feed our
  // own PC lines. Reserve the committed quantity for the quarter it must be produced in, before
  // anything else is allowed to consume it.
  let reserved=0, reservedNote='';
  try{
    // Every pending X commitment locks up stock, whether or not a gap remains. The gap>0 test
    // was backwards: when stock already covers the contract there is no gap, and that is exactly
    // the case where the same chips were being counted twice — once for the buyer, once for us.
    const ct=contractPlan().filter(c=>c.prod==='X' && qIndex(c.deliveryQuarter)>=qIndex(targetQ));
    ct.forEach(c=>{ const committed=Math.min(c.need||0, Math.max(c.stock||0, c.fbStock||0)); reserved+=committed; });
    if(ct.length) reservedNote=ct.map(c=>`${fmt(c.need)} × ${c.prod}${c.fbAllowed&&c.fbGap<c.gap?(c.fbGrade+'+'):c.grade} ל-${c.deliveryQuarter}`).join(' · ');
  }catch(e){}
  // FIX #1 (P1): chips are physical stock in a specific area. Chips sitting in Europe cannot
  // feed a PC line in Brazil without a transfer, so the balance must be struck PER REGION.
  // The old global sum passed plans that are impossible to execute.
  const byRegion=[]; let pcPlanned=0, chipInvTotal=0, worst=null;
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    const stock=inv.filter(i=>i.product==='X' && (i.region||'')===r.id).reduce((a,i)=>a+(i.qty||0),0);
    // FIX #74: sum EVERY PC line in the area, not just the one that happened to be primary
    const pc=lev?activeLines(lev,r.id).filter(l=>l.product==='Y').reduce((a,l)=>a+l.production,0):0;
    const chipMade=lev?activeLines(lev,r.id).filter(l=>l.product==='X').reduce((a,l)=>a+l.production,0):0;
    const need=pc*ratio;
    chipInvTotal+=stock; pcPlanned+=pc;
    const row={region:r.id,name:r.name,stock,pc,chipMade,need,gap:Math.max(0,need-stock)};
    byRegion.push(row);
    if(row.gap>0 && (!worst||row.gap>worst.gap)) worst=row;
  });
  // chips with no region tag yet (legacy rows) are counted separately and never assumed local
  const untagged=inv.filter(i=>i.product==='X' && !i.region).reduce((a,i)=>a+(i.qty||0),0);
  const regionGap=byRegion.reduce((a,x)=>a+x.gap,0);
  const chipInv=chipInvTotal+untagged;
  const compatible=!(pcPlanned>0 && ratio===0);   // grade pair incompatible → illegal
  const chipsNeeded=pcPlanned*ratio;
  const freeAfterReserve=chipInv-reserved;
  const gap=Math.max(regionGap, Math.max(0,chipsNeeded-freeAfterReserve));
  return {chipInv,chipInvTotal,untagged,pcPlanned,ratio,gx,gy,compatible,chipsNeeded,
    byRegion,worst,regionGap,reserved,reservedNote,freeAfterReserve,
    ok:compatible && gap===0, gap};
}
// Per-plant capacity from the Data Log (units/plant/Q). The data model tracks only a total plant
// count, so this flags production that exceeds ONE plant's capacity and reports the plants implied.
function capacityCheck(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; const issues=[];
  // FIX #74: capacity binds per PRODUCT per area across all lines, and against the plants
  // actually declared for that product — two lines of the same product share the same plants.
  if(lev) REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    ['X','Y'].forEach(prd=>{
      const prod=activeLines(lev,r.id).filter(l=>l.product===prd).reduce((a,l)=>a+l.production,0);
      if(prod<=0) return;
      const capPer=(DATALOG.capacity[prd]&&DATALOG.capacity[prd][r.id])||0;
      if(capPer<=0) return;
      const plants=Math.max(1,plantsForProduct(r.id,prd)||1);
      const cap=capPer*plants;
      if(prod>cap) issues.push({region:r.id,name:(REGIONS.find(x=>x.id===r.id)||{}).name,
        product:prd,prod,cap,capPer,plants,plantsNeeded:Math.ceil(prod/capPer)});
    });
  });
  return issues;
}
function scenarioValidation(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; if(!lev) return {noNeg:true,hasCost:true};
  let noNeg=true,hasCost=true;
  REGIONS.forEach(r=>{ const rl=lev.regions[r.id]||{};
    ['invest','transferIn','transferOut'].forEach(k=>{ if((rl[k]||0)<0) noNeg=false; });
    linesOf(lev,r.id).forEach(l=>{
      ['production','unitCost','sales','advertising'].forEach(k=>{ if((l[k]||0)<0) noNeg=false; });
      if(l.production>0 && !(l.unitCost>0)) hasCost=false; }); });
  if((lev.rd||0)<0) noNeg=false;
  return {noNeg,hasCost};
}
// Phantom sale (guard #1) — supply-aware: goods can ship between regions, so a market can be sold
// without a local plant. The honest constraint is TOTAL: units sold across all markets must not exceed
// total finished inventory + planned production. Selling more than you can make/hold = phantom revenue.
function phantomSales(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; if(!lev) return [];
  const op=S.quarters[S.activeQuarter].operational;
  // Checked per PRODUCT. Chips became a first-class line in v10 (#74) and there is a signed
  // chip contract, but this guard only looked at Y — so an impossible chip sale passed.
  const out=[];
  ['Y','X'].forEach(prod=>{
    let prodUnits=0, sellUnits=0;
    REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ activeLines(lev,r.id).forEach(l=>{
      if(l.product!==prod) return;
      prodUnits+=l.production;
      const pEff=linePrice(l);
      if(l.sales>0||l.qtySold>0) sellUnits+=(l.qtySold>0?l.qtySold:(pEff>0?Math.round(l.sales/pEff):0));
    }); });
    if(!sellUnits) return;
    const inv=(op.inventory||[]).filter(i=>i.product===prod).reduce((a,i)=>a+(i.qty||0),0);
    // chips already promised to a signed contract cannot also be sold on the open market
    const committed = prod==='X' ? contractPlan().reduce((a,c)=>a+(c.prod==='X'?Math.max(0,c.bindingGap!=null?c.bindingGap:c.gap):0),0) : 0;
    const supply=Math.max(0, prodUnits+inv-committed);
    if(sellUnits>supply) out.push({product:prod, sold:sellUnits, supply, committed, gap:sellUnits-supply});
  });
  return out;
}
// Wave 1 · guard #2 — phantom transfer: transfers into regions (A3-1) are funded by the Home Office.
// Flag transferring more than HQ actually holds — money that appears with no real source debit.
function phantomTransfers(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; if(!lev) return null;
  const totalIn=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>a+((lev.regions[r.id]||{}).transferIn||0),0);
  if(totalIn<=0) return null;
  const hqCash=S.quarters[S.activeQuarter].financial.cash.hq||0;
  return totalIn>hqCash ? {totalIn,hqCash,gap:totalIn-hqCash} : null;
}
/* Guard — §4.9: only TWO grades of a product may be marketed or held in inventory in an
   area at once. A third does not fail; the middle grade is silently downgraded to the
   lowest, which writes down good inventory. Counts distinct grades already in inventory
   per region×product and flags any region already at or over the limit. */
function gradeLimitGuard(){
  const op=S.quarters[S.activeQuarter].operational, out=[];
  const by={};
  (op.inventory||[]).filter(i=>(i.qty||0)>0).forEach(i=>{
    const rid=i.region||'europe', prod=i.product||'Y';
    const g=(i.grade!=null?i.grade:(i.model==='Deluxe'?1:0));
    const k=rid+'|'+prod; (by[k]=by[k]||new Set()).add(String(g));
  });
  Object.entries(by).forEach(([k,set])=>{
    const [rid,prod]=k.split('|'); const n=set.size;
    if(n>=RULES.grades.maxPerProductPerArea){
      const rn=(REGIONS.find(r=>r.id===rid)||{}).name||rid;
      out.push({region:rid, regionName:rn, product:prod, grades:[...set], count:n,
        over:n>RULES.grades.maxPerProductPerArea});
    }
  });
  return out;
}
/* Guard — Data Log 04: the only legal office combination is 1 central + 1..9 regional.
   The engine recommends office counts, so it must never propose an illegal one. */
function officeLegality(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; if(!lev) return [];
  const out=[];
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const n=(lev.regions[r.id]||{}).offices;
    if(n==null||n===0) return; // no captive sales organisation in that area at all — legal
    if(n>RULES.offices.maxRegional) out.push({region:r.name, n, why:`מעל המקסימום — ${RULES.offices.maxCentral} מרכזי + עד ${RULES.offices.maxRegional} אזוריים`});
    else if(n<RULES.offices.minCentral+RULES.offices.minRegional) out.push({region:r.name, n, why:`מתחת למינימום — נדרש ${RULES.offices.minCentral} מרכזי + ${RULES.offices.minRegional} אזורי לפחות`});
  });
  return out;
}
/* R-10 (src, §4.6 "Create/Change A CSO Takes A Q") · Changing the sales setup takes effect only at
   the END of the quarter: the quarter you decide in is still sold by the OLD arrangement, while you
   already pay the change cost. So a plan that opens offices in targetQ and books the extra volume
   in targetQ is counting a lift that cannot arrive until targetQ+1. This was encoded nowhere. */
function officeTimingGuard(sc,targetQ){
  const lev=sc&&sc.levers[targetQ]; if(!lev) return [];
  const nowOffices=(S.quarters[S.activeQuarter].operational||{}).offices;
  const out=[];
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    const rl=lev.regions[r.id]||{}; const planned=rl.offices;
    if(planned==null) return;
    // Only meaningful when we know what we have today; offices is reported per company, not per area,
    // so treat a per-area plan that exceeds the reported total as an opening this quarter.
    if(nowOffices==null) return;
    const opening=planned>nowOffices;
    const sellsHere=activeLines(lev,r.id).some(l=>(l.qtySold||0)>0||(l.sales||0)>0);
    if(opening&&sellsHere) out.push({region:r.name, from:nowOffices, to:planned,
      why:`המשרדים נפתחים ב-${targetQ} אך נכנסים לתוקף רק בסופו — המכירות ב-${targetQ} עוד יטופלו לפי המערך הקודם, ואת עלות השינוי משלמים כבר עכשיו. אל תתקצבו את תוספת הנפח לפני ${nextQuarters(targetQ)[0]||'הרבעון הבא'}.`});
  });
  return out;
}

window.downloadInputSheet=(targetQ)=>{

  const cg=chipGuard(sc,targetQ);
  if(!cg.compatible){ toast(`הגשה חסומה: דרגת שבב X${cg.gx} אינה תואמת למחשב Y${cg.gy} (טבלת ההמרה). נדרש מו״פ להתאמת דרגות.`,'r'); go('sim'); return; }

  // FIX #46 (P0): "no price = no sale" is the single most common technical loss in the game.

  const unpriced=(S.quarters[S.activeQuarter].operational.inventory||[]).filter(i=>(i.qty||0)>0 && !(i.price>0));
  if(unpriced.length){
    const units=unpriced.reduce((a,i)=>a+(i.qty||0),0);
    const where=unpriced.slice(0,3).map(i=>`${i.product||'?'}${i.grade!=null?i.grade:''} ${(REGIONS.find(r=>r.id===i.region)||{}).name||'ללא אזור'}`).join(' · ');
    toast(`הגשה חסומה: ${fmt(units)} יח׳ במלאי ללא מחיר (${where}${unpriced.length>3?' ועוד':''}). ללא מחיר — אפס מכירות ברבעון.`,'r');

  const ws=XLSX.utils.aoa_to_sheet(aoa); const wb=XLSX.utils.book_new();

   AI LAYER (F7) — data-anchored chat + council mode
   Bring-your-own Anthropic API key (stored locally, NOT in the backup file).
   All numbers are computed by the deterministic engine and passed in as facts;
   the model interprets and cites — it never invents figures.
   ========================================================================= */
const AI_PROVIDERS={
  anthropic:{ label:'Anthropic (Claude)', short:'Claude', keyLS:'intopia_ai_key_anthropic', defModel:'claude-opus-4-8', keyHint:'sk-ant-...',
    picks:[['claude-opus-4-8','Opus 4.8 — החזק ביותר להחלטות אסטרטגיות'],['claude-opus-5','Opus 5'],['claude-sonnet-5','Sonnet 5 — מאוזן, זול יותר'],['claude-haiku-4-5','Haiku 4.5 — מהיר וזול']] },
  openai:{ label:'OpenAI (GPT)', short:'GPT', keyLS:'intopia_ai_key_openai', defModel:'gpt-4o', keyHint:'sk-...',
    picks:[['gpt-4o','GPT-4o'],['gpt-4o-mini','GPT-4o mini — מהיר וזול']] },
};
// Quick-pick list for the model field; the free-text input stays authoritative so any
// model id the account has access to can still be typed in.
function modelPickHtml(prov,cur){
  const picks=AI_PROVIDERS[prov].picks||[], known=picks.some(p=>p[0]===cur);
  return picks.map(([id,lbl])=>`<option value="${id}" ${id===cur?'selected':''}>${esc(lbl)}</option>`).join('')
    + `<option value="" ${known?'':'selected'}>אחר — הקלדה חופשית</option>`;
}
function aiProvider(){ const p=S.ai&&S.ai.provider; return AI_PROVIDERS[p]?p:'anthropic'; }
// Strip anything that isn't printable ASCII — API keys/model IDs are ASCII, and a stray
// non-Latin-1 char (hidden space/newline/Hebrew from paste) makes fetch() headers throw.
function cleanAscii(s){ return String(s||'').replace(/[^\x20-\x7E]/g,'').trim(); }
function getApiKey(prov){ prov=prov||aiProvider(); try{
  let k=localStorage.getItem(AI_PROVIDERS[prov].keyLS)||'';
  if(!k && prov==='anthropic'){ const legacy=localStorage.getItem('intopia_ai_key'); if(legacy){ localStorage.setItem(AI_PROVIDERS.anthropic.keyLS,legacy); localStorage.removeItem('intopia_ai_key'); k=legacy; } }
  return cleanAscii(k);
}catch(e){ return ''; } }
function setApiKey(prov,k){ try{ k=cleanAscii(k); k?localStorage.setItem(AI_PROVIDERS[prov].keyLS,k):localStorage.removeItem(AI_PROVIDERS[prov].keyLS); }catch(e){} }
function aiModel(prov){ prov=prov||aiProvider(); const m=S.ai&&S.ai.models&&S.ai.models[prov]; return cleanAscii(m)||AI_PROVIDERS[prov].defModel; }

{"variants":[{"name":"שם קצר","thesis":"משפט-שניים: על מה האסטרטגיה מהמרת ומה היא מקריבה","risk":"הסיכון המרכזי","quarters":{"Q4":{"rd":120000,"regions":{"europe":{"production":15000,"price":135,"qtySold":12000,"advertising":60000,"newFac":0,"offices":2}}}}}]}

הנחיות לווריאנטים: החזר בדיוק 3, שונים באמת זה מזה (לא אותה אסטרטגיה בעוצמות שונות) — למשל אחד שמקסם מזומן עכשיו, אחד שמשקיע במו״פ לפוטנציאל, ואחד שמרחיב קיבולת/שווקים. כסה **את כל הרבעונים** שמופיעים ב"רבעונים לתכנון" בהקשר. אזור בלי פעילות — פשוט אל תכלול אותו.`;

/* Strict, defensive parse: the model's output is untrusted text. We accept only the
   fields the engine understands, coerce every value to a finite number, and drop the
   rest. Nothing here is allowed to reach the plan without passing through scoreProxy. */
function parseStrategyJSON(txt, horizon){
  let raw=String(txt||'').trim();
  const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) raw=fence[1].trim();
  const s=raw.indexOf('{'), e=raw.lastIndexOf('}'); if(s<0||e<=s) throw new Error('התשובה לא הכילה JSON');
  let obj; try{ obj=JSON.parse(raw.slice(s,e+1)); }catch(err){ throw new Error('JSON לא תקין: '+err.message); }
  const n=v=>{ const x=Number(v); return isFinite(x)&&x>=0 ? x : 0; };
  const out=(obj.variants||[]).slice(0,3).map(v=>{
    const levers={};
    horizon.forEach(q=>{
      const src=(v.quarters||{})[q]||{};
      levers[q]={rd:n(src.rd), regions:{}};
      REGIONS.forEach(r=>{
        const g=(src.regions||{})[r.id]||{};
        const price=n(g.price), qty=n(g.qtySold), prod=n(g.production);
        // FIX #74: the model may return several production/sales lines for one area
        const extra=Array.isArray(g.lines)?g.lines.slice(1).map(l=>({
          product:(l.product==='X'?'X':'Y'), grade:(l.grade!=null?Math.max(0,Math.min(9,+l.grade||0)):null),
          model:l.model||'Deluxe', production:Math.max(0,+l.production||0), unitCost:Math.max(0,+l.unitCost||0),
          price:Math.max(0,+l.price||0), qtySold:Math.max(0,+l.qtySold||0),
          sales:Math.max(0,+l.sales|| ((+l.price||0)*(+l.qtySold||0)) ), advertising:Math.max(0,+l.advertising||0)
        })):[];
        levers[q].regions[r.id]={ lines:extra, production:prod, unitCost:n(g.unitCost),
          price, qtySold:qty, sales:Math.round(price*qty),
          advertising:n(g.advertising), invest:n(g.invest), transferIn:n(g.transferIn),
          newFac:Math.min(3,Math.round(n(g.newFac))), offices:Math.round(n(g.offices)),
          product:(g.product==='X'?'X':'Y'), grade:(g.grade!=null&&isFinite(Number(g.grade)))?Math.max(0,Math.min(9,Math.round(Number(g.grade)))):undefined,
          model:g.model==='Deluxe'?'Deluxe':'Standard', margin:null, advPct:null };
      });
    });
    return { name:String(v.name||'ללא שם').slice(0,40), thesis:String(v.thesis||'').slice(0,400),
      risk:String(v.risk||'').slice(0,300), levers };
  });
  if(!out.length) throw new Error('לא הוחזרו וריאנטים');
  return out;
}
/* Every variant is re-scored from scratch by the engine and run past the legality
   guards. This is what makes the strategist safe to use: its judgement is advisory,
   its arithmetic is never trusted. */
function scoreStrategyVariant(v, base){
  const sp=scoreProxy(v.levers);
  const proj=projectCashflow(base, v.levers);
  const breaches=proj.filter(x=>x.breach);
  const fake={levers:v.levers};
  const violations=[];
  const op=S.quarters[base].operational, plantsBy=op.plantsByRegion||null;
  planHorizon(base).forEach(q=>{
    const ph=phantomSales(fake,q); if(ph.length) violations.push(`${q}: מכירה ${fmt(ph[0].sold)} מול היצע ${fmt(ph[0].supply)}`);
    const ol=officeLegality(fake,q); if(ol.length) violations.push(`${q}: ${ol[0].region} ${ol[0].n} משרדים — ${ol[0].why}`);
    const caps=capacityCheck(fake,q); if(caps.length) violations.push(`${q}: ${caps[0].name} ${fmt(caps[0].prod)} > קיבולת ${fmt(caps[0].cap)}`);
    // FIX #4 (P0): the chip→PC dependency is the hardest rule in the game and this validator
    // never checked it — an AI plan could build computers with no chips and still be "legal".
    const cgv=chipGuard(fake,q);
    if(!cgv.compatible) violations.push(`${q}: דרגות לא תואמות X${cgv.gx}→Y${cgv.gy} (0 בטבלת ההמרה)`);
    else if(cgv.gap>0) violations.push(`${q}: חסרים ${fmt(cgv.gap)} שבבים${cgv.worst?` ב${cgv.worst.name}`:''} לייצור ${fmt(cgv.pcPlanned)} מחשבים`);
    if(plantsBy) REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
      const pr=(v.levers[q].regions[r.id]||{}).production||0;
      if(pr>0 && !(plantsBy[r.id]>0)) violations.push(`${q}: ייצור ב${r.name} ללא מפעל`); });
    const rd=v.levers[q].rd||0;
    if(rd>0 && rd<DATALOG.rdMinPerQuarter.X) violations.push(`${q}: מו״פ ${fmt(rd)} מתחת למינימום החוקי`);
  });
  // A plan that does not cover a binding commitment is not a valid plan.
  Object.entries(contractRequirements()).forEach(([pq,list])=>{
    list.forEach(c=>{
      const lv=v.levers[pq];
      const made=lv?REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>
        a+activeLines(lv,r.id).filter(l=>l.product===c.prod).reduce((b,l)=>b+l.production,0),0):0;
      const bind=(c.bindingGap!=null?c.bindingGap:c.gap);
      if(made<bind) violations.push(`${pq}: לא מכסה התחייבות ${fmt(bind)} × ${c.prod}${(c.fbAllowed&&c.fbGap<c.gap)?(c.fbGrade+"+ (סעיף 5)"):c.grade} (מתוכנן ${fmt(made)})`);
    });
  });
  // The same shortage repeated for every quarter used to fill the display cap and hide a
  // different, more serious breach behind it. Keep one of each KIND, worst kind first.
  const kindOf=t=>/התחייבות/.test(t)?0:(/ללא מפעל/.test(t)?1:(/מכירה/.test(t)?2:(/קיבולת/.test(t)?3:(/שבבים/.test(t)?4:5))));
  const seenKind=new Set(), byKind=[];
  violations.slice().sort((a,b)=>kindOf(a)-kindOf(b)).forEach(t=>{
    const k=kindOf(t); if(seenKind.has(k)) return; seenKind.add(k);
    const more=violations.filter(x=>kindOf(x)===k).length-1;
    byKind.push(more>0?`${t} (ועוד ${more} רבעונים)`:t);
  });
  return { ...v, score:sp.value, past:sp.pastHalf, pot:sp.potentialHalf, endCash:sp.endCash,
    breaches:breaches.length, worstBreach:breaches.length?breaches[0].q:null,
    violations:byKind.slice(0,5), violationCount:violations.length,
    legal:violations.length===0, feasible:breaches.length===0 };
}
function strategyContext(base, horizon){
  const L=[buildAIContext()];
  L.push(`## רבעונים לתכנון [חובה לכסות את כולם]: ${horizon.join(', ')}`);
  const bl=S.scenarios[0];
  const sp0=scoreProxy(bl?bl.levers:null), mp=masterPlanStatus();
  L.push(`## נקודת הפתיחה שהמנוע חישב [עובדה]`);
  L.push(`- ציון נוכחי ${sp0.value.toFixed(0)}/100 — מחצית עבר ${sp0.pastHalf.toFixed(0)} · מחצית עתיד ${sp0.potentialHalf.toFixed(0)}. יעד ${mp.tScore}. נותרו ${mp.remaining} רבעונים.`);
  L.push(`- **המחצית החלשה היא מה שכדאי להזיז**: ${sp0.pastHalf<sp0.potentialHalf?'העבר (רווח/יעילות) — צריך למכור ברווחיות':'העתיד (טק/נתח/בריאות פיננסית) — צריך מו״פ ונתח שוק'}.`);
  const plantsBy=S.quarters[base].operational.plantsByRegion;
  L.push(`- מפעלים לפי אזור כרגע: ${plantsBy?REGIONS.filter(r=>r.id!=='hq').map(r=>`${r.name} ${plantsBy[r.id]||0}`).join(' · '):'לא נקלט — הנח שאין מפעלים חדשים'}. **ייצור רק שם.**`);
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const a=priceAnchors(r.id,'Y');
    const cap=marketCapUnits('Y',r.id);
    L.push(`- ${r.name}: עוגן מחיר מחשב ${fmt(a.base)} ${r.cur} (${a.src}) · תקרת שוק ~${fmt(cap)} יח׳/רבעון · סף פרסום ${fmt(advThreshold(r.id,'Y'))} ${r.cur} · גמישות מחיר ${priceElast(r.id,'Y')}`); });
  L.push(`- מו״פ: מינימום חוקי שבב ${fmt(DATALOG.rdMinPerQuarter.X)} SF · מחשב ${fmt(DATALOG.rdMinPerQuarter.Y)} SF לרבעון. דרגה עולה ≤1/רבעון, ולכן פיזור על פני רבעונים עדיף על מכה אחת.`);
  const ct=contractPlan().filter(c=>c.gap>0);
  if(ct.length){
    L.push(`## התחייבויות חוזיות מקודשות [אילוץ קשיח — תוכנית שלא מכסה אותן נדחית]`);
    ct.forEach(c=> L.push(`- **${fmt(c.need)} יח׳ ${c.prod}${c.grade} לאספקה ב-${c.deliveryQuarter}.** במלאי בדרגה מתאימה ${fmt(c.stock)} → חסר **${fmt(c.gap)}**. `
      +`הייצור חייב להסתיים ב-**${c.productionQuarter}** (סחורה נכנסת למלאי בסוף רבעון הייצור). `
      +`דרגת ${c.prod} נוכחית ${c.tech}${c.techOK?' — מספיקה':` — **לא מספיקה, נדרש מו״פ ל-${c.prod}${c.grade} לפני הייצור**`}.`
      +(c.fbAllowed?`**סעיף 5 בחוזה מתיר לספק רמה נמוכה מתאימה (${c.prod}${c.fbGrade} ומעלה)** — במלאי כזה ${fmt(c.fbStock)}, ולכן הפער המחייב בפועל הוא **${fmt(c.bindingGap)}**. ${c.fbBlockedNote?("אזהרה: "+c.fbBlockedNote+" "):""}`:``)
      +(c.penaltyPct?`אי-אספקה = קנס מחיר הרכישה +${c.penaltyPct}% ≈ ${fmt(c.penaltySF)} SF. `:``)
      +(c.unitPrice?`שווי החוזה ${fmt(c.contractValueLC)} ${c.currency} (${fmt(c.unitPrice)}/יח׳), גבייה ${(c.collection||[]).join("/")}%. `:``)
      +(c.capKnown?` תקרת ייצור תאורטית ${fmt(c.capPerQuarter)} יח׳/רבעון.`:'')));
    L.push(`- תכנן ייצור **${ct[0].prod}** (לא רק מחשבים) ברבעונים הרלוונטיים, בשדה production של אזור עם מפעל, עם "product":"${ct[0].prod}" ו-"grade":${ct[0].grade}${ct[0].fbAllowed?(" (או "+ct[0].fbGrade+" לפי סעיף 5 — חלופה חוקית, לא כשל)"):""}. אי-עמידה גוררת קנס כספי ופגיעה ברכיב השותפויות בציון.`);
  }
  return L.join('\n');
}
window.runStrategy=async()=>{
  if(!getApiKey()){ openAISettings(); return; }
  const base=S.activeQuarter, horizon=planHorizon(base);
  if(!horizon.length){ toast('אין רבעונים לתכנון — Q9 הוא האחרון','a'); return; }
  const btn=$('#stratBtn'), out=$('#stratOut');
  if(btn){ btn.disabled=true; btn.textContent='מתכנן…'; }
  if(out) out.innerHTML=`<div class="chip">${IC('clock')} האסטרטג בונה 3 אסטרטגיות ל-${horizon[0]}→Q9, והמנוע יתמחר כל אחת… (עד ~60 שניות)</div>`;
  try{
    const txt=await callLLM([{role:'user',content:strategyContext(base,horizon)+
      `\n\n---\nבנה 3 אסטרטגיות שונות באמת ל-${horizon.join(', ')} שממקסמות את הציון הסופי. החזר JSON בלבד לפי המבנה שנקבע.`}],
      STRATEGY_SYSTEM, {max_tokens:3000});
    const variants=parseStrategyJSON(txt,horizon).map(v=>scoreStrategyVariant(v,base));
    // rank: legal and feasible first, then by engine score, then by ending cash
    variants.sort((a,b)=> (b.legal-a.legal)||(b.feasible-a.feasible)||(b.score-a.score)||(b.endCash-a.endCash));
    S.ai.strategy={base, at:Date.now(), variants:variants.map(v=>({...v}))};
    save(); renderStrategy();
  }catch(e){
    if(out) out.innerHTML=`<div class="tag r" style="display:block;line-height:1.7;white-space:normal">${IC('warn')} ${esc(aiErr(e))}</div>`;
  }
  const b2=$('#stratBtn'); if(b2){ b2.disabled=false; b2.textContent='בנה תוכנית-על עד Q9'; }
};

window.applyStrategy=(i)=>{
