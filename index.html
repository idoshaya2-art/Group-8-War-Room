<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group 8 — EMBA 41 — TAU · INTOPIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#090d16; --bg2:#0e1422; --panel:#121a2c; --panel2:#18213a;
  --line:#222c44; --line2:#2e3956;
  --txt:#e9edf5; --muted:#8d99b6; --muted2:#606d8b;
  --accent:#3d6fe0; --accent2:#6f97ee;
  --green:#2fb894; --greenbg:#0f3229;
  --red:#ef5568; --redbg:#34121c;
  --amber:#d9a441; --amberbg:#332609;
  --purple:#7f8bcb;
  --ink:var(--txt); --faint:var(--muted2); /* semantic aliases used by disclosure/summary chrome */
  --radius:12px; --radius-sm:8px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Assistant',system-ui,sans-serif;
  background:radial-gradient(1100px 640px at 82% -12%,#141d38 0%,transparent 58%),var(--bg);
  color:var(--txt); min-height:100vh; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{font-family:'Rubik',sans-serif;margin:0;font-weight:700}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent2)}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.side{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,#0d1428,#0b1020);
  border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:9px;background:linear-gradient(150deg,#2f5fd0,#16274d);border:1px solid #3a58a0;
  display:grid;place-items:center;font-family:'Rubik';font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;box-shadow:0 4px 14px rgba(45,80,180,.35)}
.brand .t1{font-family:'Rubik';font-weight:700;font-size:13.5px;line-height:1.15}
.brand .t2{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:10px;
  font-size:14.5px;font-weight:600;transition:.15s;position:relative;
}
.nav button .ic{font-size:17px;width:22px;text-align:center;filter:grayscale(.3)}
.nav button:hover{background:var(--panel);color:var(--txt)}
.nav button.active{background:linear-gradient(90deg,rgba(79,140,255,.18),rgba(79,140,255,.04));color:#fff}
.nav button.active::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;min-width:19px;height:19px;
  display:grid;place-items:center;padding:0 5px;font-weight:700}
.nav .sec{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;padding:12px 12px 4px;font-weight:700}
.side .qbox{margin-top:auto;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px}
.side .qbox b{color:var(--accent2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);
  background:rgba(11,16,32,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:19px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.qsel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.qsel label{font-size:12px;color:var(--muted)}
.qsel select{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-weight:700}
.content{padding:24px 26px 60px;max-width:1400px;width:100%}
/* WS-6: persistent North-Star bar (always know the score) — sticky so it stays in view while scrolling */
.northstar{padding:10px 26px 8px;max-width:1400px;width:100%;position:sticky;top:57px;z-index:15;background:var(--bg)}
.ns-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:14px;padding:11px 16px}
.ns-score{display:flex;align-items:center;gap:12px}
.ns-num{font-size:27px;font-weight:800;line-height:1}
.ns-num span{font-size:12px;color:var(--muted2);font-weight:700}
.ns-halves{display:flex;flex-direction:column;gap:4px;min-width:130px}
.ns-h{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}
.ns-h>span{width:30px}
.ns-h .bar{flex:1;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.ns-h .bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ns-h.pot .bar>i{background:linear-gradient(90deg,var(--purple),#c084fc)}
.ns-lbl{font-size:11px;color:var(--muted);font-weight:700}
.ns-div{width:1px;align-self:stretch;background:var(--line2)}
.ns-kpi{display:flex;flex-direction:column;gap:2px}
.ns-kpi .k{font-size:10px;color:var(--muted);font-weight:700}
.ns-kpi b{font-size:15px}
.ns-alert{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;max-width:42%;cursor:pointer}
.ns-alert.red{color:var(--red)} .ns-alert.amber{color:var(--amber)} .ns-alert.ok{color:var(--green)}
/* WS-5: master-plan roadmap strip */
.rm-strip{display:flex;align-items:center;gap:6px;overflow-x:auto;flex-wrap:wrap}
.rm-cell{min-width:54px;text-align:center;padding:8px 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.rm-cell b{display:block;font-size:13px}.rm-cell span{font-size:10px;color:var(--muted)}
.rm-cell.done{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}.rm-cell.done span{color:var(--green)}
.rm-cell.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.rm-ar{color:var(--muted2);font-weight:800}
/* guided FLOW stepper — the quarterly loop, always visible on the 5 work steps */
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-bottom:16px}
.fstep{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--muted);padding:6px 9px;border-radius:9px;font-weight:700;font-size:13px;transition:.15s}
.fstep .fn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:12px;color:var(--muted);flex-shrink:0}
.fstep:hover{color:var(--txt)}
.fstep.cur{color:#fff}
.fstep.cur .fn{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.fstep.done{color:var(--green)}
.fstep.done .fn{background:var(--greenbg);border-color:transparent;color:var(--green)}
.fsep{color:var(--muted2);font-weight:800;font-size:15px}
.flownext{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flownext .hint{color:var(--muted);font-size:13px}
@media(max-width:860px){ .fstep .ft{display:none} .fstep.cur .ft{display:inline} .flow{gap:2px;padding:6px 8px} }
/* decision categories — full-scan view (every form gets a visible verdict) */
.pcat{border:1px solid var(--line2);border-radius:14px;padding:14px;margin-bottom:16px;background:var(--panel)}
.pcat .cathead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.catpill{font-size:12px;font-weight:800;letter-spacing:.03em;color:#fff;padding:5px 13px;border-radius:20px;white-space:nowrap}
.pcat.fin .catpill{background:#e0574c}.pcat.strat .catpill{background:#0d9488}
.pcat.ops .catpill{background:#3b6fa5}.pcat.mkt .catpill{background:#20355c}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted2);white-space:nowrap;cursor:default}
.fchip.rec{background:rgba(52,211,153,.14);color:var(--green);border-color:transparent}
.fchip.watch{background:rgba(245,158,11,.14);color:var(--amber);border-color:transparent}
/* clean method: consistent collapsible sections (progressive disclosure) */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
details.sec>summary{cursor:pointer;padding:13px 18px;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:9px;color:var(--muted)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'⌄';margin-inline-start:auto;transition:transform .2s;color:var(--faint)}
details.sec[open]>summary{border-bottom:1px solid var(--line);color:var(--ink)}
details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec>summary:hover{color:var(--ink)}
details.sec .secbody{padding:16px 18px}
.fverd{margin-top:8px}
.fverd>summary{cursor:pointer;font-size:12px;color:var(--faint);list-style:none}
.fverd>summary::-webkit-details-marker{display:none}
/* the primary status banner — layer 1, the one thing that matters */
.planhero{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.planhero .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.planhero .sc{font-size:30px;font-weight:800;line-height:1}
.planhero .arrow{color:var(--faint);font-weight:700}
.planhero .urgent{margin-top:10px;font-size:14px;display:flex;gap:8px;align-items:flex-start}

/* ===== Components ===== */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card h3{font-size:16px;margin-bottom:2px}
.card .ch{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.card .ch h3{flex:1}
.card .cb{padding:16px 18px}
.grid{display:grid;gap:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
.tag.g{background:var(--greenbg);color:var(--green);border-color:transparent}
.tag.r{background:var(--redbg);color:var(--red);border-color:transparent}
.tag.a{background:var(--amberbg);color:var(--amber);border-color:transparent}
.tag.b{background:rgba(79,140,255,.15);color:var(--accent2);border-color:transparent}

.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#243157;border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#3f7bef);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(79,140,255,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--redbg);color:var(--red);border-color:transparent}
/* min-height, not padding: a 36px floor keeps every small button thumb-sized on a phone without
   growing the ones that are already big enough. Measured before: גיבוי/שחזור/+ רישום החלטה/✕ came
   out under 32px at 390x844. */
.btn.sm{padding:6px 11px;font-size:13px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input.f,select.f,textarea.f{
  background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;
}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--accent)}
label.fl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:center;color:var(--muted);font-weight:700;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
/* first column carries row labels — keep it at the start edge for readability */
table.tbl th:first-child,table.tbl td:first-child{text-align:start}
table.tbl tr:hover td{background:rgba(255,255,255,.02)}
table.tbl input.f{padding:5px 7px}
td.num,th.num{display:table-cell}  /* .num must not turn table cells into inline-blocks (breaks column layout) */
/* Berg — visually separate editable input cells from computed/read cells */
table.tbl.wide input.f,table.tbl.wide select.f{background:color-mix(in srgb,var(--accent) 7%,var(--panel2));border-color:color-mix(in srgb,var(--accent) 22%,var(--line2))}
table.tbl.wide input.f:focus,table.tbl.wide select.f:focus{background:var(--panel2)}
.qstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.qcell{flex:1;min-width:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;transition:.15s;position:relative}
.qcell:hover{border-color:var(--accent)}
.qcell.on{border-color:var(--line2)}
.qcell.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.qcell .qn{font-family:'Rubik';font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.qcell .qv{font-size:12px;color:var(--muted);margin-top:3px}
.qcell.empty{opacity:.55;border-style:dashed}
.qcell .qdot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.qcell.empty .qdot{background:var(--muted2)}
.finrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.finrow:last-child{border-bottom:0}
.finrow b{font-variant-numeric:tabular-nums}
.finrow.tot{border-top:2px solid var(--line2);font-weight:800;margin-top:4px}
.act{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);border-inline-start:4px solid;margin-bottom:12px;background:var(--panel)}
/* severity lives in the 4px rail only — the tinted card backgrounds fought the rail, the tags and the
   dependency line for attention. One signal, one place. */
.act.red{border-inline-start-color:var(--red)}
.act.amber{border-inline-start-color:var(--amber)}
.act.info{border-inline-start-color:var(--accent)}
.act.good{border-inline-start-color:var(--green)}
.act .an{width:26px;height:26px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;font-family:'Rubik'}
.act .at{flex:1}
.act .at b{font-size:14.5px}
.act .at p{margin:5px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
.act .form{display:inline-flex;align-items:center;gap:5px;margin-top:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--accent2)}
/* dependencies are context, not a severity — neutral so amber keeps meaning "recommended" */
.act .dep{margin-top:8px;font-size:12.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;line-height:1.5}
.depchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.depnode{background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700}
.depnode.here{border-color:var(--accent);color:var(--accent2);box-shadow:0 0 0 1px var(--accent) inset}
.deparrow{color:var(--muted2);font-weight:800;font-size:15px}
table.tbl.wide td,table.tbl.wide th{white-space:nowrap;font-size:12px;padding:5px 8px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollx::-webkit-scrollbar{height:8px}
.scrollx::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi .v{font-size:24px;font-weight:800;font-family:'Rubik'}
.kpi .d{font-size:12px;margin-top:3px;font-weight:600}
.kpi .d.up{color:var(--green)} .kpi .d.dn{color:var(--red)}

/* Alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:11px;border:1px solid var(--line);margin-bottom:10px;background:var(--panel)}
.alert.on{border-inline-start:4px solid}
.alert.red{border-inline-start-color:var(--red);background:linear-gradient(90deg,var(--redbg),var(--panel))}
.alert.amber{border-inline-start-color:var(--amber);background:linear-gradient(90deg,var(--amberbg),var(--panel))}
.alert.ok{border-inline-start:4px solid var(--green)}
.alert .dot{font-size:20px;line-height:1}
.alert .txt{flex:1}
.alert .txt b{display:block;font-size:14.5px}
.alert .txt span{color:var(--muted);font-size:13px}

/* Dropzone */
.drop{border:2px dashed var(--line2);border-radius:16px;padding:44px 20px;text-align:center;transition:.2s;background:var(--panel)}
.drop.hover{border-color:var(--accent);background:rgba(79,140,255,.08)}
.drop .big{font-size:44px;margin-bottom:8px}

/* icons */
.ic-svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex-shrink:0;stroke-width:1.75}
.ch h3 .ic-svg,.card h3 .ic-svg{margin-inline-end:8px;color:var(--accent2);vertical-align:-.14em}
.nav .ic{display:inline-flex;align-items:center;justify-content:center;width:22px}
.nav .ic .ic-svg{width:18px;height:18px;vertical-align:0}
.btn .ic-svg{width:16px;height:16px}
.kpi .l .ic-svg,.tag .ic-svg{width:14px;height:14px}
.sev{width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:5px;flex-shrink:0}
.sev-red{background:var(--red);box-shadow:0 0 0 3px rgba(255,93,108,.16)}
.sev-amber{background:var(--amber);box-shadow:0 0 0 3px rgba(255,181,77,.16)}
.sev-ok{background:var(--green);box-shadow:0 0 0 3px rgba(46,199,160,.16)}

/* charts */
canvas{display:block;max-width:100%}

/* toast */
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f1730;border:1px solid var(--line2);border-radius:10px;padding:11px 18px;box-shadow:var(--shadow);font-weight:600;animation:tin .3s}
.toast.g{border-inline-start-color:var(--green)} .toast.r{border-inline-start-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,7,16,.72);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);max-width:620px;width:100%;max-height:86vh;overflow:auto}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{flex:1}
.modal .mb{padding:20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.x{background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{font-size:40px;opacity:.5;margin-bottom:8px}
.est{border-bottom:1px dotted var(--amber);cursor:help}
/* I-1 · unverified ≠ estimated. A wavy red underline reads as "go check this", which is the action
   this category actually calls for, while the dotted amber `est` reads as "we approximated it". */
.unver{border-bottom:2px wavy var(--red);cursor:help}
.unver sup{color:var(--red);font-weight:800;margin-inline-start:1px}
    .est sup{color:var(--amber);font-weight:700;margin-inline-start:1px}
    .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:600}
/* A chip is usually a label, but the master-plan strip renders each quarter as a clickable one.
   Only the interactive variants get the 36px thumb floor — the labels keep their compact size. */
button.chip,button.x{min-height:36px;min-width:36px;justify-content:center}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.src{font-size:11px;color:var(--muted2);font-style:italic}
.pill-tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.pill-tabs button{background:transparent;border:0;color:var(--muted);padding:7px 14px;border-radius:8px;font-weight:700;font-size:13.5px}
.pill-tabs button.active{background:var(--accent);color:#fff}
.checklist{padding:0;margin:0;list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.check.done{background:var(--green);border-color:var(--green);color:#04120c}
@media(max-width:860px){
  /* The nav strip scrolls horizontally; without containment its scrolled content still
     extended the page and let the whole layout slide sideways (44-60px depending on which
     tab was active). `clip` contains it WITHOUT creating a scroll container, so the sticky
     header and the nav's own scrolling both keep working — `hidden` would break sticky. */
  .app{flex-direction:column;overflow-x:clip}
  /* one horizontally-scrollable nav strip instead of 9 stacked full-width rows (was pushing content to y=498px) */
  .side{width:100%;height:auto;position:sticky;top:0;z-index:40;flex-direction:column;padding:8px 10px;gap:6px;
    overflow:visible;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .side .brand{padding:2px 4px 6px}
  .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex:0 0 auto;white-space:nowrap;min-height:44px;padding:10px 13px}
  .nav button span:not(.ic):not(.badge){font-size:13.5px}
  .nav .sec,.side .qbox{display:none}
  .content{padding:16px}
  .grid[style*="1.15fr"],.grid[style*="1.3fr"],.grid[style*="1fr 1fr"]{grid-template-columns:1fr !important}
  /* topbar + north-star must wrap, never push the page wider than the viewport */
  .topbar{flex-wrap:wrap;padding:10px 14px;row-gap:8px}
  .topbar .spacer{display:none}
  .topbar h2{font-size:16px}
  .northstar{padding:10px 14px 0}
  .ns-wrap{gap:10px;padding:10px 12px}
  .ns-num{font-size:22px}
  .ns-alert{max-width:100%;margin-inline-start:0}
  .kpis{grid-template-columns:1fr 1fr !important}
  .pill-tabs{flex-wrap:wrap}
}

<script>
/* =========================================================================
   INTOPIA War Room — client-side decision-support app (MVP)
   Single-file, localStorage-persisted, Hebrew RTL.
   Three layers — facts (extracted data), model (deterministic engine),
   goals (team configuration). Strategy is configuration, not code.
   ========================================================================= */

const APP_VERSION = 'v10.2 · plant split from the report';
const QUARTERS = ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9'];
const REGIONS  = [
  {id:'us',     name:'ארה״ב (U.S.)',        cur:'USD'},
  {id:'europe', name:'אירופה (EC/EU)',      cur:'EUR'},
  {id:'brazil', name:'ברזיל',               cur:'BRL'},
  {id:'hq',     name:'מטה (ליכטנשטיין)',    cur:'CHF'},
];
const PERSONAS = ['CEO','CFO','COO','CMO','R&D/מודיעין'];
const FX_DEFAULT = {USD:1, EUR:1.5, BRL:0.5, CHF:1}; // SF-per-unit — cross-verified against real Q1/Q3 reports: EU 151,050×1.5+HQ=consol 6,562,577; BR 2,094,904×0.5+HQ=consol 1,067,452. (Data Log 01 matrix was OCR-garbled/self-contradictory; its parity note and the real reports agree on 1.5/0.5.)
function fxRate(cur){ const fx=(S&&S.config&&S.config.params&&S.config.params.fx)||FX_DEFAULT; return fx[cur]!==undefined?fx[cur]:(FX_DEFAULT[cur]||1); }

/* ============================================================================
   DATALOG — authoritative INTOPIA game constants (Section VII Data Log v1).
   Single source of truth, replacing earlier placeholder defaults. All currency
   values are LOCAL to the area unless the key says SF. fx = SF value of 1 unit.
   Note: a few capacity cells (X-BR 12k, Y-BR 14k, X-EU 35k) were OCR-reconstructed
   in the source Data Log and flagged there as approximate.
   ============================================================================ */
const DATALOG = {
  fx:{ USD:1, EUR:1.5, BRL:0.5, SF:1 },                                 // cross-verified vs real reports (Data Log 01 matrix was OCR-garbled; reports confirm EUR 1.5, BRL 0.5)
  tax:{ us:50, europe:40, brazil:30, hq:15 },                          // 07_Finance (Liechtenstein 15%)
  collection:{ us:[40,60,0], europe:[50,20,30], brazil:[30,30,40] },   // 09_AR_AP  Cash/AR1/AR2 %
  interest:{ // quarterly %, 07_Finance
    areaBankLoan:{ us:4, europe:3.5, brazil:6 }, govSecurities:{ us:2, europe:1.5, brazil:4.5 },
    hoLoan:{ brl:6.5, other:5.5 }, hoSecurities:{ sf:2, eur:2, usd:2.25, brl:3 },
    supplierCredit:{ below:{us:7,europe:6,brazil:8,hq:5.5}, switchover:{us:1200000,europe:700000,brazil:600000,hq:3000000}, above:{us:8,europe:7,brazil:9,hq:6.5} },
    negBalance:{ below:{us:3.5,europe:3.5,brazil:4.5,hq:2.5}, above:{us:8,europe:7,brazil:9,hq:6.5} },
    // Interest EARNED on positive local balances. Holding foreign currency locally pays
    // more than local currency — idle cash is not costless, but it is not free either.
    posBalance:{ lc:{ us:0.7, europe:0.7, brazil:1.5, hq:0.5 }, fc:{ us:1, europe:1, brazil:2, hq:0.6 } },
  },
  exchangeCommission:{ us:0.6, europe:0.6, brazil:0.8, hq:0.4 },        // 07_Finance, % of converted amount
  // 07_Finance — automatic one-quarter loss carry-forward, as a fraction of the loss.
  // Brazil has none. Liechtenstein carries the full loss.
  lossCarryForward:{ us:0.6, europe:0.3, brazil:0, hq:1 },
  /* Data Log 03, headed "MAXIMAL capacity per plant by product and area" — note MAXIMAL, not
     optimal. The printed page carries exactly three numbers: 50.000 on the X row, and 25.000 and
     18.000 on the Y row. Column positions were calibrated against the acquisition-cost table on
     the same page, where the mapping is unambiguous and matches plantAcqCost below exactly. On
     that calibration the three printed figures are X-US, Y-US and Y-EU. The other three below came
     from the OCR-reconstructed xlsx, not from the printed page — see CAPACITY_UNVERIFIED. */
  capacity:{ X:{ us:50000, europe:35000, brazil:12000 }, Y:{ us:25000, europe:18000, brazil:14000 } }, // 03 units/plant/Q
  plantAcqCost:{ X:{ us:2000000, europe:1000000, brazil:1600000 }, Y:{ us:1800000, europe:800000, brazil:1600000 } }, // 03 LC Q1
  plantFixedCost:{ X:{ us:[80000,110000,120000], europe:[40000,54000,64000], brazil:[60000,100000,120000] },
                   Y:{ us:[100000,125000,135000], europe:[30000,50000,60000], brazil:[60000,100000,120000] } },   // 03 LC/Q by plant #
  depreciation:{ X:8, Y:5 },                                           // 10 % per Q
  varMfgCostPctOfRetail:{ X:[0.11,0.20], Y:[0.20,0.45] },              // 10 (PC incl. component chips)
  initialConsumerPrice:{ X:{ us:45, europe:40, brazil:150 }, Y:{ us:155, europe:130, brazil:800 } }, // 04 Standard, LC — real demand anchors
  minPriceChange:{ X:{us:1,europe:1,brazil:10}, Y:{us:5,europe:10,brazil:20} },  // 04
  maxPCPriceY0toY3:1400,                                               // 04/10 LC
  sellingCostPerUnit:{ xOnly:{us:10,europe:10,brazil:32}, xyX:{us:7,europe:8,brazil:28}, yOnly:{us:40,europe:40,brazil:160}, xyY:{us:32,europe:33,brazil:140} }, // 04 LC/unit
  officeFixedCost:{ central:{ us:80000, europe:40000, brazil:60000 }, regional:{ us:40000, europe:20000, brazil:30000 } }, // 04 LC/Q (central = 2 regional)
  carryingCostPerUnit:{ X:{us:1,europe:0.8,brazil:1}, Y:{us:10,europe:8,brazil:16} }, // 06 LC/unit, unsold from prior Q
  rdMinPerQuarter:{ X:40000, Y:70000 },                                // 06 SF per scientist per Q (minimum)
  chipPerPC:[ // [Xgrade 0..9][Ygrade 0..9] = chips required per PC; 0 = incompatible (02)
    [1,2,3,0,0,0,0,0,0,0],[1,1,2,3,4,0,0,0,0,0],[1,1,2,2,3,0,0,0,0,0],[0,1,1,2,2,3,3,5,0,0],[0,1,1,1,2,3,3,4,0,0],
    [0,0,0,1,1,2,2,3,0,0],[0,0,0,0,0,2,2,2,3,0],[0,0,0,0,0,1,1,2,3,0],[0,0,0,0,0,0,0,1,2,3],[0,0,0,0,0,0,0,0,1,2] ],
  startingCapitalSF:8000000, minHOCashSF:20000, brazilPlantDepositBRL:1000000, // 10
  // 05_TransferCosts — inter-area freight, LC of shipper per unit. Columns = destination+product.
  freight:{
    surface:{ us:{usX:0.25,usY:10,euX:1,euY:22,brX:2,brY:35}, europe:{usX:0.65,usY:14,euX:0.25,euY:8,brX:1.4,brY:30}, brazil:{usX:2,usY:60,euX:3,euY:80,brX:1,brY:26} },
    air:{ us:{usX:3,usY:30,euX:3.6,euY:55,brX:5.25,brY:65}, europe:{usX:2.4,usY:35,euX:2.4,euY:30,brX:4,brY:60}, brazil:{usX:6,usY:120,euX:6,euY:110,brX:9,brY:120} },
    breakSurface:{ us:{usX:18000,usY:4000,euX:20000,euY:4000,brX:12000,brY:4000}, europe:{usX:20000,usY:4000,euX:19000,euY:4000,brX:12000,brY:4000}, brazil:{usX:16000,usY:3000,euX:16000,euY:3000,brX:12000,brY:4000} },
    breakAir:{ us:{usX:10000,usY:2000,euX:10000,euY:2000,brX:6000,brY:2000}, europe:{usX:10000,usY:2000,euX:10000,euY:2000,brX:6000,brY:2000}, brazil:{usX:8000,usY:1500,euX:8000,euY:1500,brX:6000,brY:2000} },
    discountAboveBreak:{ surface:0.5, air:0.333 }, // unit cost cut above the breakpoint
  },
};
// Freight cost (LC of shipper) to move `units` of product from→to; unit cost is cut above the breakpoint.
// Engine helper (used by the export optimizer to price shipping goods to a market with no local plant).
function freightCostLC(from, to, product, units, mode){
  mode=mode||'surface';
  const destMap={us:'us',europe:'eu',brazil:'br'};
  const col=(destMap[to]||to)+(product==='X'?'X':'Y');
  const tbl=DATALOG.freight[mode]||{}; const rate=(tbl[from]&&tbl[from][col])||0;
  if(!rate||!units) return 0;
  const bp=((mode==='surface'?DATALOG.freight.breakSurface:DATALOG.freight.breakAir)[from]||{})[col]||Infinity;
  const disc=DATALOG.freight.discountAboveBreak[mode]||1;
  return units<=bp ? Math.round(rate*units) : Math.round(rate*bp + rate*disc*(units-bp));
}
/* ==========================================================================
   RULES — the game's BEHAVIOURAL rules, from the Intopia Guide (§4.10, §5.1-5.4).
   DATALOG above holds the price/cost TABLES; this block holds how demand actually
   REACTS. Without it the engine can only do arithmetic on costs, which is why an
   advertising figure used to be "6% of revenue" — a number with no source.

   Honesty contract for every entry below:
     src  = the guide states this ORDERING or BOUND directly (authoritative).
     est  = the magnitude is OUR calibrated estimate inside the guide's bounds and
            respecting its ordering. Treat as a prior to be refined from results,
            never as a quoted fact. Anything shown to the user from an `est` value
            must be labelled "אומדן".
   ========================================================================== */
const RULES = {
  src:'Intopia Guide §4.10.1, §5.1–5.4',
  // §4.10.1: "The crucial determinants of the sales volume of a given company are
  // price, advertising, grade and whether [assortment]". Only price+grade were modelled.
  determinants:['price','advertising','grade','assortment'],

  adv:{
    // §5.4 bound (src): "all advertising elasticities at firm level are between 0.1 and 0.5".
    bound:[0.1,0.5], industryFloor:0.05,
    // §5.4 ordering (src): chips — US highest, Brazil lowest. PCs — Brazil highest at
    // both levels; at firm level US somewhat higher than EU. Magnitudes est.
    elast:{ X:{us:0.45, europe:0.30, brazil:0.15}, Y:{us:0.35, europe:0.25, brazil:0.45} },
    elastNote:'סדר הגודל מהמדריך (0.1–0.5, §5.4); הדירוג בין אזורים מהמדריך; המספר המדויק אומדן.',
    // §5.4 (src): threshold "pleasingly low in the EU and U.S., but fairly high in Brazil"
    // for chips; for PCs "several times higher than for chips" in all cultures. LC/quarter, est.
    threshold:{ X:{us:15000, europe:12000, brazil:60000}, Y:{us:60000, europe:50000, brazil:200000} },
    thresholdNote:'מתחת לסף — הפרסום כמעט לא מזיז ביקוש. הסף עצמו אומדן לכיול מול תוצאות.',
    // §5.4 (src): "Advertising effectiveness is larger everywhere in the quarter in which
    // the advertising is paid for than in any later quarter"; the time-lagged part is
    // greatest in the US, smallest in Brazil, and greater for PCs than for chips.
    sameQuarterShare:{ X:{us:0.72, europe:0.80, brazil:0.90}, Y:{us:0.62, europe:0.70, brazil:0.82} },
    lagNote:'הפרסום עובד באותו רבעון שבו שולם — זה החלק הגדול. השארית מתגלגלת לרבעון הבא.',
    // §5.4 (src): "diminishing returns will gradually set in" — so the elasticity must FALL
    // as spend rises, not stay constant. A saturating curve does that; a power curve does not.
    // maxLift caps how much demand advertising alone can create, anchored to §5.1 (long-run
    // potential is only ~1.2 plants per company/area/model — ads cannot conjure a new market).
    maxLift:0.35,
    maxLiftNote:'תקרת ההרמה מפרסום לבד — אומדן, מעוגן ב-§5.1 (הפוטנציאל לטווח ארוך ~1.2 מפעלים לחברה/אזור/דגם).',
  },

  // §5.3 (src): price elasticity greatest in Brazil, smaller in EU, least in US; PCs
  // "somewhat less in all areas than for chips"; industry level always < firm level.
  price:{ elast:{ X:{us:-1.6, europe:-2.0, brazil:-2.6}, Y:{us:-1.3, europe:-1.7, brazil:-2.2} },
    note:'הדירוג (ברזיל>אירופה>ארה״ב, ושבבים גמישים יותר ממחשבים) מהמדריך §5.3; המספר אומדן עד שיכויל ממחירים בפועל.' },

  // §5.3 (src): goodwill loss from stockouts — for chips in EU/US lower than for PCs
  // (PCs "quite noticeable"); in Brazil PCs and chips are the same and lower than elsewhere.
  goodwill:{ loss:{ X:{us:0.35, europe:0.35, brazil:0.55}, Y:{us:0.75, europe:0.75, brazil:0.55} },
    note:'מדד יחסי 0–1 לנזק מחוסר מלאי. מחשב שנגמר בארה״ב/אירופה = הנזק הכי גדול במשחק.' },

  // §5.2 (src): demand for chips is more sensitive to a change in PC price than vice
  // versa; strongest in the US, medium EU, smallest Brazil.
  cross:{ chipVsPcPrice:{us:0.9, europe:0.6, brazil:0.35},
    note:'העלאת מחיר מחשב מסיטה ביקוש לשבבים (לא להיפך). חזק בארה״ב, חלש בברזיל.' },

  // §5.1 (src): long-term PC potential is "somewhat greater than one plant at optimal
  // capacity per company, area and model"; the consumer chip market hovers around a
  // quarter of the PC market in units (less in Brazil).
  potential:{ pcPlantsPerArea:1.2, chipShareOfPcMarket:{us:0.25, europe:0.25, brazil:0.18},
    growth:'ארה״ב: שוק השבבים צומח מהר מהמחשבים · אירופה: במקביל, יתרון קל למחשבים · ברזיל: המחשבים צומחים מהר בהרבה מהשבבים (§5.2)',
    // Data Log 10 (src): with n of N firms marketing in an area the potential per firm is
    // below normal but above a plain n/N split — thin areas are relatively better to be in.
    nLessThanN:{ rule:'אם רק n מתוך N החברות משווקות באזור, הפוטנציאל לחברה נמוך מהרגיל אך גבוה מ-n/N — אזור שנטוש חלקית עדיף יחסית',
      factor:(n,N)=>{ if(!(n>0)||!(N>0)||n>=N) return 1; const share=n/N; return share+(1-share)*0.5; }, src:'Data Log 10' } },

  // §4.9 (src) — a HARD legality rule with a punitive fallback: a company may market (or
  // hold in inventory) only TWO grades of a product in an area at a time. Introducing a
  // third without clearing one first automatically downgrades the middle grade to the
  // lowest of the three — a silent write-down of good inventory.
  grades:{ maxPerProductPerArea:2,
    thirdGradePenalty:'הדרגה האמצעית מבין השלוש מורדת אוטומטית לרמת הנמוכה — מחיקת שווי שקטה של מלאי טוב (§4.9)',
    exits:['לדחות את הדרגה השלישית עד שהמלאי הקודם נמכר (או להוריד מחיר כדי לזרז)',
           'להעביר את מלאי הדרגה הקודמת לאזור אחר',
           'למכור את מלאי הדרגה הקודמת לחברה אחרת'],
    airNote:'אם קונים דרגה שלישית (גבוהה) בהובלה אווירית — יש למכור אחת מהנמוכות בהובלה אווירית באותו רבעון, אחרת הדרגה האמצעית תורד (§4.9)' },

  // Data Log 04 (src) — the legal office combinations. The engine must never recommend
  // an illegal office count.
  offices:{ minCentral:1, minRegional:1, maxCentral:1, maxRegional:9,
    centralEqualsTwoRegional:true,
    note:'הרכב חוקי: משרד מרכזי אחד + 1 עד 9 משרדים אזוריים. עלות מרכזי = 2 אזוריים (Data Log 04).',

function advElast(reg,prod){ return (RULES.adv.elast[prod]||{})[reg] ?? 0.25; }
function advThreshold(reg,prod){ return (RULES.adv.threshold[prod]||{})[reg] ?? 20000; }
function priceElast(reg,prod){ return (RULES.price.elast[prod]||{})[reg] ?? -1.8; }
function goodwillLoss(reg,prod){ return (RULES.goodwill.loss[prod]||{})[reg] ?? 0.5; }

/* Demand multiplier from an advertising spend, per Guide §5.4.
   Below the threshold the spend is largely wasted; above it the response follows the
   elasticity with diminishing returns. Returns the split between the quarter the money
   is spent (the larger part, always) and the tail that lands in the next quarter. */
function advResponse(reg,prod,spend){
  const th=advThreshold(reg,prod), e=advElast(reg,prod);
  const sameShare=(RULES.adv.sameQuarterShare[prod]||{})[reg] ?? 0.75;
  if(!(spend>0)) return {total:1, now:1, next:0, ratio:0, belowThreshold:true, threshold:th, elast:e, sameShare};
  const ratio=spend/th, sub=0.15*e; // sub-threshold spend buys only a token response
  // Continuous at ratio=1, monotonic, and genuinely saturating: the marginal effect of the
  // next unit of spend decays, so an optimum exists instead of "always spend more".
  const total = ratio<1 ? 1+sub*ratio*ratio
                        : 1+sub+RULES.adv.maxLift*(1-Math.exp(-e*(ratio-1)));
  return { total, now:1+(total-1)*sameShare, next:(total-1)*(1-sameShare),
    ratio, belowThreshold:ratio<1, threshold:th, elast:e, sameShare };
}
/* Marginal-return advertising budget: spend while the next 1,000 LC of advertising still
   buys more than 1,000 LC of gross margin. Replaces the old "6% of revenue" guess. */
function recommendAdSpend(reg,prod,baseUnits,price,unitCost){
  const th=advThreshold(reg,prod); const margin=Math.max(0,(price||0)-(unitCost||0));
  if(!(baseUnits>0)||!(margin>0)) return {spend:0, why:'אין שוליים חיוביים או אין יחידות למכור — פרסום לא מחזיר את עצמו', threshold:th, belowThreshold:true};
  // Two-pass search over a range wide enough that the optimum is interior, so the answer
  // is set by marginal return and not by the loop's ceiling. Only the same-quarter part of
  // the response pays for itself this quarter (§5.4); the tail is reported separately.
  const pool=baseUnits*margin;                       // gross margin available to pay for ads
  const netAt=s=>(advResponse(reg,prod,s).now-1)*pool-s;
  const hi=Math.max(th*40, pool*0.5);
  let best={spend:0,net:0};
  const scan=(from,to,step)=>{ for(let s=Math.max(0,from);s<=to;s+=step){ const n=netAt(s);
    if(n>best.net) best={spend:Math.round(s),net:n}; } };
  scan(0,hi,Math.max(500,hi/400));                   // coarse
  scan(best.spend-hi/400,best.spend+hi/400,Math.max(100,hi/8000)); // fine
  const interior=best.spend>0 && best.spend<hi*0.98;
  const r=advResponse(reg,prod,best.spend);
  best.gain=(r.now-1)*pool;
  return { spend:best.spend, gain:Math.round(best.gain), net:Math.round(best.net), interior,
    threshold:th, belowThreshold:best.spend<th, elast:advElast(reg,prod), sameShare:r.sameShare,
    nextQuarterTail:Math.round((r.next||0)*baseUnits*margin),
    why: best.spend===0
      ? `הסף האפקטיבי כאן ~${fmt(th)} — בנפח של ${fmt(baseUnits)} יח׳ ושוליים ${fmt(Math.round(margin))}/יח׳ הוא לא מוחזר. עדיף 0 מלהתיז מתחת לסף.`
      : `${fmt(best.spend)} = הנקודה שבה השקל הבא בפרסום מפסיק להחזיר את עצמו (גמישות ${advElast(reg,prod)}, סף ${fmt(th)}). תוספת צפויה ~${fmt(Math.round((r.now-1)*baseUnits))} יח׳ הרבעון${r.next>0?` ועוד ~${fmt(Math.round(r.next*baseUnits))} יח׳ בזליגה לרבעון הבא`:''}.` };
}

function migrateIntel(){ // coerce legacy array marketIntel into the structured object shape
  QUARTERS.forEach(q=>{ const Q=S.quarters[q]; if(!Q)return;
    const mi=Q.marketIntel;
    if(!mi || Array.isArray(mi) || typeof mi!=='object'){ Q.marketIntel={competitors:{},sales:[],sources:[],generic:[]}; }
    else { mi.competitors=mi.competitors||{}; mi.sales=mi.sales||[]; mi.sources=mi.sources||[]; mi.generic=mi.generic||[]; }
  });
  // WS-2: correct legacy USD-based FX to the game's SF rates (only if untouched old default)
  const fx=S.config&&S.config.params&&S.config.params.fx;
  if(fx && (fx.EUR===1.08 || fx.BRL===0.20 || fx.CHF===1.10)) S.config.params.fx={...FX_DEFAULT};
  // Fix #0: one-time correction of game constants that earlier builds had wrong (FX/tax/collection),
  // aligning saved states to the authoritative Data Log. Runs once; later user edits are preserved.
  if(S.config && S.config.params){ S.meta=S.meta||{};
    if(S.meta.datalogV!==2){ const P=S.config.params;
      P.fx={USD:1, EUR:1.5, BRL:0.5, CHF:1}; // v2: re-correct FX after cross-check vs real reports (v1 had wrong 0.667/2.0)
      P.tax={...DATALOG.tax};
      P.collection={ us:[...DATALOG.collection.us], europe:[...DATALOG.collection.europe], brazil:[...DATALOG.collection.brazil], hq:[100,0,0] };
      P.interest={bank:5.5, supplierCredit:7, h4:5.5, securities:2};
      S.meta.datalogV=2;
    }
    // Strategy layer: seed Group 8's Q9 targets, X3 contract, and no-loans red line into existing states.
    if(S.config.goals && S.meta.strategyV!==1){ const G=S.config.goals;
      G.cumProfitTarget=G.cumProfitTarget||7046000; G.finalRETarget=G.finalRETarget||4616000;
      G.equityTarget=G.equityTarget||12616000; G.debtFreeFrom=G.debtFreeFrom||'Q8';
      if(G.noExternalLoans===undefined) G.noExternalLoans=true;
      if(!G.techXTarget) G.techXTarget=3; if(!G.techYTarget) G.techYTarget=1;
      if(!Array.isArray(S.config.contracts)||!S.config.contracts.some(c=>c.id==='x3q5')){
        S.config.contracts=[...(S.config.contracts||[]), ...DEFAULT_CONTRACTS];
      }
      S.meta.strategyV=1;
    }
    // FIX #40 (P0): earlier builds stored the commitment with grade 3 only and the note
    // "ללא קנס" — both wrong against the signed agreement. Re-seed the real terms once
    // (price/currency/collection/penalty/clause-5 fallback) without touching other edits.
    if(S.config.goals && S.meta.contractV!==2){
      const byId={}; (S.config.contracts||[]).forEach(c=>byId[c.id]=c);
      DEFAULT_CONTRACTS.forEach(d=>{ const cur=byId[d.id];
        if(!cur){ S.config.contracts=[...(S.config.contracts||[]),{...d}]; return; }
        ['price','currency','collection','penaltyPct','freightOnSeller','fallbackGrade',
         'fallbackAllowed','fallbackBlockedNote','region','counterparty','note']
          .forEach(k=>{ if(cur[k]===undefined||k==='note'||k==='counterparty') cur[k]=d[k]; });
      });
      S.meta.contractV=2;
    }
  }
  // fix the stale fictitious OpenAI default model that earlier builds shipped
  if(S.ai && S.ai.models && S.ai.models.openai==='gpt-5.6') S.ai.models.openai='gpt-4o';
  // normalise legacy inventory product labels ("Chip אירופה") to canonical X/Y + region
  QUARTERS.forEach(q=>{ const inv=(S.quarters[q]&&S.quarters[q].operational&&S.quarters[q].operational.inventory)||[];
    inv.forEach(it=>{ const s=String(it.product||'');
      if(s!=='X'&&s!=='Y'){ if(/chip|שבב/i.test(s)) it.product='X'; else if(/computer|pc|מחשב/i.test(s)) it.product='Y';
        if(!it.region){ const reg=REGIONS.find(r=>s.includes(r.name.split(' ')[0])); if(reg) it.region=reg.id; } } }); });
}
function deepMerge(base, over){
  if(Array.isArray(over)) return over;
  if(over && typeof over==='object' && base && typeof base==='object' && !Array.isArray(base)){
    const out={...base};
    for(const k in over){ out[k]=(k in base)?deepMerge(base[k],over[k]):over[k]; }
    return out;
  }
  return over===undefined?base:over;
}

/* ---------- Utilities ---------- */
/* Marks a figure that comes from a calibrated ESTIMATE rather than a sourced constant.
   The distinction existed only inside the rules card; a player reading "פרסום 239,000"
   on an action card had no way to know it rested on an assumed elasticity. */
function est(html, why){ return `<span class="est" title="${esc(why||'אומדן מכויל — לא מספר מצוטט מחוקי המשחק')}">${html}<sup>~</sup></span>`; }
/* I-1 · A third category the app was missing. `est` means "we calibrated this"; `src` means "a
   source states it". Neither fits a number that came out of an OCR-reconstructed file and is NOT
   on the printed page — that is not an estimate, it is an unverified reading, and the difference
   matters when a plan is built on it. */
const CAPACITY_UNVERIFIED={
  X:{ europe:'הדף המודפס של Data Log 03 נושא שלושה מספרים בלבד בטבלת הקיבולת (50.000 · 25.000 · 18.000). 35,000 אינו מופיע בו — הוא הגיע מקובץ ה-xlsx ששוחזר ב-OCR.',
      brazil:'12,000 אינו מופיע בדף המודפס של Data Log 03 — מקורו בשחזור ה-OCR.' },
  Y:{ brazil:'14,000 אינו מופיע בדף המודפס של Data Log 03 — מקורו בשחזור ה-OCR.' } };
const capUnverified=(product,rid)=>((CAPACITY_UNVERIFIED[product]||{})[rid])||null;
/* Wrap a figure the sources do not confirm. Deliberately louder than `est`: an unverified number
   should look different from a calibrated one, because the fix is different (go read the page). */
function unver(html, why){ return `<span class="unver" title="${esc(why)}">${html}<sup>?</sup></span>`; }
/* Does a capacity total lean on any figure the printed page does not carry? If it does, the
   total inherits the doubt — a derived number is only as sourced as its inputs. */
function anyCapUnverifiedInUse(plantsByRegion){
  if(!plantsByRegion) return false;
  return Object.entries(plantsByRegion).some(([rid,byProd])=>
    ['X','Y'].some(p=>((byProd||{})[p]||0)>0 && capUnverified(p,rid)));
}
function capacityFigure(product,rid){
  const v=(DATALOG.capacity[product]||{})[rid]||0, why=capUnverified(product,rid);
  return why?unver(fmt(v),why):fmt(v);
}

function fmt(n,dec=0){ if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function qIndex(q){ return QUARTERS.indexOf(q); }
function nextQuarters(from){ return QUARTERS.slice(qIndex(from)+1); }

function planHorizon(from){ return nextQuarters(from); }

  const el=document.createElement('div'); el.className='toast '+cls; el.textContent=msg;
  $('#toast').appendChild(el); setTimeout(()=>{el.style.opacity=0;el.style.transition='.4s';setTimeout(()=>el.remove(),400);},2600);

// the quarterly loop, in work order — the one sequence a team member follows each quarter
const FLOW_STEPS=[
  {id:'ingest',    n:'1', t:'קליטה'},
  {id:'dashboard', n:'2', t:'אבחון'},
  {id:'plan',      n:'3', t:'החלטות'},
  {id:'sim',       n:'4', t:'סימולטור'},
  {id:'export',    n:'5', t:'הזנה'},
];
function flowStepper(id){
  const idx=FLOW_STEPS.findIndex(s=>s.id===id); if(idx<0) return '';
  return `<div class="flow">${FLOW_STEPS.map((s,i)=>
    `<button class="fstep ${i===idx?'cur':(i<idx?'done':'')}" onclick="go('${s.id}')"><span class="fn">${i<idx?'✓':s.n}</span><span class="ft">${s.t}</span></button>`+
    (i<FLOW_STEPS.length-1?'<span class="fsep">‹</span>':'')
  ).join('')}</div>`;
}
function flowNext(id){
  const idx=FLOW_STEPS.findIndex(s=>s.id===id); if(idx<0) return '';
  const nx=FLOW_STEPS[idx+1];
  if(!nx) return `<div class="flownext"><span class="hint">${IC('check')} סיימת את הלולאה הרבעונית. חזור לשלב 1 בפתיחת הרבעון הבא.</span><button class="btn" onclick="go('ingest')">${IC('inbox')} רבעון חדש</button></div>`;
  return `<div class="flownext"><span class="hint">השלב הבא ברצף:</span><button class="btn primary" onclick="go('${nx.id}')">שלב ${nx.n} · ${nx.t} ←</button></div>`;
}
function go(id){
  if(PAGE_ALIAS[id]) id=PAGE_ALIAS[id];

/* =========================================================================
   DETERMINISTIC ENGINE  (F4 cash-flow, F3 alerts, scoring proxy)
   ========================================================================= */
function unifiedCashOf(q){
  const fin=S.quarters[q].financial;
  if(fin.consolidated) return fin.consolidated; // authoritative figure from the report (CHF)
  let sum=0; REGIONS.forEach(r=> sum += (fin.cash[r.id]||0)*fxRate(r.cur)); return sum;
}
function inventoryValue(q){ return S.quarters[q].operational.inventory.reduce((a,i)=>a+(i.qty||0)*(i.cost||0),0); }
// Finished-goods primitive — the single most important standing state in INTOPIA.
// Finished PCs (Y) already carry the full cost of the value chain; leaving them unsold
// earns nothing and starves the 50% past-half (profit/ROE/ROI/ROS). This is TRUE regardless
// of whether the company already has some revenue — the engine used to only "notice" selling
// when revenue was exactly 0, so idle finished stock became invisible the moment sales began.
function finishedGoods(q){
  const inv=(S.quarters[q]&&S.quarters[q].operational&&S.quarters[q].operational.inventory)||[];
  const pc=inv.filter(i=>i.product==='Y'&&(i.qty||0)>0);
  const chip=inv.filter(i=>i.product==='X'&&(i.qty||0)>0);
  const pcUnits=pc.reduce((a,i)=>a+(i.qty||0),0);
  const chipUnits=chip.reduce((a,i)=>a+(i.qty||0),0);
  const unpricedPc=pc.filter(i=>!(i.price>0));
  const plan=(pcUnits>0)?pcPlanFor(q):[];
  const potentialRevenue=plan.reduce((a,p)=>a+p.revenue,0);
  return {pc,chip,pcUnits,chipUnits,unpricedPc,plan,potentialRevenue,hasFinished:pcUnits>0,anyUnpriced:unpricedPc.length>0};
}

/* FIX #30 (P1) — Data Log 04 selling cost per unit sold. The table was in DATALOG and used
   nowhere, so every margin, every advertising optimum and every cash line ignored 33–40 LC on
   a 130 EUR computer: a quarter of the price. The rate depends on whether the area sells chips
   only, computers only, or both (selling both is cheaper per unit). */
function sellingCostLC(regionId, product, sellsBoth){
  const T=DATALOG.sellingCostPerUnit;
  const key = product==='X' ? (sellsBoth?'xyX':'xOnly') : (sellsBoth?'xyY':'yOnly');
  return (T[key]||{})[regionId]||0;
}
/* FIX #31 (P1) — Data Log 03 depreciation (chips 8%/Q, computers 5%/Q). Also declared and
   never used, which overstated asset value and therefore the financial-health component of
   the potential half of the score. Charged as a non-cash P&L expense per declared plant. */
function depreciationLC(regionId, product, plantCount){
  const cost=(DATALOG.plantAcqCost[product]||{})[regionId]||0;
  const rate=(DATALOG.depreciation[product]||0)/100;
  return Math.round(cost*rate*(plantCount||0));
}
function depreciationSF(){
  let sf=0;
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    ['X','Y'].forEach(pr=>{ const n=plantsForProduct(r.id,pr); if(n>0) sf+=depreciationLC(r.id,pr,n)*fxRate(r.cur); });
  });
  return Math.round(sf);
}
function projectCashflow(baseQuarter, leversByQuarter){
  const p=S.config.params;
  let bal={}; REGIONS.forEach(r=> bal[r.id]=S.quarters[baseQuarter].financial.cash[r.id]||0);
  const out=[]; const startIdx=qIndex(baseQuarter); let pipeline=[];
  const push=(region,fromIdx,amount)=>{ const sched=p.collection[region]||[100,0,0];
    sched.forEach((pct,k)=>{ if(pct>0 && fromIdx+k<QUARTERS.length) pipeline.push({region,q:QUARTERS[fromIdx+k],amount:amount*pct/100}); }); };
  // Data Log 09: taxes go to A/P1 — accrued now, paid out of cash one quarter later.
  // Data Log 07: a fraction of a loss carries forward automatically for exactly one quarter.
  const taxDue={}, lossCarry={}; REGIONS.forEach(r=>{ taxDue[r.id]=0; lossCarry[r.id]=0; });
  for(let i=startIdx+1;i<QUARTERS.length;i++){
    const q=QUARTERS[i]; const lev=(leversByQuarter&&leversByQuarter[q])||{}; let taxSF=0;
    const nextTaxDue={}, nextLoss={};
    REGIONS.forEach(r=>{
      const rl=(lev.regions&&lev.regions[r.id])||{};
      // FIX #74: every line in the area contributes to revenue, cost, advertising and units sold
      const _ls=activeLines(lev,r.id);
      const sales=_ls.reduce((a,l)=>a+l.sales,0) || (rl.sales||0);
      const prodCost=_ls.reduce((a,l)=>a+l.production*l.unitCost,0) || ((rl.production||0)*(rl.unitCost||0));
      const adv=_ls.reduce((a,l)=>a+l.advertising,0) || (rl.advertising||0);
      const invest=rl.invest||0, transferIn=rl.transferIn||0, transferOut=rl.transferOut||0,
            // FIX #27 (P1): R&D is form H1-1 — a Liechtenstein (HQ) expense in SF. It was being
            // split /4 here and /3 in projectedNetAdd, so cash and P&L told two different stories
            // and 75% of the drain was charged to areas that never pay it.
            rd=(r.id==='hq')?(lev.rd||0):0;
      const facCost=(rl.newFac||0)*(p.factoryCost||0), offCost=(rl.offices||0)*(p.officeCost||0); // WS-4: A2-1 build + A1-3 operating
      // FIX #30: selling cost is charged per UNIT SOLD (Data Log 04), and it is large.
      const sellsBoth=sellsBothIn(lev,r.id);
      const unitsSold=_ls.reduce((a,l)=>a+(l.qtySold||0),0);
      const sellCost=_ls.reduce((a,l)=>a+(l.qtySold||0)*sellingCostLC(r.id,l.product,sellsBoth),0);
      // regional differential tax on operating profit (facCost is capex, excluded)
      const pretax=sales - prodCost - adv - rd - offCost - sellCost;
      // a carried loss shields this quarter's profit before tax is computed
      const taxable=Math.max(0, pretax - (lossCarry[r.id]||0));
      const tax=taxable*((p.tax[r.id]||0)/100); taxSF += tax*fxRate(r.cur);
      nextTaxDue[r.id]=tax;                                   // paid next quarter (A/P1)
      nextLoss[r.id]= pretax<0 ? (-pretax)*((DATALOG.lossCarryForward[r.id]||0)) : 0; // 1 quarter only, then it expires
      if(sales) push(r.id,i,sales);
      // Fix #1: A3-1 transfers conserve cash. transferIn credits this region (borrow inflows also use transferIn alone);
      // transferOut debits the source region and pays the real exchange commission (Data Log 07) — so a Brazil→HQ
      // move no longer creates money, it nets to ~zero minus the fee.
      const commRate=(DATALOG.exchangeCommission[r.id]||0)/100;
      bal[r.id] -= (prodCost*(p.productionPay[0]/100)) + adv + invest + rd + facCost + offCost + sellCost
                   + (taxDue[r.id]||0)   // last quarter's tax bill lands now, not this quarter's
                   - transferIn + transferOut*(1+commRate);
    });
    REGIONS.forEach(r=>{ taxDue[r.id]=nextTaxDue[r.id]||0; lossCarry[r.id]=nextLoss[r.id]||0; });
    pipeline.filter(x=>x.q===q).forEach(x=> bal[x.region]+=x.amount);
    // FIX #25 (P1): every rate in Data Log 07 is per QUARTER. The old `/4` treated the HO
    // loan rate as annual and understated interest fourfold.
    const loans=S.quarters[baseQuarter].financial.loans||0;
    bal.hq -= loans*(p.interest.bank/100);
    // Data Log 07: positive local balances earn interest each quarter. Small, but it is the
    // difference between idle cash being dead and merely slow.
    REGIONS.forEach(r=>{ if(bal[r.id]>0) bal[r.id] += bal[r.id]*((DATALOG.interest.posBalance.lc[r.id]||0)/100); });
    // FIX #24 (P1): a region in deficit is NOT free. Data Log 07 charges a negative-balance /
    // supplier-credit rate that steps up above a per-area switchover. Without this the engine
    // showed a region sitting at -2M for five quarters at zero cost.
    const negCost={};
    REGIONS.forEach(r=>{ if(bal[r.id]<0){
      const owed=-bal[r.id];
      const sw=(DATALOG.interest.supplierCredit.switchover[r.id]||Infinity);
      const rate=(owed>sw ? DATALOG.interest.negBalance.above[r.id] : DATALOG.interest.negBalance.below[r.id])||0;
      const chg=owed*(rate/100); negCost[r.id]={owed:Math.round(owed),rate,charge:Math.round(chg)};
      bal[r.id] -= chg;
    }});
    const cashByRegion={...bal};
    let unified=0; REGIONS.forEach(r=> unified += cashByRegion[r.id]*fxRate(r.cur));
    const floor=S.config.goals.floors[q]||0;
    // FIX #22 (P1): consolidated cash is not liquidity. A region in deficit is a breach even
    // when the SF total looks healthy — cash is currency-segmented and not freely fungible.
    const negRegions=REGIONS.filter(r=>cashByRegion[r.id]<0).map(r=>r.id);
    const regionFloors=(S.config.goals.regionFloors)||{};
    const belowRegionFloor=REGIONS.filter(r=>(regionFloors[r.id]||0)>0 && cashByRegion[r.id]<regionFloors[r.id]).map(r=>r.id);
    out.push({q,cashByRegion,unified,floor,
      breach:(unified<floor)||negRegions.length>0||belowRegionFloor.length>0,
      breachUnified:unified<floor, negRegions, belowRegionFloor, negCost,
      negCostSF:Math.round(REGIONS.reduce((a,r)=>a+((negCost[r.id]&&negCost[r.id].charge)||0)*fxRate(r.cur),0)),
      distance:unified-floor,tax:Math.round(taxSF)});
  }
  return out;
}
/* ==========================================================================
   PLANT TYPE — declared, never assumed.
   The report gives "PLANTS BUILT AND BUILDING" per area but does NOT say which are
   chip plants and which are computer plants. Everything that talks about capacity
   was quietly assuming a plant can make whatever we ask of it — which decides
   whether a 30,000 X3 commitment is even physically possible. The split is now a
   one-time declaration, and where it is missing the engine says "unknown" instead
   of guessing.
   ========================================================================== */
function plantSplit(){ return (S.config && S.config.plantSplit) || {}; }
/* Declared plants of a product in a region, or null when the team has not declared it. */
function plantsForProduct(regionId, product){
  const d=plantSplit()[regionId];
  if(!d) return null;
  const v=d[product];
  return (v==null||v==='')?null:Math.max(0,Number(v)||0);
}
/* Does the declaration line up with the plant count the report actually shows? */
function plantSplitStatus(){
  const op=S.quarters[S.activeQuarter].operational, by=op.plantsByRegion||null;
  const rows=REGIONS.filter(r=>r.id!=='hq').map(r=>{
    const total=by?(by[r.id]||0):null;
    const x=plantsForProduct(r.id,'X'), y=plantsForProduct(r.id,'Y');
    const declared=(x!=null||y!=null);
    const sum=(x||0)+(y||0);
    return { rid:r.id, name:r.name, total, x, y, declared,
      mismatch: declared && total!=null && sum!==total, sum };
  });
  return { rows, complete: rows.every(r=>r.total===0 || r.declared),
    anyMismatch: rows.some(r=>r.mismatch) };
}
/* Chip capacity per quarter — only from plants declared as chip plants. Returns
   {units, known}. known:false means we genuinely do not know, and callers must say so. */
function capacityForProduct(product){
  const op=S.quarters[S.activeQuarter].operational, by=op.plantsByRegion||null;
  let units=0, known=true, anyPlants=false;
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    const total=by?(by[r.id]||0):0; if(total>0) anyPlants=true;
    const n=plantsForProduct(r.id,product);
    if(n==null){ if(total>0) known=false; return; }
    units += n*((DATALOG.capacity[product]||{})[r.id]||0);
  });
  return { units, known: known||!anyPlants, anyPlants };
}
window.setPlantSplit=(rid,product,val)=>{
  S.config.plantSplit=S.config.plantSplit||{};
  S.config.plantSplit[rid]=S.config.plantSplit[rid]||{X:null,Y:null};
  const n=(val===''||val==null)?null:Math.max(0,parseInt(val)||0);
  S.config.plantSplit[rid][product]=n; save();
  if(document.getElementById('goalBody')) goalTab('params');
};

/* ==========================================================================
   CASH BUDGET — what the recommendations are allowed to cost.
   The action list used to be built without ever asking whether the company can pay
   for it. Measured on a realistic Q3 position: available 1,340,500 SF, derived floor
   555,632, and the recommended set totalled 1,868,048 — more than the cash that
   exists. Worse, the idle-cash action offered to park 682,184 in securities while the
   same list was spending 445,500 on advertising: the tool was recommending that the
   same money be both spent and deposited.

   Every action now carries its cash cost, the set is allocated against a real budget in
   priority order, and anything that does not fit is marked instead of silently offered.
   ========================================================================== */
function actionCashCostSF(it){
  if(!it||!it.sim) return 0;
  const p=S.config.params; let c=0;
  Object.entries(it.sim.regions||{}).forEach(([rid,g])=>{
    const reg=REGIONS.find(x=>x.id===rid); if(!reg) return;
    const fx=fxRate(reg.cur);
    // only the cash share of production is paid now; the rest sits in A/P (Data Log 09)
    c += ((g.production||0)*(g.unitCost||0))*((p.productionPay&&p.productionPay[0]||100)/100)*fx;
    c += (g.advertising||0)*fx;
    c += (g.invest||0)*fx;
    c += (g.newFac||0)*(p.factoryCost||0);
    c += (g.offices||0)*(p.officeCost||0);
  });
  c += (it.sim.rd||0);
  return Math.round(c);
}
/* What an action BRINGS IN, not only what it costs. Data Log 09 collects a fixed share of
   consumer revenue as cash in the quarter of the sale (US 40%, Europe 50%, Brazil 30%) and
   the rest over the following one to two quarters. Costing an action without this made the
   single most valuable move in the game — selling finished inventory — look like a pure
   590,364 SF expense when it actually returns 3,412,500 SF of cash the same quarter. */
function actionCashReturnSF(it){
  if(!it||!it.sim) return {now:0, later:0, revenue:0};
  const coll=S.config.params.collection||{};
  let now=0, later=0, revenue=0;
  Object.entries(it.sim.regions||{}).forEach(([rid,g])=>{
    const reg=REGIONS.find(x=>x.id===rid); if(!reg) return;
    const fx=fxRate(reg.cur);
    const sales=(g.sales||((g.price||0)*(g.qtySold||0)))*fx;
    if(!sales) return;
    const sched=coll[rid]||[100,0,0];
    revenue+=sales; now+=sales*(sched[0]||0)/100; later+=sales*(((sched[1]||0)+(sched[2]||0))/100);
  });
  return {now:Math.round(now), later:Math.round(later), revenue:Math.round(revenue)};
}
function actionCashFlowSF(it){
  const out=actionCashCostSF(it), r=actionCashReturnSF(it);
  return {out, inNow:r.now, inLater:r.later, revenue:r.revenue, net:r.now-out};
}
/* Base spendable cash: what we hold, less the floor we must still be standing on at the end
   of the quarter. Incoming revenue is excluded HERE on purpose — the floor must survive even
   if nothing sells. Expected collection is added separately, and labelled as contingent. */
function cashBudget(){
  const base=S.activeQuarter;
  const available=Math.round(unifiedCashOf(base));
  // Reserve only the NON-discretionary part of the floor. The discretionary part (advertising,
  // planned production) is exactly what this budget is about to allocate — subtracting it here
  // as well would charge every recommended expense twice and make the tool refuse everything.
  let floor=DATALOG.minHOCashSF, fullFloor=floor;
  try{ const fc=floorComponents(base); floor=fc.mandatory; fullFloor=fc.total; }catch(e){}
  return {available, floor, fullFloor, spendable:Math.max(0, available-floor)};
}
/* Allocate the recommended set in priority order against a RUNNING balance, so an action
   that funds the quarter (selling stock) creates room for the ones below it, instead of
   being charged as if it only consumed. An action fits if the balance never goes negative. */
function budgetAllocation(items){
  const b=cashBudget();
  let bal=b.spendable, out=0, inNow=0, inLater=0;
  const rows=items.map(it=>{
    const cf=actionCashFlowSF(it);
    const fits=(bal-cf.out)>=0;
    if(fits){ bal=bal-cf.out+cf.inNow; out+=cf.out; inNow+=cf.inNow; inLater+=cf.inLater; }
    return {it, ...cf, cost:cf.out, fits:cf.out===0?true:fits, balanceAfter:Math.round(bal)};
  });
  const totalOut=rows.reduce((a,r)=>a+r.out,0);
  return {...b, used:out, totalOut, inNow, inLater,
    capacity:b.spendable+inNow,                 // what the quarter can actually carry
    strictBalance:b.spendable-totalOut,          // if NOTHING sells, is the floor still safe?
    rows, over:Math.max(0, totalOut-(b.spendable+inNow))};
}

/* ==========================================================================
   CASH FLOOR — derived, not guessed.
   The floor used to be a blank field defaulting to 0, with an unsourced 250,000
   fallback. A floor that means something answers one question: how much cash must
   we hold at the END of a quarter to survive the NEXT one?

   The reasoning, and why revenue is not netted off:
   Data Log 09 — consumer revenue arrives with a lag (US 40% cash / 60% after 1Q;
   Europe 50/20/30; Brazil 30/30/40). So next quarter's sales cannot pay next
   quarter's bills. Data Log 09 also says fixed plant costs and all other expenses
   come straight out of cash, while only variable manufacturing and tax sit in A/P.
   So the floor = the legal minimum + the outflows of the next quarter that cannot
   be deferred, and it deliberately does NOT count on incoming sales.
   ========================================================================== */
function floorComponents(forQuarter){
  const base=S.activeQuarter, p=S.config.params, op=S.quarters[base].operational, f=S.quarters[base].financial;
  const sc=S.scenarios[0];
  const nextQ=QUARTERS[qIndex(forQuarter)+1]||null;    // the quarter this floor has to fund
  const lev=(sc&&nextQ&&sc.levers[nextQ])||(sc&&sc.levers[forQuarter])||null;
  const plantsBy=op.plantsByRegion||null;
  // `disc` marks a component that IS the discretionary spending this quarter's decisions are
  // allocating. The floor counts it (the cash must be there), but the decision budget must not
  // subtract it as well — that would charge the same advertising twice.
  const items=[]; const add=(label,sf,src,disc)=>{ if(sf>0) items.push({label,sf:Math.round(sf),src,disc:!!disc}); };

  add('מינימום חוקי במטה', DATALOG.minHOCashSF, 'Data Log 10 — נדרש בכל עת');

  // Fixed plant cost — paid directly out of cash, never deferred (Data Log 09)
  let plantFixed=0;
  if(plantsBy) REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const n=plantsBy[r.id]||0;
    for(let k=0;k<n;k++){ const tbl=(DATALOG.plantFixedCost.Y[r.id]||[]); plantFixed += (tbl[Math.min(k,tbl.length-1)]||0)*fxRate(r.cur); } });
  add('עלות קבועה של מפעלים', plantFixed, 'Data Log 03/09 — יוצאת ישירות מהמזומן');

  // Captive sales offices — fixed quarterly cost
  let offices=0;
  REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const n=(lev&&lev.regions[r.id]?lev.regions[r.id].offices:0)||0;
    if(n>0) offices += ((DATALOG.officeFixedCost.central[r.id]||0) + Math.max(0,n-1)*(DATALOG.officeFixedCost.regional[r.id]||0))*fxRate(r.cur); });
  add('משרדי מכירות', offices, 'Data Log 04 — מרכזי + אזוריים');

  // R&D at least at the legal minimum for whatever we are actually pursuing
  const rdPlanned=(lev&&lev.rd)||0;
  add('מו״פ', Math.max(rdPlanned, DATALOG.rdMinPerQuarter.X), 'Data Log 06 — מינימום חוקי לרבעון');

  // Cash share of variable manufacturing
  let varCash=0, adv=0;
  if(lev) REGIONS.filter(r=>r.id!=='hq').forEach(r=>{ const rl=lev.regions[r.id]||{};
    varCash += (rl.production||0)*(rl.unitCost||0)*((p.productionPay[0]||0)/100)*fxRate(r.cur);
    adv += (rl.advertising||0)*fxRate(r.cur); });
  add('חלק המזומן בעלות ייצור משתנה', varCash, 'Data Log 09 — היתר ב-A/P', true);
  add('פרסום', adv, 'הוצאה שוטפת — יוצאת מהמזומן', true);

  // Tax accrued this quarter lands next quarter (A/P1)
  const projNow=projectCashflow(base, sc?sc.levers:null);
  const taxRow=projNow.find(x=>x.q===forQuarter);
  add('מס שנצבר וישולם ברבעון הבא', (taxRow&&taxRow.tax)||0, 'Data Log 09 — מסים נזקפים ל-A/P1');

  add('ריבית על חוב קיים', ((f.loans||0)*((p.interest.bank||0)/100)/4), 'Data Log 07');

  // Brazil deposit is only live for construction started in Q1–Q3
  if(qIndex(forQuarter)<=qIndex('Q3') && plantsBy && (plantsBy.brazil||0)>0)
    add('פיקדון מפעל ברזיל', DATALOG.brazilPlantDepositBRL*fxRate('BRL'), 'Data Log 08/10 — מופקד מחדש עד סוף Q3');

  // Contractual deliveries that must be produced/bought regardless of market conditions
  const ct=contractPlan().filter(c=>c.productionQuarter===nextQ && c.gap>0);
  let ctCost=0; ct.forEach(c=>{ ctCost += c.estCostSF||0; });
  add('ייצור להתחייבויות חוזיות', ctCost, 'התחייבות מקודשת — לא ניתן לדחות');

  const total=items.reduce((a,i)=>a+i.sf,0);
  const mandatory=items.filter(i=>!i.disc).reduce((a,i)=>a+i.sf,0);
  return {quarter:forQuarter, fundsQuarter:nextQ, items, total, mandatory,
    note:'ההכנסות של הרבעון הבא לא מנוכות: לפי Data Log 09 הגבייה מפוזרת על 1–2 רבעונים, ולכן מכירות של רבעון אינן יכולות לשלם את חשבונות אותו רבעון.',
    planned:!!lev };
}
function recommendFloors(){
  const out={}; const detail={};
  planHorizon(S.activeQuarter).forEach(q=>{ const c=floorComponents(q); out[q]=c.total; detail[q]=c; });
  // Quarters already played keep whatever is set — a floor for the past is meaningless.
  return {floors:out, detail};
}
/* Shows WHY each floor is that number — the whole point of a floor is that the team can
   defend it. Every component names its Data Log source. */
function floorExplainer(){
  const hz=planHorizon(S.activeQuarter); if(!hz.length) return '';
  const rec=recommendFloors(); const first=rec.detail[hz[0]];
  if(!first) return '';
  const set=S.config.goals.floors||{};
  const unset=hz.every(q=>!(set[q]>0));
  return `<div class="card pad" style="margin-bottom:12px;border-inline-start:4px solid ${unset?'var(--amber)':'var(--purple)'};background:var(--bg2)">
    <div class="small" style="line-height:1.9">
      ${unset?`<b style="color:var(--amber)">${IC('warn')} הרצפות עדיין 0 — כלומר אין באמת רצפה.</b><br>`:''}
      <b>${IC('info')} איך המנוע מגזיר את המספר:</b> הרצפה של רבעון היא המזומן שצריך להחזיק ב<b>סופו</b> כדי לשרוד את הרבעון <b>הבא</b>.
      <b>ההכנסות של הרבעון הבא לא מנוכות במכוון</b> — לפי Data Log 09 הגבייה מתפרסת על 1–2 רבעונים (ארה״ב 40% מזומן, אירופה 50%, ברזיל 30%), ולכן מכירות של רבעון אינן יכולות לשלם את חשבונות אותו רבעון.
    </div>
    <div style="overflow-x:auto;margin-top:10px"><table class="tbl"><thead><tr><th>מרכיב (עבור ${esc(hz[0])} → מממן את ${esc(first.fundsQuarter||'—')})</th><th>SF</th><th>מקור</th></tr></thead><tbody>
      ${first.items.map(i=>`<tr><td style="text-align:start">${esc(i.label)}</td><td class="num">${fmt(i.sf)}</td><td class="small muted" style="text-align:start;white-space:normal">${esc(i.src)}</td></tr>`).join('')}
      <tr style="background:rgba(139,124,255,.08)"><td><b>סה״כ רצפה מוצעת ל-${esc(hz[0])}</b></td><td class="num"><b>${fmt(first.total)}</b></td><td></td></tr>
    </tbody></table></div>
    ${!first.planned?`<div class="small" style="color:var(--amber);margin-top:8px">${IC('warn')} אין עדיין תוכנית לרבעון הבא, ולכן מרכיבי הייצור/פרסום מבוססים על מה שקיים. בנה תרחיש וחשב מחדש לדיוק גבוה יותר.</div>`:''}
    <div class="small muted" style="margin-top:8px">רצפות מוצעות לכל האופק: ${hz.map(q=>`${q} <b class="num">${fmt(rec.floors[q]||0)}</b>`).join(' · ')}</div>
  </div>`;
}
window.applyRecommendedFloors=()=>{
  const rec=recommendFloors();
  Object.entries(rec.floors).forEach(([q,v])=>{ S.config.goals.floors[q]=v; });
  save(); toast('רצפות חושבו מהמנוע והוחלו ✓','g');
  if(document.getElementById('goalBody')) goalTab('floors'); // only re-render when the goals page is mounted
};

/* ==========================================================================
   CONTRACTUAL COMMITMENTS — grade-aware, deadline-aware, capacity-aware.
   The old risk test compared TOTAL inventory of a product against the contracted
   quantity, so 30,000 X0 chips silently "covered" a 30,000 X3 commitment. It also
   treated the delivery quarter as the deadline, when goods produced in a quarter
   only enter inventory at its END (Data Log 08) — so the real production deadline
   is one quarter EARLIER than delivery.
   ========================================================================== */
function contractPlan(){
  const base=S.activeQuarter, op=S.quarters[base].operational;
  const cs=Array.isArray(S.config.contracts)?S.config.contracts:[];
  return cs.filter(c=>c.deliveryQuarter && qIndex(c.deliveryQuarter)>=qIndex(base)).map(c=>{
    const need=c.qty||0, grade=(c.grade!=null?c.grade:0), prod=c.product||'X';
    // Only stock of the right product AND a grade that can actually satisfy the contract.
    const eligible=(op.inventory||[]).filter(i=>i.product===prod && (i.grade!=null?i.grade:0)>=grade);
    const stock=eligible.reduce((a,i)=>a+(i.qty||0),0);
    const wrongGrade=(op.inventory||[]).filter(i=>i.product===prod && (i.grade!=null?i.grade:0)<grade)
      .reduce((a,i)=>a+(i.qty||0),0);
    const gap=Math.max(0,need-stock);
    // FIX #40 (P0) — CLAUSE 5. The signed agreement says: "במידה ולמוכר אין אפשרות לספק את
    // הרמה המקורית בחוזה, עליו לספק כמות מספקת של רמה נמוכה מתאימה." The engine used to
    // recognise ONLY the contract grade, so it reported a permanent 30,000-unit gap and the
    // strategist rejected the team's own approved plan (deliver X2 under clause 5) as illegal.
    // fallbackGrade = the lowest grade the buyer must accept; fallbackBlockedNote records the
    // Q6 carve-out (blocked only if company 10 demonstrates Y4 production).
    const fbGrade=(c.fallbackGrade!=null)?c.fallbackGrade:null;
    const fbAllowed=(c.fallbackAllowed!==false) && fbGrade!=null;
    const fbEligible=fbAllowed?(op.inventory||[]).filter(i=>i.product===prod && (i.grade!=null?i.grade:0)>=fbGrade):[];
    const fbStock=fbEligible.reduce((a,i)=>a+(i.qty||0),0);
    const fbGap=fbAllowed?Math.max(0,need-fbStock):null;
    // the binding gap is the one we actually have to close to avoid the penalty
    const bindingGap=fbAllowed?Math.min(gap,fbGap):gap;
    // penalty exposure if we deliver nothing: purchase price + penaltyPct (clause 4)
    const pen=(c.penaltyPct!=null?c.penaltyPct:0);
    const contractValueLC=(c.price||0)*need;
    const penaltyLC=contractValueLC*(1+pen/100);
    const cur=c.currency||'EUR';
    const penaltySF=Math.round(penaltyLC*fxRate(cur));
    const contractValueSF=Math.round(contractValueLC*fxRate(cur));
    // Data Log 08: produced in Qt → in inventory at end of Qt → deliverable in Qt+1.
    const productionQuarter=QUARTERS[qIndex(c.deliveryQuarter)-1]||c.deliveryQuarter;
    const quartersLeft=qIndex(productionQuarter)-qIndex(base);
    const tech=prod==='X'?(op.techX||0):(op.techY||0);
    const techOK=tech>=grade;
    // Upper bound on how much we could make in one quarter, assuming existing plants can
    // run this product. The report gives total plants per area, not X vs Y, so this is a
    // ceiling — flagged as such rather than presented as fact.
    // Capacity for THIS product only — from plants declared as making it. Undeclared
    // plants do not count toward a chip commitment just because they exist.
    const capInfo=capacityForProduct(prod);
    const capPerQuarter=capInfo.units, capKnown=capInfo.known;
    const unitCost=Math.round(((DATALOG.initialConsumerPrice[prod]||{}).europe||0)*
      ((DATALOG.varMfgCostPctOfRetail[prod]||[0.2,0.2])[1]));
    return { ...c, need, grade, prod, stock, wrongGrade, gap, productionQuarter, quartersLeft,
      fbGrade, fbAllowed, fbStock, fbGap, bindingGap, fbBlockedNote:c.fallbackBlockedNote||null,
      penaltyPct:pen, currency:cur, unitPrice:c.price||null,
      contractValueLC, contractValueSF, penaltySF,
      collection:Array.isArray(c.collection)?c.collection:null,
      tech, techOK, capPerQuarter, capKnown,
      capOK: !capKnown ? null : (gap<=capPerQuarter*Math.max(1,quartersLeft)),
      // base is the last COMPLETED quarter, so the quarter being decided right now is base+1.
      // quartersLeft===1 means the production deadline IS this decision; <=0 means it has passed.
      tooLate: quartersLeft<=0,
      startNow: quartersLeft===1,
      slack: Math.max(0,quartersLeft-1),
      estCostSF: Math.round(gap*unitCost*fxRate('EUR')),
      eligibleGrades:[...new Set(eligible.map(i=>i.grade))].sort() };
  }).sort((a,b)=>qIndex(a.deliveryQuarter)-qIndex(b.deliveryQuarter));
}
/* Every route to honouring a supply commitment, with the calendar attached.
   Producing it ourselves is only one of them, and when the grade or the plant is missing it
   is often not even available — but the commitment does not therefore fail. Guide §4.14.2:
   "the seller's obligations will be enforced by expediting missing units, if necessary",
   so the real question is never "can we deliver" but "at what cost, by which route". */
function contractRoutes(c){
  const base=S.activeQuarter, op=S.quarters[base].operational;
  const decideQ=nextQuarters(base)[0];                 // the quarter being decided right now
  const prodQ=c.productionQuarter;                     // production must finish here
  const idx=q=>qIndex(q);
  const routes=[];
  const cap=capacityForProduct(c.prod);
  const gradeNow=c.tech, need=c.grade;
  // R&D lifts a grade by at most 1 per quarter and matures a quarter forward.
  const quartersToGrade=Math.max(0, need-gradeNow);
  const gradeReadyForProductionIn = quartersToGrade===0 ? decideQ : QUARTERS[idx(decideQ)+quartersToGrade];
  const canProduceInProdQ = quartersToGrade===0 || (gradeReadyForProductionIn && idx(gradeReadyForProductionIn)<=idx(prodQ));

  routes.push({ key:'produce', name:`ייצור עצמי ב-${prodQ}`,
    feasible: canProduceInProdQ && cap.known && cap.units>=c.gap,
    unknown: !cap.known,
    why: !cap.known ? `לא הוצהר אילו מפעלים מייצרים ${c.prod} — אי-אפשר לדעת אם יש קיבולת`
      : (!canProduceInProdQ ? `דרגת ${c.prod}${gradeNow} נמוכה מ-${c.prod}${need}. מו״פ מעלה דרגה אחת לרבעון ומבשיל רבעון קדימה → ${c.prod}${need} יהיה זמין לייצור רק ב-${gradeReadyForProductionIn||'מאוחר יותר'}, אחרי מועד הייצור ${prodQ}`

      +`<b>לכן היעד אינו "בדיוק 30,000 X3" אלא "30,000 יחידות בדרגה ${c.prod}${need} ומעלה במלאי".</b> `
      +`דרגה <b>נמוכה</b> מהחוזה אינה עוזרת כלל — היא נופלת למקרה היקר.`,
    cost:'עלות ייצור + עיבוד מחדש מינימלי — זול', form:'A2-3' });

    cost:'תוספת רק על הפער', form:'A2-3 + H6' });

    why:`§4.14.2: <b>"the seller's obligations will be enforced by expediting missing units"</b> — הקונה מובטח בכמות ובדרגה, ההתחייבות תקוים. §4.12 מגדיר את המחיר: <b>"much higher manufacturing costs for the missing goods and a Sales Expediting surcharge on the Income Statement"</b>. `
      +`כלומר הסיכון אינו כשל אספקה אלא <b>עלות ייצור מנופחת + היטל בדוח רו״ה</b> — פגיעה ישירה במחצית העבר של הציון. המדריך אינו נוקב בשיעור המדויק.`,
    cost:'ייצור מנופח + היטל Sales Expediting — היקר ביותר', form:'—' });

    best: routes.find(r=>r.feasible && !r.fallback) || routes[routes.length-1]};
}

/* After-tax P&L a single quarter's levers add. projectedNetAdd sums this across the horizon;

  REGIONS.forEach(r=>{ if(r.id==='hq') return; const rl=(lev.regions&&lev.regions[r.id])||{};

/* Wave 2 · R&D maturation — project the tech grade at Q9 from a scenario's forward R&D.

   furthest below its target, only if that quarter's R&D clears the grade-up budget (~2× the legal
