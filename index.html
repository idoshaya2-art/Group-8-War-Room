/* FIX #14–16 (P1) — R&D is PROBABILISTIC, not a purchase.
   The old model held a single invented threshold (twice the legal minimum, i.e. 80,000 SF for
   a chip grade) and then granted the grade with certainty. Group 8's own record puts a grade
   nearer 300,000–500,000 SF, so every forward plan over-promised technology — and technology
   is 45% of the potential half of the final score.
   The curve below is a saturating probability anchored on three points that the guide and our
   own history both support: at the legal minimum the chance is small but non-zero; it rises
   steeply through the 200–500K band; it never reaches certainty. `scale` is re-fitted from the
   team's actual spend-to-grade history whenever there is any, so the estimate improves each
   quarter instead of staying a guess. Everything here is an ESTIMATE and is labelled as one. */
const RD_MIN={ X:DATALOG.rdMinPerQuarter.X||40000, Y:DATALOG.rdMinPerQuarter.Y||70000 };
const RD_PRIOR_SCALE={ X:300000, Y:400000 };   // SF above the minimum for ~63% of the max chance
const RD_PMAX=0.85;                            // no amount of money buys certainty

/* Fit `scale` from entered quarters: how much did we actually spend, and did the grade move?
   Returns {scaleX, scaleY, obs, src} — with the prior untouched when there is nothing to learn. */
function rdCalibration(){
  const ent=QUARTERS.filter(q=>S.quarters[q].entered);
  let spendHit={X:[],Y:[]}, spendMiss={X:[],Y:[]};
  for(let i=1;i<ent.length;i++){
    const prev=S.quarters[ent[i-1]].operational, cur=S.quarters[ent[i]].operational;
    const spent=prev.rd||0; if(spent<=0) continue;
    // the report gives one R&D figure; attribute it to whichever grade actually moved
    const dX=(cur.techX||0)-(prev.techX||0), dY=(cur.techY||0)-(prev.techY||0);
    if(dX>0) spendHit.X.push(spent); else spendMiss.X.push(spent);
    if(dY>0) spendHit.Y.push(spent); else spendMiss.Y.push(spent);
  }
  const fit=(prod)=>{
    const hits=spendHit[prod], misses=spendMiss[prod];
    if(!hits.length && !misses.length) return {scale:RD_PRIOR_SCALE[prod], obs:0};
    // cheapest success is an upper bound on what a grade costs; dearest failure is a lower one
    const cheapestWin=hits.length?Math.min(...hits):null;
    const dearestLoss=misses.length?Math.max(...misses):null;
    let scale=RD_PRIOR_SCALE[prod];
    if(cheapestWin!=null) scale=Math.max(RD_MIN[prod], (cheapestWin-RD_MIN[prod])/1.0);
    if(dearestLoss!=null) scale=Math.max(scale, (dearestLoss-RD_MIN[prod])*1.2);
    return {scale:Math.max(50000,Math.round(scale)), obs:hits.length+misses.length,
      cheapestWin, dearestLoss};
  };
  const fx=fit('X'), fy=fit('Y');
  return {X:fx, Y:fy, obs:fx.obs+fy.obs,
    src: (fx.obs+fy.obs)>0 ? 'מכויל מרבעונים שנקלטו' : 'אומדן פתיחה — טרם כויל מתוצאות'};
}

/* Probability that `spend` SF this quarter advances ONE grade of `prod`. Estimate. */
function rdSuccessProb(prod, spend, cal){
  const min=RD_MIN[prod]||40000;
  if(!(spend>0)) return 0;
  if(spend<min) return 0;                       // below the legal minimum the entry is invalid
  const c=(cal||rdCalibration())[prod]||{scale:RD_PRIOR_SCALE[prod]};
  const over=Math.max(0,spend-min);
  return RD_PMAX*(1-Math.exp(-over/Math.max(1,c.scale)));
}
/* How much to budget for a target probability — the number the team actually needs. */
function rdSpendForProb(prod, target, cal){
  const min=RD_MIN[prod]||40000;
  const t=Math.min(RD_PMAX*0.99, Math.max(0.01,target||0.6));
  const c=(cal||rdCalibration())[prod]||{scale:RD_PRIOR_SCALE[prod]};
  return Math.round(min + c.scale*Math.log(RD_PMAX/(RD_PMAX-t)));

function projectedTechAt(base, levers){
  const op=S.quarters[base].operational; let tx=op.techX||0, ty=op.techY||0;
  const cal=rdCalibration();
  if(!levers) return {techX:tx, techY:ty, gainX:0, gainY:0, expX:tx, expY:ty, probs:[], cal};
  const g=S.config.goals, tgX=g.techXTarget||9, tgY=g.techYTarget||9;
  // Expected grade: each funded quarter adds its SUCCESS PROBABILITY, not a whole grade.
  // The integer track (tx/ty) still moves on the most likely path so downstream code that

  let expX=tx, expY=ty; const probs=[];

  const levHealth=f.totalEquity>0?_c01(1-Math.min(1,(f.loans||0)/f.totalEquity)):null;

  const value=Math.max(0,Math.min(100,(pastHalf+potentialHalf)/2 - penalty));
  return {value, endCash, breaches, cashHalf:pastHalf, pastHalf, potentialHalf,
    parts:{profScore,effScore,techScore,share:shareObj?shareObj.share:null,health,cumNet,
      rank:rankObj?rankObj.rank:null,rankN:rankObj?rankObj.n:null}};
}

/* ==========================================================================
   WS-3 · Demand model + learning loop.
   Every entered quarter feeds an elasticity-around-observed-point demand model:
   we know our observed share at our observed (price, tech) per region×product,
   and apply calibrated elasticities to predict how CHANGING our levers moves
   share — the honest model for few observations. Elasticities refine as more
   quarters arrive; competitor trends and information gaps are tracked too.
   ========================================================================== */
function _lkey(region,product){ return region+'|'+product; }
function ourPriceFor(Q,product){
  const inv=(Q.operational.inventory||[]).filter(i=>i.product===product && i.price>0);
  if(!inv.length) return null; return inv.reduce((a,i)=>a+i.price,0)/inv.length;
}
function updateLearning(){
  const L=S.learning; if(!L) return;
  const entered=QUARTERS.filter(q=>S.quarters[q].entered);
  L.obs=entered.length; L.market={}; const perKey={};
  entered.forEach(q=>{ const Q=S.quarters[q], sales=(Q.marketIntel||{}).sales||[];
    const byKey={}; sales.forEach(s=>{ const k=_lkey(s.region,s.product); (byKey[k]=byKey[k]||{tot:0,our:0}); byKey[k].tot+=s.units; if(s.company===OUR_CO) byKey[k].our+=s.units; });
    Object.entries(byKey).forEach(([k,v])=>{ if(v.tot<=0) return;
      L.market[k]= L.market[k]!=null ? 0.5*L.market[k]+0.5*v.tot : v.tot; // EMA of market size
      const [region,product]=k.split('|');
      // Our own price is often absent (unpriced inventory is precisely what action #1 is about),
      // which left the anchor price null and made the whole demand model price-blind: the same
      // ceiling came back for 111, 130 and 150. MR28 gives the market price we competed at, so
      // when our own is missing we anchor on that and label the substitution.
      let px=ourPriceFor(Q,product), pxSrc='מחיר שלנו מהמלאי';
      if(px==null){ const mp=mrMarketPrice(region,product); if(mp&&mp.median>0){ px=mp.median; pxSrc='חציון שוק מ-MR28 (מחירנו לא הוזן)'; } }
      (perKey[k]=perKey[k]||[]).push({q, share:v.our/v.tot, price:px, priceSrc:pxSrc,
        tech:product==='X'?Q.operational.techX:Q.operational.techY, units:v.our, total:v.tot});
    });
  });
  L.anchors={}; Object.entries(perKey).forEach(([k,arr])=>{ L.anchors[k]=arr[arr.length-1]; });
  // calibrate price elasticity from points where our price changed
  const est=[]; Object.values(perKey).forEach(arr=>{ for(let i=1;i<arr.length;i++){ const a=arr[i-1],b=arr[i];
    if(a.price>0&&b.price>0&&a.share>0&&b.share>0&&a.price!==b.price){ const e=Math.log(b.share/a.share)/Math.log(b.price/a.price); if(isFinite(e)&&e<0&&e>-6) est.push(e); } } });
  if(est.length){ const avg=est.reduce((x,y)=>x+y,0)/est.length; const w=Math.min(0.7,est.length*0.25);
    L.elast.price=(1-w)*(-1.8)+w*avg; L.elast.priceObs=est.length; } else L.elast.priceObs=0;
  L.trends=detectTrends(entered); L.gaps=infoGaps(entered);
  L.confidence=Math.min(1,L.obs/4); L.updatedAt=Date.now(); save(true);
}
function detectTrends(entered){
  if(entered.length<2) return [];
  const prev=S.quarters[entered[entered.length-2]].marketIntel||{}, cur=S.quarters[entered[entered.length-1]].marketIntel||{};
  const pc=prev.competitors||{}, cc=cur.competitors||{}, out=[];
  Object.values(cc).forEach(c=>{ if(c.num===OUR_CO) return; const p=pc[c.num]; if(!p) return;
    const curRd=(c.rdChip||0)+(c.rdPc||0), prevRd=(p.rdChip||0)+(p.rdPc||0);
    if(prevRd>0 && (curRd-prevRd)/prevRd>0.25) out.push({co:c.num,type:'rd',msg:`חברה ${c.num} מאיצה מו״פ (+${((curRd-prevRd)/prevRd*100).toFixed(0)}%) — סיכון פיגור טכנולוגי`});
    if((c.retainedEarnings||0)-(p.retainedEarnings||0) < -50000) out.push({co:c.num,type:'weak',msg:`חברה ${c.num} נחלשת ברווחים צבורים — הזדמנות לנתח שוק`});
  });
  const shareOf=mi=>{ const s=mi.sales||[]; const t=s.reduce((a,x)=>a+x.units,0)||1; return s.filter(x=>x.company===OUR_CO).reduce((a,x)=>a+x.units,0)/t; };
  const dShare=shareOf(cur)-shareOf(prev);
  if(Math.abs(dShare)>0.02) out.push({type:'ourshare',msg:`נתח השוק שלנו ${dShare>0?'עלה':'ירד'} ב-${(Math.abs(dShare)*100).toFixed(1)} נק׳ מהרבעון הקודם`});
  return out;
}
/* MR17, MR28 and MR74 arrive free and automatically every quarter (חוברת עזר — עמודת
   "עלות אלפי SF": שורות 17, 28 ו-74 = "חינם"), which is exactly why only THREE paid slots
   exist. Recommending their purchase burns a slot on data you already have — so a gap in
   one of them is never a buying decision, it is an ingestion problem.
   FIX #64 (P1): the list previously read ['MR3','MR17','MR28'] and the MR74 hint below
   called MR74 a paid study. Both are inverted against the booklet: MR3 ("סה״כ מכירות")
   costs 10,000 SF, and MR74 ("דו״חות כספיים מטבע 4") is free. Net effect of the bug was a
   wasted paid slot plus a free competitor-ranking report that was never collected — and
   that report feeds 60% of the past-performance half of the final score. */
const MR_FREE=['MR17','MR28','MR74'];
const MR_FREE_SRC='חוברת עזר — מחקרי שווקים, עמודת עלות: 17 · 28 · 74 = חינם';
/* Two sources disagree about the free list and neither is dismissed here.
   The course booklet's cost column (operative above) shows 17/28/74 at zero.
   The guide says something different in two places:
     §VI  — "In standard runs items 3, 17 and 28 are free every quarter, and companies get
             them automatically. This enables the company to order three additional items."
     §4.10.5 — the CIA default set is 3, 28, 29, and "may vary from time to time".
     p.1461 — MR74 specifically: "consolidated statements will be provided free in Qs 4 and 8
             (simulating annual reports) as well as in the last Q of the run".
   So MR3 is contested, and MR74 may be free only in Q4/Q8/Q9 rather than always. The tool
   follows the booklet because it is this course's own material, and shows the conflict so
   the team can settle it with the instructor instead of discovering it mid-quarter. */
/* Both of these were read verbatim out of the guide PDF and both are genuine conflicts with the
   booklet — not vague recollections. The booklet is this course's document and outranks the guide,
   so the operative free list stays 17/28/74. Recording the exact wording matters because it is
   what lets the team settle it in one question if a quarter ever bills us for MR74. */
const MR_FREE_CONFLICTS=[
  {code:'MR3',  claim:'המדריך (נספח הפלט לדוגמה): "In standard runs items 3, 17 and 28 are free every quarter, and companies get them automatically. This enables the company to order three (in standard runs) additional MR items on its own."',
                effect:'המדריך אומר שהשלישי החינמי הוא MR3 — החוברת מתמחרת את MR3 ב-10K ומציינת את MR74 כחינמי. החוברת מחייבת. תקרת שלושת הנרכשים — מאושרת בשני המקורות.'},
  {code:'MR74', claim:'המדריך §4.10.5 (פריטים 71–75): "in most runs consolidated statements will be provided free in Qs 4 and 8 (simulating annual reports) as well as in the last Q of the run"',
                effect:'זו ברירת המחדל הגנרית. עמודת העלות בחוברת רושמת MR74 = "חינם" <b>בלי הגבלת רבעון</b> — ולכן בקורס הזה הוא חינם בכל רבעון.'},
  {code:'MR29', claim:'המדריך §4.10.5: רשימת ברירת המחדל של ה-CIA היא 3, 28, 29', effect:'רשימת ה-CIA "עשויה להשתנות מעת לעת" — לכן היא החלשה מבין השלוש'},
];
/* H-2, closed. This used to warn that MR74 "might be charged" outside Q4/Q8/Q9 and to send the
   team to ask the instructor. Both sources have now been read directly: the guide restricts it to
   the annual-report quarters "in most runs", the booklet's cost column simply says חינם. The
   booklet governs, so there is nothing left to ask. */
const MR74_GUIDE_FREE_QUARTERS=['Q4','Q8','Q9'];
function mrFreeNoteFor(q){
  const generic=MR74_GUIDE_FREE_QUARTERS.includes(q);
  return `דוחות מאוחדים (MR74) — <b>חינם</b>, לפי עמודת העלות בחוברת העזר, בלי הגבלת רבעון. `
    + (generic
      ? `המדריך מגדיר ${MR74_GUIDE_FREE_QUARTERS.join('/')} כרבעוני הדוח השנתי, ו-${q} הוא אחד מהם — שני המקורות מסכימים כאן.`
      : `המדריך הגנרי מגביל זאת ל-${MR74_GUIDE_FREE_QUARTERS.join('/')} "in most runs", אך החוברת של הקורס גוברת. אם רבעון כלשהו כן יחויב עליו — זה הסימן שההרצה שלנו נוהגת לפי המדריך, ואז יש לתקצב 10K.`);
}
function infoGaps(entered){
  const gaps=[]; const last=entered[entered.length-1]; const mi=last?S.quarters[last].marketIntel||{}:{};
  if(!(mi.sales||[]).length)
    gaps.push({mr:'MR17', free:true, why:'MR17 מגיע <b>חינם ואוטומטית</b> בכל רבעון — אם הנתונים חסרים, הדוח לא נקלט או לא נפרס. אל תקנה אותו: קלוט מחדש את הדוח (לשונית 1).'});
  if(!(mi.compPrices||[]).length)
    gaps.push({mr:'MR28', free:true, why:'MR28 (מחירי צרכן) מגיע <b>חינם ואוטומטית</b> — חוסר בו הוא כשל קליטה, לא החלטת רכש.'});
  if(!Object.keys(mi.competitors||{}).length)
    gaps.push({mr:'MR74', free:true, why:'אין מאזן/רו״ה מתחרים — נדרש לדירוג מול המתחרים (60% ממחצית העבר) ולזיהוי מגמות. <b>MR74 הוא מחקר חינם</b> (חוברת עזר) — אל תבזבז עליו סלוט בתשלום; חוסר בו הוא כשל קליטה.'});
  if((S.learning.elast.priceObs||0)===0 && (mi.compPrices||[]).length)
    gaps.push({mr:'MR2', why:'יש מחירים אך אין מספיק תצפיות לכיול גמישות — MR2 (מכירות + נתחי שוק לפי חברה) מוסיף את ממד היחידות שדרוש לכיול.'});
  return gaps;
}
/* How many PAID slots are still free this quarter, given what the plan already orders. */
function mrPaidSlots(targetQ){
  const sc=S.scenarios[0]; const max=3;
  let ordered=[];
  if(sc&&sc.levers[targetQ]) (sc.levers[targetQ].actions||[]).forEach(a=>{ if(Array.isArray(a.mrList)) ordered=ordered.concat(a.mrList); });
  const paid=[...new Set(ordered)].filter(c=>!MR_FREE.includes(c));
  return {max, used:paid.length, left:Math.max(0,max-paid.length), ordered:paid};
}
function predictDemand(region,product,opt){
  const L=S.learning, k=_lkey(region,product), a=L.anchors[k], size=L.market[k];
  if(!a||size==null) return null; opt=opt||{};
  // Price elasticity is region×product per Guide §5.3; once we have enough real price
  // observations the calibrated figure takes over from the rule-book prior.
  const ePrice=(L.elast.priceObs>=2 && L.elast.price) ? L.elast.price : priceElast(region,product);
  let share=a.share;
  if(opt.price>0 && a.price>0) share *= Math.pow(opt.price/a.price, ePrice);
  if(opt.tech!=null && a.tech>0 && opt.tech>0) share *= Math.pow(opt.tech/a.tech, L.elast.tech);
  // Advertising — the determinant the model used to ignore entirely (Guide §4.10.1, §5.4).
  let ad=null;
  if(opt.adv!=null){ ad=advResponse(region,product,opt.adv); share *= ad.now; }
  // Cross-elasticity: a PC price rise pushes buyers toward chips, not the other way (§5.2).
  if(product==='X' && opt.pcPriceChangePct) share *= Math.pow(1+opt.pcPriceChangePct/100, RULES.cross.chipVsPcPrice[region]||0);
  share=Math.max(0,Math.min(1,share));
  const units=Math.round(share*size);
  const conf=Math.min(1,L.obs/4)*((L.elast.priceObs>0)?1:0.6);
  const band=Math.round(units*(1-conf)*0.5);
  return {units, low:Math.max(0,units-band), high:units+band, share, confidence:conf, size, anchor:a,
    ePrice, ePriceSrc:(L.elast.priceObs>=2?'מכויל מ-'+L.elast.priceObs+' תצפיות':'פריור מהמדריך §5.3'),
    adv:ad, advTailNextQuarter: ad? Math.round((ad.next||0)*size*a.share):0 };
}
// Competitor price move via an attraction model: rivals cutting price raises their
// pull by (1-cut)^elast; we renormalise shares. Optionally we counter with the same cut.
function simCompetitorPriceMove(region,product,cutPct,weMatch){
  const L=S.learning, k=_lkey(region,product), a=L.anchors[k], size=L.market[k];
  if(!a||size==null||a.share<=0) return null;
  const elast=L.elast.price; // negative (price down -> demand up)
  const sUs=a.share, sRivals=Math.max(1e-6,1-sUs);
  const rivalMult=Math.pow(1-cutPct/100, elast); // cut>0 -> >1 (rivals more attractive)
  const usMult=weMatch?Math.pow(1-cutPct/100, elast):1;
  const Aus=sUs*usMult, Arivals=sRivals*rivalMult;
  const newShare=Aus/(Aus+Arivals);
  const baseUnits=Math.round(sUs*size), newUnits=Math.round(newShare*size);
  // if we match, our unit price also drops by cutPct — revenue effect uses the anchor price
  const price=a.price||0, newPrice=weMatch?Math.round(price*(1-cutPct/100)):price;
  return { region, product, baseShare:sUs, newShare, baseUnits, newUnits, deltaUnits:newUnits-baseUnits,
    price, newPrice, baseRev:Math.round(baseUnits*price), newRev:Math.round(newUnits*newPrice),
    confidence:Math.min(1,L.obs/4)*(L.elast.priceObs>0?1:0.6) };
}
function learningSummary(){
  const L=S.learning; if(!L||!L.obs) return null;
  return { obs:L.obs, confidence:L.confidence, priceElast:L.elast.price, priceObs:L.elast.priceObs,
    trends:L.trends||[], gaps:L.gaps||[], markets:Object.keys(L.market||{}).length };
}

/* ==========================================================================
   Data-consistency QA — cross-checks every entered quarter against itself,
   against its neighbours, and against the competitor reports (MR74/MR17&28).
   Runs on the team's real data in the browser; every finding cites sources.
   ========================================================================== */
function runDataQA(){
  const F=[]; const eq=enteredQuarters();
  const add=(level,q,title,detail)=>F.push({level,q,title,detail});
  if(!eq.length) return {findings:F,score:null,quarters:0};
  const rel=(a,b)=>{ const m=Math.max(Math.abs(a),Math.abs(b),1); return Math.abs(a-b)/m; };
  eq.forEach(q=>{
    const Q=S.quarters[q], f=Q.financial, op=Q.operational, mi=Q.marketIntel||{};
    // 1 · consolidated cash vs sum of regional cash at config FX
    const sumFx=REGIONS.reduce((a,r)=>a+(f.cash[r.id]||0)*fxRate(r.cur),0);
    if((f.consolidated||0)>0 && sumFx!==0){
      const d=rel(f.consolidated,sumFx);
      if(d>0.08) add('amber',q,'מזומן מאוחד ≠ סכום האזורים',`בדוח: ${fmt(f.consolidated)} · מחושב מהאזורים בשערי הקונפיגורציה: ${fmt(Math.round(sumFx))} (פער ${(d*100).toFixed(0)}%). בדוק שערי המרה או חילוץ מזומן אזורי. [${q}/מאזן מול ${q}/מזומן×FX]`);
      else add('ok',q,'מזומן מאוחד תואם את סכום האזורים',`${fmt(f.consolidated)} מול ${fmt(Math.round(sumFx))} — פער ${(d*100).toFixed(1)}%.`);
    }
    // 2 · balance-sheet identity
    if((f.totalAssets||0)>0 && (f.totalEquity||0)>0){
      const rhs=(f.totalEquity||0)+(f.loans||0)+(f.ap||0)+(f.supplierCredit||0);
      const d=rel(f.totalAssets,rhs);
      if(d>0.10) add('amber',q,'זהות מאזנית לא נסגרת',`נכסים ${fmt(f.totalAssets)} מול הון+חוב+ספקים ${fmt(Math.round(rhs))} (פער ${(d*100).toFixed(0)}%). ייתכן שדה התחייבות שלא חולץ. [${q}/מאזן]`);
      else add('ok',q,'זהות מאזנית נסגרת',`נכסים ${fmt(f.totalAssets)} ≈ הון+התחייבויות ${fmt(Math.round(rhs))}.`);
    }
    // 3 · inventory without price — severity follows the value chain:
    //     chips are intermediate goods (info); finished PCs matter only on the
    //     latest quarter, where the price must be entered for next quarter's sale.
    const latest=eq[eq.length-1];
    const noPriceY=(op.inventory||[]).filter(i=>i.product==='Y'&&(i.qty||0)>0&&!(i.price>0));
    const noPriceX=(op.inventory||[]).filter(i=>i.product==='X'&&(i.qty||0)>0&&!(i.price>0));
    if(noPriceY.length){
      const units=noPriceY.reduce((a,i)=>a+(i.qty||0),0);
      if(q===latest) add('red',q,'מחשבים מוכנים ללא מחיר — פעולה ברבעון הבא',`${fmt(units)} מחשבים במלאי הסגירה בלי מחיר. זה הרבעון שבו נפתחת המכירה — הזן מחיר+פרסום (A1-2) בהזנה הקרובה, אחרת "אין מחיר = אין מכירה". [${q}/מלאי]`);
      else add('info',q,'מלאי מחשבים ללא מחיר (היסטורי)',`${fmt(units)} מחשבים ללא מחיר ב-${q}. [${q}/מלאי]`);
    }
    if(noPriceX.length) add('info',q,'שבבים ללא מחיר — רכיב ביניים',`${fmt(noPriceX.reduce((a,i)=>a+(i.qty||0),0))} שבבים ללא מחיר צרכן — תקין אם מיועדים לעיבוד למחשבים (A4) ולא למכירה. [${q}/מלאי]`);
    // 4 · MR74 our-row vs our own books (MR74 is in 000s)
    const us=(mi.competitors||{})[OUR_CO];
    if(us && us.retainedEarnings!=null && f.retainedEarnings){
      const d=rel(us.retainedEarnings*1000, f.retainedEarnings);
      if(d>0.15) add('amber',q,'MR74 לא תואם את הספרים שלנו',`רווחים צבורים ב-MR74: ${fmt(us.retainedEarnings)}K מול הדוח שלנו: ${fmt(f.retainedEarnings)} (פער ${(d*100).toFixed(0)}%). בדוק יחידות (000s) או חילוץ. [${q}/MR74 מול ${q}/מאזן]`);
      else add('ok',q,'MR74 תואם את הספרים שלנו',`רווחים צבורים: ${fmt(us.retainedEarnings)}K ≈ ${fmt(f.retainedEarnings)}.`);
    }
    // 5 · revenue vs our sold units
    const ourUnits=(mi.sales||[]).filter(s=>s.company===OUR_CO).reduce((a,s)=>a+s.units,0);
    if((f.revenue||0)>0 && ourUnits===0 && (mi.sales||[]).length) add('info',q,'יש מחזור אך MR17&28 לא מראה יחידות שלנו',`מחזור ${fmt(f.revenue)} אך 0 יח׳ לחברה ${OUR_CO} בנתוני המכירות. ייתכן שהמחקר לא כיסה את האזור. [${q}]`);
    if(ourUnits>0 && (f.revenue||0)===0) add('amber',q,'MR מראה מכירות שלנו אך מחזור=0',`${fmt(ourUnits)} יח׳ ב-MR17&28 אך המחזור בדוח 0 — כנראה שדה מחזור לא חולץ. [${q}]`);
    // 6 · ROS sanity
    if((f.revenue||0)>0 && f.ros){
      const ros=f.netProfit/f.revenue*100;
      if(Math.abs(ros-f.ros)>6) add('info',q,'ROS בדוח ≠ רווח/מחזור',`בדוח ${f.ros}% מול מחושב ${ros.toFixed(1)}% — ייתכן בסיס חישוב שונה (מצטבר/שנתי). [${q}/יחסים]`);
    }
  });
  // cross-quarter checks
  for(let i=1;i<eq.length;i++){
    const q=eq[i], p=eq[i-1], f=S.quarters[q].financial, fp=S.quarters[p].financial;
    const op=S.quarters[q].operational, opp=S.quarters[p].operational;
    if(qIndex(q)-qIndex(p)>1) add('amber',q,`פער ברצף הרבעונים (${p}→${q})`,`רבעונים באמצע לא נקלטו — הקרנות ומצטברים יחסרו אותם.`);
    // retained-earnings continuity
    if(fp.retainedEarnings!==0 || f.retainedEarnings!==0){
      const expect=fp.retainedEarnings+(f.netProfit||0);
      const d=rel(f.retainedEarnings,expect);
      if(d>0.10 && Math.abs(f.retainedEarnings-expect)>20000)
        add('amber',q,'רווחים צבורים לא רציפים',`${p}: ${fmt(fp.retainedEarnings)} + רווח ${q}: ${fmt(f.netProfit)} = צפוי ${fmt(Math.round(expect))}, בדוח: ${fmt(f.retainedEarnings)}. בדוק חילוץ רווח נקי/דיבידנד. [${p}→${q}]`);
      else add('ok',q,'רווחים צבורים רציפים',`${fmt(fp.retainedEarnings)} + ${fmt(f.netProfit)} ≈ ${fmt(f.retainedEarnings)}.`);
    }
    // tech must not drop
    if((op.techX||0)<(opp.techX||0) || (op.techY||0)<(opp.techY||0))
      add('red',q,'ירידה ברמה טכנולוגית',`${p}: X${opp.techX}/Y${opp.techY} → ${q}: X${op.techX}/Y${op.techY}. דרגה לא יורדת ב-INTOPIA — כנראה שגיאת חילוץ. [${p}→${q}/תפעול]`);
    // common stock constant
    if((fp.commonStock||0)>0 && (f.commonStock||0)>0 && rel(f.commonStock,fp.commonStock)>0.02)
      add('info',q,'שינוי בהון מניות',`${fmt(fp.commonStock)} → ${fmt(f.commonStock)}. חריג אלא אם הונפק הון. [${p}→${q}/מאזן]`);
    // unexplained cash swing
    const u1=REGIONS.reduce((a,r)=>a+(fp.cash[r.id]||0)*fxRate(r.cur),0), u2=REGIONS.reduce((a,r)=>a+(f.cash[r.id]||0)*fxRate(r.cur),0);
    if(u1>100000 && rel(u1,u2)>0.6 && rel(f.loans||0,fp.loans||0)<0.2)
      add('info',q,'קפיצת מזומן חדה ללא שינוי חוב',`מזומן מאוחד ${fmt(Math.round(u1))} → ${fmt(Math.round(u2))} בעוד החוב כמעט ללא שינוי — ודא שאין שדה שחולץ פעמיים/חסר. [${p}→${q}]`);
  }
  const reds=F.filter(x=>x.level==='red').length, ambers=F.filter(x=>x.level==='amber').length, infos=F.filter(x=>x.level==='info').length;
  const score=Math.max(0,100-15*reds-7*ambers-2*infos);
  return {findings:F,score,quarters:eq.length,reds,ambers,infos};
}
/* ==========================================================================

   measures actual pace vs the pace required to hit Q9, and flags PIVOTS
   (structural gaps that tuning can't close) as opposed to ordinary tuning.
   ========================================================================== */
function updateMasterPlan(){
  const mp=S.masterPlan=S.masterPlan||{snapshots:[]}; const q=S.activeQuarter, Q=S.quarters[q]; if(!Q||!Q.entered) return;
  const sp=scoreProxy(null), op=Q.operational;
  const snap={q, ts:Date.now(), score:Math.round(sp.value), past:Math.round(sp.pastHalf), pot:Math.round(sp.potentialHalf),
    cumNet:Math.round(sp.parts.cumNet), techX:op.techX||0, techY:op.techY||0,
    share:sp.parts.share!=null?+(sp.parts.share*100).toFixed(1):null, rank:sp.parts.rank||null};
  mp.snapshots=(mp.snapshots||[]).filter(s=>s.q!==q); mp.snapshots.push(snap);
  mp.snapshots.sort((a,b)=>qIndex(a.q)-qIndex(b.q)); save(true);
}
function backfillMasterPlan(){ // snapshot every entered quarter as-of, without disturbing the active one
  const cur=S.activeQuarter; S.masterPlan=S.masterPlan||{snapshots:[]};
  enteredQuarters().forEach(q=>{ S.activeQuarter=q; try{ updateMasterPlan(); }catch(e){} });
  S.activeQuarter=cur;
}
function masterPlanStatus(){
  const q=S.activeQuarter, g=S.config.goals, op=S.quarters[q].operational;
  const sp=scoreProxy(null); const remaining=(QUARTERS.length-1)-qIndex(q);
  const snaps=(S.masterPlan&&S.masterPlan.snapshots)||[];
  const tScore=g.q9Score||75;
  // pace: recent score gain per quarter vs required
  let pace=null; if(snaps.length>=2){ const a=snaps[snaps.length-2], b=snaps[snaps.length-1]; const dq=qIndex(b.q)-qIndex(a.q); if(dq>0) pace=(b.score-a.score)/dq; }
  const required=remaining>0?(tScore-sp.value)/remaining:0;
  const pivots=[];
  // 1 · tech unreachable — grades can't skip and rise ≤1/quarter via R&D
  const needX=(g.techXTarget||0)-(op.techX||0), needY=(g.techYTarget||0)-(op.techY||0);
  if(needX>remaining) pivots.push(`יעד דרגת Chip ${g.techXTarget} לא ניתן להשגה עד Q9 (חסרים ${needX} דרגות, ${remaining} רבעונים — דרגה עולה ≤1/רבעון). Pivot: הורד יעד ל-${(op.techX||0)+remaining} או מקד את המשאבים ב-Y.`);
  if(needY>remaining) pivots.push(`יעד דרגת PC ${g.techYTarget} לא ניתן להשגה עד Q9 (חסרים ${needY} דרגות ב-${remaining} רבעונים). Pivot: הורד יעד או ותר על ה-Deluxe הגבוה.`);
  // 2 · score pace structurally behind (including flat/declining — the strongest signal)
  if(remaining>0 && required>1 && pace!=null && pace<=0)
    pivots.push(`הציון תקוע (${pace.toFixed(1)}/רבעון) בעוד נדרש ${required.toFixed(1)}/רבעון כדי להגיע ל-${tScore} עד Q9. זה לא פער כוונון — <b>נדרש שינוי אסטרטגיה</b>: התחל למכור ברווחיות (מחצית העבר תקועה) והפנה מו״פ ליעד שיבשיל בזמן.`);
  else if(remaining>0 && required>0 && pace!=null && pace>0 && pace*1.5<required)
    pivots.push(`קצב הציון (${pace.toFixed(1)}/רבעון) נמוך מהנדרש (${required.toFixed(1)}/רבעון) כדי להגיע ל-${tScore}. Pivot: שנה אסטרטגיה — לא כוונון. שקול מכירה אגרסיבית יותר (מחיר/נפח) או קיצוץ הוצאות עתיד שלא יבשילו.`);

}
/* Goal optimizer — recompute the Q9 targets from the CURRENT state each quarter, benchmarked to
   competitors (MR74) and physical limits, aimed at maximizing the 50/50 score. Honest ambition,
   not proxy-gaming: profit target beats the leader; tech targets are the max reachable by Q9. */
function recommendGoals(){
  const base=S.activeQuarter, g=S.config.goals, op=S.quarters[base].operational, f=S.quarters[base].financial;
  const remaining=Math.max(0,(QUARTERS.length-1)-qIndex(base));
  const entered=enteredQuarters();
  const cumNet=cumRealizedNet(base);
  const profPace=entered.length?cumNet/entered.length:0;
  const comps=Object.values((S.quarters[base].marketIntel||{}).competitors||{}).filter(c=>c.num!==OUR_CO&&c.retainedEarnings!=null);
  const compREabs=comps.map(c=>c.retainedEarnings*1000); // 000s → absolute SF
  const topRE=compREabs.length?Math.max(...compREabs):null;
  const nCo=comps.length+1;
  const paceProj=Math.round(cumNet+profPace*remaining);
  const beatLeader=topRE!=null?Math.round(topRE*1.10):null;              // 10% above the current leader
  const cumProfitTarget=Math.max(paceProj, beatLeader!=null?beatLeader:paceProj);
  const finalRETarget=cumProfitTarget;
  const equityTarget=Math.round(START_CAPITAL+cumProfitTarget);
  const techXTarget=Math.min(9,(op.techX||0)+remaining);                 // ≤1 grade/quarter
  const techYTarget=Math.min(9,(op.techY||0)+remaining);
  const shareObj=marketShareScore(base); const curShare=shareObj?shareObj.share:null;
  // R-56: 2× fair share is the scoring ideal, but a target above what the plants can produce is a
  // target we cannot execute. Cap at the capacity ceiling — never below the share we already hold.
  const capCeil=shareCapacityCeiling();
  const ideal=Math.max(curShare||0, 2/nCo)*100;
  const q9Share=Math.round(capCeil?Math.max((curShare||0)*100, Math.min(ideal, capCeil.pct)):ideal);
  const shareCapped=!!(capCeil && ideal>capCeil.pct+0.05);
  const roe=Math.max(g.scoreTargets.roe, Math.ceil((f.roe||0)*1.1));
  const roi=Math.max(g.scoreTargets.roi, Math.ceil((f.roi||0)*1.1));
  const ros=Math.max(g.scoreTargets.ros, Math.ceil((f.ros||0)*1.1));
  return { remaining, cumNet, profPace, topRE, nCo, cumProfitTarget, finalRETarget, equityTarget,
    techXTarget, techYTarget, q9Share, scoreTargets:{roe,roi,ros},
    capShare:capCeil?capCeil.pct:null, shareCapped, shareIdeal:Math.round(ideal) };
}
/* Why a target sits where it sits. A target that does not move when our own results get worse
   looks broken; usually it is competitor-anchored or capped by physics, and saying so is the
   difference between "the number is stuck" and "the number is not about us". */
function goalDriver(key){
  let rec; try{ rec=recommendGoals(); }catch(e){ return ''; }
  const paceProj=Math.round(rec.cumNet+rec.profPace*rec.remaining);
  const leaderLed = rec.topRE!=null && Math.round(rec.topRE*1.10)>=paceProj;
  switch(key){
    case 'cumProfitTarget': case 'finalRETarget': case 'equityTarget':
      return leaderLed
        ? `נשלט ע״י המתחרה המוביל (רווחים צבורים ${fmt(Math.round(rec.topRE))} ×1.10, מ-MR74) — לא ע״י הקצב שלנו, ולכן הרעה אצלנו לא מזיזה אותו`
        : `נגזר מהקצב שלנו (${fmt(Math.round(rec.profPace))}/רבעון על ${rec.remaining} רבעונים)${rec.topRE==null?' — אין נתוני מתחרים (MR74) לעגן בהם':''}`;
    case 'techXTarget': case 'techYTarget':
      return 'תקרה פיזית — דרגה עולה ≤1/רבעון, ולכן היעד נחסם במה שאפשר להשיג עד Q9';
    case 'q9Share':
      return `פי-2 מהנתח ההוגן (${rec.nCo} חברות = ${(200/rec.nCo).toFixed(1)}%)`+
             (rec.capShare!=null?` · חסום בקיבולת הייצור בפועל (${rec.capShare.toFixed(1)}%)`:'');
    case 'roe': case 'roi': case 'ros':
      return 'הגבוה מבין היעד הקיים לביצוע שלנו +10% — יעד שלא יורד';
    case 'q9Score':
      return 'שאיפה שהצוות קבע ידנית — לא נגזרת מהנתונים ולא זזה מעצמה';
    default: return '';
  }
}

/* ==========================================================================
   D-02 · THE ROLLING PLAN Q(base+1) → Q9.
   The engine only ever planned the next quarter: buildActionPlan was called from six
   places and every one passed nextQuarters(q)[0]. Q5-Q9 existed as three things —
   endpoint targets, a cash projection, and a static Word document — so half the score
   (future potential) was being planned outside the tool.
   What was missing is not more numbers per quarter. It is the BACK-CALCULATION: a
   milestone in Q7 is only reachable if something starts in a specific earlier quarter,
   because every mechanism in this game has a lead time. So the path below carries, for
   each future quarter, what must be true there — and for each of those, the quarter the
   work has to begin. When that quarter has already passed, the milestone is missed, and
   saying so early is the whole point.
   Lead times, all sourced and already encoded elsewhere in this file:
     plant built in Q      → on stream Q+1        (Data Log 03 / §4.7)
     produced in Q         → sellable Q+1         (Data Log 08 / RULES.lags.productionToSale)
     contract delivery Q   → production Q-1       (contractPlan.productionQuarter)
     grade +1 per quarter  → G grades need G Qs    (RULES.rd / DATALOG.rdMinPerQuarter)
     office change in Q    → in force end of Q    (§4.6, RULES.offices.changeTakesAQuarter)
     surface transfer      → one quarter          (RULES.lags.surfaceTransfer)

/* On-stream plants per product for every quarter in the horizon. A plant decided in Q is
   paid for in Q and produces from Q+1, so the pipeline is the declared split today plus
   every newFac the plan commits, shifted one quarter forward. */
function plantPipeline(base, levers){
  const out={}; const split=plantSplit();
  const cur={}; REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
    cur[r.id]={ X:(split[r.id]&&split[r.id].X)||0, Y:(split[r.id]&&split[r.id].Y)||0 }; });
  let running=JSON.parse(JSON.stringify(cur));
  nextQuarters(base).forEach((q,i)=>{
    out[q]=JSON.parse(JSON.stringify(running));
    // whatever this quarter builds joins the NEXT quarter's on-stream count
    const lev=(levers&&levers[q])||{};
    REGIONS.filter(r=>r.id!=='hq').forEach(r=>{
      const rl=(lev.regions&&lev.regions[r.id])||{};
      const built=Math.max(0,Math.round(rl.newFac||0));
      if(built>0){ const p=(rl.product==='X')?'X':'Y'; running[r.id][p]+=built; }
    });
  });
  return out;
}
/* Expected grade per quarter, rather than only the end state projectedTechAt returns.
   A grade rises by at most one per quarter and only in a quarter that funds R&D at or
   above the legal minimum, so the path is a step function the plan can be checked against. */
function techPath(base, levers){
  const op=S.quarters[base].operational;
  const out={}; let tx=op.techX||0, ty=op.techY||0;
  nextQuarters(base).forEach(q=>{
    const lev=(levers&&levers[q])||{};
    const total=lev.rd||0;
    const sx=(lev.rdX!=null)?lev.rdX:null, sy=(lev.rdY!=null)?lev.rdY:null;
    let spendX=sx, spendY=sy;
    if(spendX==null&&spendY==null){ spendY=total; spendX=0; }
    // A grade only moves if the quarter funded that product at or above the legal minimum.
    if((spendX||0)>=DATALOG.rdMinPerQuarter.X) tx=Math.min(9,tx+1);
    if((spendY||0)>=DATALOG.rdMinPerQuarter.Y) ty=Math.min(9,ty+1);
    out[q]={X:tx, Y:ty};
  });
  return out;
}
/* Which quarter must the work start in, for a milestone that has to be true in `atQ`? */
function startQuarterFor(atQ, leadQuarters){
  const i=qIndex(atQ)-Math.max(0,leadQuarters);
  return i>=0?QUARTERS[i]:null;
}
/* The path itself. One row per future quarter: what must be true there, and for each of
   those, when the work has to begin — or that it is already too late. */
function rollingPlan(base, levers){
  const nq=nextQuarters(base); if(!nq.length) return [];
  const proj=projectCashflow(base, levers||null);
  const byQ={}; proj.forEach(p=>byQ[p.q]=p);
  const pipe=plantPipeline(base, levers);
  const tech=techPath(base, levers);
  const contracts=contractPlan();
  const g=S.config.goals;
  const firstActionable=nq[0];
  const rows=nq.map(q=>{
    const cash=byQ[q]||null;
    const plants=pipe[q]||{};
    const capX=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>a+((plants[r.id]||{}).X||0)*((DATALOG.capacity.X||{})[r.id]||0),0);
    const capY=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>a+((plants[r.id]||{}).Y||0)*((DATALOG.capacity.Y||{})[r.id]||0),0);
    const due=contracts.filter(c=>c.deliveryQuarter===q);
    const must=[];
    // 1 · contract deliveries — production one quarter earlier
    due.forEach(c=>{
      const gap=(c.bindingGap!=null?c.bindingGap:c.gap)||0;
      must.push({ kind:'contract',
        what:`אספקת ${fmt(c.qty)} ${c.product}${c.grade!=null?c.grade:''} לפי חוזה`,
        startQ:c.productionQuarter, lead:1, open:gap>0,
        why:gap>0?`חסרים ${fmt(gap)} יח׳ — הייצור חייב לקרות ב-${c.productionQuarter}`
                 :'מכוסה מהמלאי הקיים',
        form:'H6 / A2-2' });
    });
    // 2 · the tech grade a commitment or a target needs by this quarter
    due.filter(c=>c.grade>0).forEach(c=>{
      const have=(c.product==='X'?(S.quarters[base].operational.techX||0):(S.quarters[base].operational.techY||0));
      const need=c.grade-have;
      if(need>0) must.push({ kind:'tech',
        what:`דרגת ${c.product}${c.grade} כדי לייצר לחוזה`,
        startQ:startQuarterFor(c.productionQuarter, need), lead:need, open:true,
        why:`חסרות ${need} דרגות · דרגה עולה ≤1/רבעון, ולכן המו״פ חייב להתחיל ${need} רבעונים לפני הייצור`,
        form:'H1-1' });
    });
    // 3 · capacity for what this quarter plans to produce
    ['X','Y'].forEach(p=>{
      const lev=(levers&&levers[q])||{};
      const planned=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>
        a+activeLines(lev,r.id).filter(l=>l.product===p).reduce((b,l)=>b+(l.production||0),0),0);
      const cap=p==='X'?capX:capY;
      if(planned>cap) must.push({ kind:'capacity',
        what:`קיבולת ל-${fmt(planned)} יח׳ ${p}`,
        startQ:startQuarterFor(q,1), lead:1, open:true,
        why:`מתוכנן ${fmt(planned)} מול קיבולת ${fmt(cap)} — מפעל נבנה רבעון אחד ומייצר רק מהרבעון שאחריו`,
        form:'A2-1' });
    });
    // 4 · goods sold here had to be produced in the quarter before
    const levHere=(levers&&levers[q])||{};
    const soldHere=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>
      a+activeLines(levHere,r.id).reduce((b,l)=>b+(l.qtySold||0),0),0);
    if(soldHere>0 && qIndex(q)>qIndex(firstActionable)) must.push({ kind:'produce',
      what:`${fmt(soldHere)} יח׳ למכירה`,
      startQ:startQuarterFor(q,1), lead:1, open:true,
      why:'סחורה שיוצרה ברבעון נכנסת למלאי בסופו — מה שנמכר כאן חייב להיות מיוצר ברבעון שלפני',
      form:'A2-2' });
    return { q, cash, plants, capX, capY, tech:tech[q]||null, due, must,
      isNext:q===firstActionable };
  });
  // mark each requirement: already missed, must start now, or still has slack
  rows.forEach(row=>row.must.forEach(m=>{
    if(!m.startQ){ m.status='missed'; m.slack=null; return; }
    const d=qIndex(m.startQ)-qIndex(firstActionable);
    m.slack=d;
    m.status = d<0 ? 'missed' : (d===0 ? 'now' : 'later');
  }));
  return rows;
}
/* The subset that decides this quarter: what must start now, and what is already lost.
   This is the answer to "which of my Q4 decisions are really Q7 decisions". */
function criticalPath(base, levers){
  const rows=rollingPlan(base, levers);
  const now=[], missed=[];
  rows.forEach(r=>r.must.forEach(m=>{
    if(!m.open) return;
    const item={...m, forQ:r.q};
    if(m.status==='missed') missed.push(item); else if(m.status==='now') now.push(item);
  }));
  const order={contract:0, tech:1, capacity:2, produce:3};
  const by=(a,b)=>(order[a.kind]-order[b.kind])||(qIndex(a.forQ)-qIndex(b.forQ));
  return { now:now.sort(by), missed:missed.sort(by), rows };
}

/* ==========================================================================
   I-4 · FORECAST vs ACTUAL.
   Nothing in the app ever measured whether its own projection was right. The demand
   model calibrates elasticity from observed share, but there was no "we predicted this
   quarter's profit and were off by X" — so the engine could be systematically wrong in
   the same direction for six quarters and nobody would see it.
   A forecast is captured when a plan is committed for a quarter, and compared against
   the report once that quarter is ingested. Only quarters that have BOTH are reported;
   nothing is inferred for a quarter that was never forecast.
   ========================================================================== */
function captureForecast(q, sc){
  if(!q||!sc) return null;
  const base=S.activeQuarter;
  const proj=projectCashflow(base, sc.levers||null).find(p=>p.q===q);
  // Per-quarter, not the horizon sum: this is compared against ONE quarter's reported net profit.
  const net=projectedNetForQuarter(base, sc.levers||null, q);
  const lev=(sc.levers&&sc.levers[q])||{};
  const units=REGIONS.filter(r=>r.id!=='hq').reduce((a,r)=>
    a+activeLines(lev,r.id).reduce((b,l)=>b+(l.qtySold||0),0),0);
  const f={ q, madeAt:Date.now(), fromQuarter:base, scenario:sc.name||'',
    unifiedCash:proj?Math.round(proj.unified):null,
    netProfit:(net==null?null:net), unitsSold:Math.round(units) };
  S.forecasts=S.forecasts||{}; S.forecasts[q]=f; save(true);
  return f;
}
/* One quarter's variance, or null when we cannot honestly compute one. */
function forecastVariance(q){
  const f=(S.forecasts||{})[q]; const Q=S.quarters[q];
  if(!f||!Q||!Q.entered) return null;
  const pct=(pred,act)=>(pred==null||!isFinite(pred)||Math.abs(pred)<1)?null:Math.round((act-pred)/Math.abs(pred)*100);
  const actUnified=REGIONS.reduce((a,r)=>a+(Q.financial.cash[r.id]||0)*fxRate(r.cur),0);
  const rows=[];
  if(f.unifiedCash!=null) rows.push({metric:'מזומן מאוחד', pred:f.unifiedCash, act:Math.round(actUnified), err:pct(f.unifiedCash,actUnified)});
  if(f.netProfit!=null) rows.push({metric:'רווח נקי', pred:f.netProfit, act:Math.round(Q.financial.netProfit||0), err:pct(f.netProfit,Q.financial.netProfit||0)});
  // Revenue is deliberately NOT compared. The plan states sales in local currency per area, the
  // report states a consolidated figure, and I could not confirm from the sources which basis the
  // parsed revenue row is on. Comparing them would produce a confident number on an unchecked unit
  // assumption, which is worse than not reporting it. Cash, profit and units are all unambiguous.
  const ourUnits=((Q.marketIntel||{}).sales||[]).filter(s=>s.company===OUR_CO).reduce((a,s)=>a+s.units,0);
  if(f.unitsSold && ourUnits) rows.push({metric:'יחידות שנמכרו', pred:f.unitsSold, act:ourUnits, err:pct(f.unitsSold,ourUnits)});
  return rows.length?{q, madeAt:f.madeAt, scenario:f.scenario, rows}:null;
}
/* Every quarter we both forecast and then ingested, plus the one thing this is for:
   is the engine biased in a consistent direction? */
function forecastAccuracy(){
  const list=QUARTERS.map(forecastVariance).filter(Boolean);
  if(!list.length) return {list:[], bias:null};
  const byMetric={};
  list.forEach(v=>v.rows.forEach(r=>{ if(r.err==null) return; (byMetric[r.metric]=byMetric[r.metric]||[]).push(r.err); }));
  const bias=Object.entries(byMetric).map(([metric,errs])=>{
    const mean=errs.reduce((a,b)=>a+b,0)/errs.length;
    // A single measurement is never a bias. The precedence here bit me: without the parentheses
    // `n>1 && all>0 || all<0` reported one negative reading as a consistent direction.
    const sameSign=errs.length>1 && (errs.every(e=>e>0)||errs.every(e=>e<0));
    return {metric, n:errs.length, meanErr:Math.round(mean), consistent:sameSign};
  });
  return {list, bias};
}

/* ---------- Alerts (F3.2) — the 6 red lights ---------- */
function computeAlerts(q){
  const Q=S.quarters[q], g=S.config.goals, out=[];
  if(!Q.entered){ out.push({level:'amber',key:'noData',title:'אין נתוני רבעון',desc:`רבעון ${q} טרם נקלט — העלה את דוח התוצאות.`}); return out; }
  const proj=projectCashflow(q,null); const firstBreach=proj.find(x=>x.breach);
  if(firstBreach) out.push({level:'red',key:'floor',title:'שבירת רצפת מזומן צפויה',
    desc:`לפי ההקרנה, ב-${firstBreach.q} המזומן המאוחד (${fmt(firstBreach.unified)}) יורד מתחת לרצפה (${fmt(firstBreach.floor)}). מרחק: ${fmt(firstBreach.distance)}.`});
  REGIONS.forEach(r=>{ const v=Q.financial.cash[r.id]; if(v!==undefined&&v<0)
    out.push({level:'red',key:'cur_'+r.id,title:`יתרת מטבע שלילית — ${r.name}`,desc:`יתרה ${fmt(v)} ${r.cur}. גירעון מטבע דורש טיפול לפני ההזנה.`}); });
  if((Q.financial.supplierCredit||0)>0) out.push({level:'amber',key:'sc',title:'אשראי ספקים פעיל',
    desc:`יתרת אשראי ספקים ${fmt(Q.financial.supplierCredit)} — ריבית ~${S.config.params.interest.supplierCredit}%. שקול פירעון מוקדם.`});
  const noPrice=Q.operational.inventory.filter(i=>(i.qty||0)>0 && !(i.price>0));
  if(noPrice.length) out.push({level:'red',key:'noprice',title:'מלאי ללא מחיר מוזן',
    desc:`${noPrice.length} פריטי מלאי ללא מחיר — "אין מחיר = אין מכירה". פריטים: ${noPrice.map(i=>(i.product==='X'?'Chip':(i.product==='Y'?'PC':(i.product||'?')))+(i.grade?'/'+i.grade:'')+(i.region?' ('+i.region+')':'')).join(', ')}.`});
  if((Q.operational.rd||0)===0) out.push({level:'amber',key:'rd',title:'מו״פ = 0',
    desc:'אין השקעת מו״פ ברבעון זה — שים לב לקנס עקביות ולפיגור טכנולוגי מול מתחרים.'});
  // Contracts at risk are grouped into ONE alert — near-identical rows per quarter were flooding the list.
  // Grade-aware, deadline-aware. The production deadline is one quarter BEFORE delivery
  // (Data Log 08), and only stock of a sufficient grade counts toward the commitment.
  const atRisk=contractPlan().filter(c=>c.gap>0);
  // §5.3 — running short is not only lost revenue, it costs goodwill, and it costs a very
  // different amount by market. Unserved demand in US/EU computers is the most damaging
  // shortfall in the game; the same shortfall in Brazil hurts far less.
  const _shorts=REGIONS.filter(r=>r.id!=='hq').map(r=>{
    const cap=marketCapUnits('Y',r.id);
    const sc=S.scenarios[0], tq=nextQuarters(q)[0];
    const planned=(sc&&tq&&sc.levers[tq]&&sc.levers[tq].regions[r.id])?(sc.levers[tq].regions[r.id].qtySold||0):0;
    const stock=(Q.operational.inventory||[]).filter(i=>i.product==='Y'&&(i.region||'')===r.id).reduce((a,i)=>a+(i.qty||0),0);
    const supply=Math.max(planned,stock);
    return {r, cap, supply, gap:Math.max(0,cap-supply), gw:goodwillLoss(r.id,'Y')};
  }).filter(x=>x.gap>0 && x.cap>0).sort((a,b)=>(b.gap*b.gw)-(a.gap*a.gw));
  if(_shorts.length){
    const worst=_shorts[0];
    out.push({level:worst.gw>=0.7?'amber':'info', key:'goodwill',
      title:`ביקוש לא מסופק — נזק מוניטין ב${worst.r.name}`,
      desc:`${_shorts.map(x=>`<b>${esc(x.r.name)}</b>: פוטנציאל ${fmt(x.cap)} יח׳ מול היצע ${fmt(x.supply)} — חסר ${fmt(x.gap)} (מדד נזק מוניטין ${x.gw})`).join(' · ')}. `
        +`לפי §5.3 אובדן המוניטין ממחסור <b>גדול ובולט למחשבים בארה״ב ובאירופה</b> ונמוך בהרבה בברזיל. `
        +`כשצריך להחליט איפה לוותר על נפח — <b>ותר קודם בברזיל</b>, שם המחיר של המחסור הוא הנמוך ביותר.`});
  }
  if(atRisk.length){
    const urgent=atRisk.some(c=>c.tooLate||c.startNow);
    out.push({level:urgent?'red':'amber',key:'ct_group',
      title:atRisk.length===1?'התחייבות חוזית בסיכון':`${atRisk.length} התחייבויות חוזיות בסיכון`,
      desc:`${atRisk.map(c=>`<b>${esc(c.deliveryQuarter)}</b>: ${fmt(c.need)} × ${esc(c.prod)}${c.grade} — במלאי מתאים ${fmt(c.stock)}, חסר <b>${fmt(c.gap)}</b>`
        +(c.wrongGrade>0?` <span style="color:var(--amber)">(יש ${fmt(c.wrongGrade)} יח׳ ${esc(c.prod)} בדרגה נמוכה מדי — לא נחשבות)</span>`:'')
        +` · <b>מועד ייצור אחרון: ${esc(c.productionQuarter)}</b>`
        +(c.tooLate?' <b style="color:var(--red)">— המועד חלף!</b>':(c.startNow?' <b style="color:var(--red)">— זהו הרבעון שמחליטים עליו עכשיו</b>':` (${c.slack} רבעוני מרווח)`))
        +(!c.techOK?` · <b style="color:var(--red)">דרגת ${esc(c.prod)} נוכחית ${c.tech} < ${c.grade} הנדרשת — נדרש מו״פ קודם</b>`:'')
        +(!c.capKnown?` · <b style="color:var(--amber)">קיבולת ${esc(c.prod)} לא ידועה — לא הוצהר אילו מפעלים מייצרים ${esc(c.prod)}. הצהר ב"הגדרות ויעדים → פרמטרים".</b>`
          :(c.capPerQuarter===0?` · <b style="color:var(--red)">אין מפעל שמייצר ${esc(c.prod)} — ההתחייבות לא ניתנת לייצור עצמי. נדרש מפעל חדש (רבעון בנייה) או רכישה מחברה אחרת.</b>`
          :(c.capOK===false?` · <b style="color:var(--red)">מעל הקיבולת הזמינה (${fmt(c.capPerQuarter)}/רבעון)</b>`:'')))
      ).join('<br>')}<br><span class="small">סחורה שיוצרה ברבעון נכנסת למלאי בסופו, ולכן ההפקה חייבת להסתיים רבעון לפני האספקה (Data Log 08).</span>`});
  }
  if(g.debtCeiling>0 && (Q.financial.loans||0)>g.debtCeiling) out.push({level:'amber',key:'debt',title:'חריגה מתקרת חוב',
    desc:`חוב ${fmt(Q.financial.loans)} מעל התקרה שהוגדרה (${fmt(g.debtCeiling)}).`});
  return out;
}

function autoBriefing(q){
  const Q=S.quarters[q], out=[]; const cash=unifiedCashOf(q);
  const prevQ=qIndex(q)>0?QUARTERS[qIndex(q)-1]:null;
  out.push(`מזומן מאוחד עומד על <b class="num">${fmt(cash)}</b> ${Q.financial.consolidated?'(מאוחד מהדוח, SF)':'(שווי-SF מוערך)'}.`);
  if(prevQ&&S.quarters[prevQ].entered){ const d=cash-unifiedCashOf(prevQ);
    out.push(`שינוי מול ${prevQ}: <b class="num">${d>=0?'+':''}${fmt(d)}</b> ${d>=0?IC('trendUp'):IC('trendDown')}.`); }
  const fg=finishedGoods(q);
  if(fg.hasFinished) out.push(`<span style="color:${fg.anyUnpriced?'var(--red)':'var(--green)'}">מלאי מוגמר:</span> <b class="num">${fmt(fg.pcUnits)}</b> מחשבים מוכנים למכירה${fg.anyUnpriced?' — <b style="color:var(--red)">עדיין ללא מחיר מוזן!</b> זו הפעולה הדחופה ביותר':''} (שווי פוטנציאלי ≈<b class="num">${fmt(fg.potentialRevenue)}</b>).`);
  // Progress vs Group 8's Q9 targets (Assignment 1)
  const g=S.config.goals;
  if(g.cumProfitTarget){ const cumProfit=enteredQuarters().reduce((a,x)=>a+(S.quarters[x].financial.netProfit||0),0);
    const pct=Math.round(cumProfit/g.cumProfitTarget*100);
    out.push(`מול יעד Q9: רווח מצטבר <b class="num" style="color:${cumProfit<0?'var(--red)':'var(--green)'}">${fmt(Math.round(cumProfit))}</b> מתוך יעד <b class="num">${fmt(g.cumProfitTarget)}</b> (${pct}%)${g.noExternalLoans?' · קו אדום: ללא הלוואות חיצוניות':''}.`); }
  const reds=computeAlerts(q).filter(a=>a.level==='red');

  const brk=projectCashflow(q,null).find(x=>x.breach);
  if(brk) out.push(`ההקרנה מצביעה על שבירת רצפה ב-<b>${brk.q}</b> — נדרש תרחיש מתקן בסימולטור.`);
  else out.push(`ההקרנה הנוכחית שומרת על הרצפות עד Q9.`);
  if((Q.operational.rd||0)===0) out.push(`מו״פ אופס ברבעון זה — בדוק מול קנס העקביות ומגמת המתחרים.`);
  return out;
}

function drawTrend(cv){
  if(!cv)return;
  const ent=QUARTERS.filter(q=>S.quarters[q].entered);
  const actual=QUARTERS.map(q=> S.quarters[q].entered?unifiedCashOf(q):null);
  const floors=QUARTERS.map(q=>S.config.goals.floors[q]||0);
  const series=[{name:'מזומן בפועל',data:actual,color:'#4f8cff',fill:true}];
  // Projection for the remaining quarters, bridged from the last actual so the line spans Q1→Q9.
  const last=ent[ent.length-1];
  if(last){
    const proj=projectCashflow(last,null); const pMap={}; proj.forEach(p=>pMap[p.q]=p.unified);
    const projData=QUARTERS.map(q=> q===last?unifiedCashOf(last):(pMap[q]!=null?pMap[q]:null));
    if(proj.length) series.push({name:'תחזית "כפי שהוא"',data:projData,color:'#8b7fd4',dash:true});
  }
  series.push({name:'רצפת מזומן',data:floors,color:'#ff5d6c',dash:true});
  lineChart(cv,{labels:QUARTERS,series});
}
// Round axis bounds/step to human numbers (…, 2M, 4M, 6M…) instead of raw fractions of the range.
function niceTicks(min,max,count){
  if(min===max){ max=min+1; }
  const range=max-min, raw=range/(count||4);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)||0));
  const norm=raw/mag; const s=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const nMin=Math.floor(min/s)*s, nMax=Math.ceil(max/s)*s, ticks=[];
  for(let v=nMin;v<=nMax+s*0.5;v+=s) ticks.push(v);
  return {min:nMin,max:nMax,ticks};
}
function lineChart(cv,{labels,series}){
  const dpr=window.devicePixelRatio||1;
  const H=cv.height||210; // attribute height, captured before we overwrite the backing store
  cv.style.display='block'; cv.style.width='100%'; // fill the card; the canvas default is only 300px
  const rectW=Math.round(cv.getBoundingClientRect().width);
  const W=Math.max(280, rectW || (cv.parentElement?cv.parentElement.clientWidth-32:640));
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const padL=52,padR=14,padT=30,padB=26; // padT leaves room for the legend
  const all=series.flatMap(s=>s.data).filter(v=>v!==null&&!isNaN(v));
  if(!all.length){ ctx.fillStyle='#6b78a0';ctx.font='13px Assistant';ctx.textAlign='center';ctx.fillText('אין נתונים',W/2,H/2);return; }
  const nt=niceTicks(Math.min(...all,0), Math.max(...all,0), 4);
  const min=nt.min, max=nt.max||min+1;
  const x=i=> padL+(W-padL-padR)*(i/(labels.length-1||1));
  const y=v=> padT+(H-padT-padB)*(1-(v-min)/(max-min));
  ctx.strokeStyle='#26315a';ctx.lineWidth=1;ctx.fillStyle='#6b78a0';ctx.font='10px Assistant';ctx.textAlign='right';
  nt.ticks.forEach(v=>{ const yy=y(v);
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke(); ctx.fillText(shortNum(v),padL-6,yy+3); });
  ctx.textAlign='center'; ctx.fillStyle='#6b78a0'; labels.forEach((l,i)=>ctx.fillText(l,x(i),H-8));
  // legend (top, RTL right→left)
  ctx.font='11px Assistant'; ctx.textAlign='right'; let lx=W-padR;
  series.forEach(s=>{ const lbl=s.name||''; const tw=ctx.measureText(lbl).width;
    ctx.fillStyle='#9aa5bd'; ctx.fillText(lbl,lx,14);
    ctx.strokeStyle=s.color;ctx.lineWidth=2.4;ctx.setLineDash(s.dash?[4,3]:[]);
    ctx.beginPath();ctx.moveTo(lx-tw-6,11);ctx.lineTo(lx-tw-20,11);ctx.stroke();ctx.setLineDash([]);
    lx-=tw+30; });
  series.forEach(s=>{
    ctx.strokeStyle=s.color;ctx.lineWidth=2.4; ctx.setLineDash(s.dash?[5,4]:[]);
    ctx.beginPath();let started=false;
    s.data.forEach((v,i)=>{ if(v===null||isNaN(v)){started=false;return;} const xx=x(i),yy=y(v);
      if(!started){ctx.moveTo(xx,yy);started=true;}else ctx.lineTo(xx,yy); }); ctx.stroke();
    if(s.fill){ ctx.setLineDash([]);
      const grad=ctx.createLinearGradient(0,padT,0,H-padB); grad.addColorStop(0,s.color+'44');grad.addColorStop(1,s.color+'00');
      // build fill only across contiguous points
      ctx.beginPath();let st=false;let firstI=0,lastI=0;
      s.data.forEach((v,i)=>{ if(v===null||isNaN(v))return; const xx=x(i),yy=y(v); if(!st){ctx.moveTo(xx,y(min));ctx.lineTo(xx,yy);st=true;firstI=i;}else ctx.lineTo(xx,yy); lastI=i; });
      if(st){ ctx.lineTo(x(lastI),y(min)); ctx.closePath(); ctx.fillStyle=grad; ctx.fill(); }
    }
    ctx.setLineDash([]);
    s.data.forEach((v,i)=>{ if(v===null||isNaN(v))return; ctx.beginPath();ctx.arc(x(i),y(v),3,0,7);ctx.fillStyle=s.color;ctx.fill(); });
  });
}
function shortNum(v){ const a=Math.abs(v); if(a>=1e6)return (v/1e6).toFixed(1)+'M'; if(a>=1e3)return (v/1e3).toFixed(0)+'K'; return fmt(v); }

/* Decision-dependency layer: the canonical INTOPIA decision chain + the
   cross-decision prerequisites that are relevant to the current state, so the
   team sequences moves in the right order (and accounts for time lags). */
function renderDependencies(q,targetQ){
  const Q=S.quarters[q], f=Q.financial, op=Q.operational, g=S.config.goals;
  const noSales=(f.revenue||0)===0;
  const wantHigherGrade = g.techXTarget>op.techX || g.techYTarget>op.techY;
  // where are we in the chain? (no sales => still upstream at production)
  const chain=[
    {n:'מו״פ (H1-1)', here:wantHigherGrade},
    {n:'דגם/דרגה'},
    {n:'מפעלים (A2-1)'},
    {n:'ייצור (A2-3/A2-4)', here:noSales},
    {n:'תמחור+פרסום (A1-1/A1-2)'},
    {n:'מכירה'},
    {n:'גבייה מדורגת'},
    {n:'מזומן'},
  ];
  const deps=[];
  deps.push({t:'מו״פ ⟵ קודם לדרגה גבוהה', d:'החלטת מו״פ (H1-1, בליכטנשטיין) נספרת רבעון קדימה — רק אחרי שהדרגה מוכנה אפשר לייצר ולמכור אותה. למכירת דרגה/דגם גבוה יותר, המו״פ חייב להקדים ברבעון (או יותר).'});
  deps.push({t:'שבב ⟵ קודם למחשב', d:'מחשב (Y) דורש שבב (X). בשל עיכוב הרבעון, ייצור מחשבים ברבעון נתון מוגבל למלאי השבבים שנצבר מרבעונים קודמים — "אין שבב = אין מחשב". תזמן ייצור שבבים (A2-3) רבעון לפני ייצור המחשבים (A2-4).'});
  deps.push({t:'ייצור ⟵ קודם לתמחור/מכירה', d:'תמחור ופרסום (A1-1 שבב / A1-2 מחשב) שווים משהו רק אם קיים מלאי. קבע ייצור (A2-3/A2-4) קודם — "אין מלאי / אין מחיר = אין מכירה".'});
  deps.push({t:'מפעלים ⟵ מגבילים נפח ייצור', d:`הייצור חסום בקיבולת המפעלים (${op.factories} כרגע). הקמת מפעל (A2-1, עד 3 חדשים) אורכת זמן — ההחלטה חייבת להקדים את הרבעון שבו רוצים את הנפח.`});
  deps.push({t:'רצפת מזומן ⟵ מגבילה כל הוצאה', d:`כל ההוצאות (מו״פ, ייצור, פרסום, מפעל, העברות) כפופות לרצפה${f.consolidated?` — מזומן נוכחי ${fmt(f.consolidated)} CHF`:''}. ודא מימון (A3-2 הלוואה מקומית / H4 הלוואה בין-חברות) לפני התחייבות להוצאות גדולות.`});
  deps.push({t:'גבייה מדורגת ⟵ קובעת עיתוי מזומן', d:'הכנסה ממכירה נכנסת מדורג לפי לוח הגבייה האזורי (למשל ברזיל 30/30/40). החלטת מכירה היום משפיעה על המזומן ברבעונים הבאים — לא מיד. תזמן מול הרצפות.'});
  REGIONS.forEach(r=>{ if((f.cash[r.id]||0)<0) deps.push({t:`העברה ⟵ נדרשת לפני פעילות ב${r.name}`,d:`גירעון מטבע ב${r.name}. העברת כסף (A3-1, Money Transfer מהמטה) חייבת להתבצע לפני/עם ההזנה, אחרת פעולות באזור ייכשלו.`}); });
  return `<div class="card" style="margin-bottom:16px"><div class="ch"><h3>${IC('sliders')} תלויות ורצף החלטות</h3><span class="small muted">קבל את ההחלטות בסדר הנכון</span></div>
    <div class="cb">
      <div class="depchain">${chain.map((x,i)=>`<span class="depnode ${x.here?'here':''}">${x.n}</span>${i<chain.length-1?'<span class="deparrow">⟵</span>':''}`).join('')}</div>
      <div class="small muted" style="margin-top:8px">כל שלב תלוי בקודמו. הנקודה המודגשת = היכן שאתה נמצא כעת בשרשרת.</div>
      <ul style="padding-inline-start:20px;line-height:1.85;margin:12px 0 0">${deps.map(d=>`<li><b>${d.t}</b> — ${d.d}</li>`).join('')}</ul>
    </div></div>`;
}
// WS-5: confidence tags — every recommendation says where it comes from (data / game rule / estimate).
// WS-5: maturation countdown — will an investment still pay off by Q9?
function quartersToEnd(q){ return (QUARTERS.length-1)-qIndex(q); }
function maturationAdvice(q){
  const n=quartersToEnd(q), out=[];
  out.push({ok:n>=1, t:'מו״פ (H1-1)', d:n>=1?`מבשיל +1 רבעון — נותרו ${n}, עדיין משתלם`:'ב-Q9 לא יבשיל בזמן — אל תשקיע במו״פ חדש'});
  out.push({ok:n>=3, t:'מפעל חדש (A2-1)', d:n>=3?'בנייה→ייצור→מכירה→גבייה עדיין נסגר עד Q9':'מאוחר מדי — לא יחזיר את ההשקעה עד Q9'});
  out.push({ok:n>=2, t:'משרד מכירות (A1-3)', d:n>=2?'עלות קבועה שמחזירה עם צמיחת נפח':'ההחזר לא יתממש עד Q9 — דלג'});
  out.push({ok:true, t:'נתח שוק / דרגה', d:'נמדדים ב-Q9 (מחצית הפוטנציאל) — בנה מוקדם, מתגמל בכל שלב'});
  return {n,out};
}
/* D-02 · The critical path, above the decisions rather than buried in a section. Two questions

  if(!cp.now.length && !cp.missed.length) return '';
  const kindLabel={contract:'התחייבות',tech:'מו״פ',capacity:'קיבולת',produce:'ייצור'};

    <div class="small muted" style="margin-top:2px">${m.why}</div></li>`;
  return `<div class="card pad" style="margin-bottom:14px;border-inline-start:4px solid ${cp.missed.length?'var(--red)':'var(--amber)'}">
    <div class="between" style="flex-wrap:wrap;gap:8px">
      <b>${IC('warn')} הנתיב הקריטי — החלטות של ${targetQ} שהן באמת החלטות של רבעונים מאוחרים</b>
      <span class="row" style="gap:6px">${cp.missed.length?`<span class="tag r">${cp.missed.length} כבר איחרנו</span>`:''}${cp.now.length?`<span class="tag a">${cp.now.length} חייבות להתחיל ב-${targetQ}</span>`:''}</span></div>
    ${cp.missed.length?`<div style="margin-top:10px"><b class="small" style="color:var(--red)">איחרנו את מועד ההתחלה — היעד הזה לא יושג בזמן:</b>
      <ul style="padding-inline-start:20px;margin:8px 0 0">${cp.missed.map(m=>item(m,'r')).join('')}</ul>
      <div class="small muted" style="margin-top:6px">${IC('info')} כשמועד ההתחלה עבר, השאלה אינה "איך נספיק" אלא <b>מה החלופה</b> — רכישה מחברה אחרת, דרגה נמוכה לפי סעיף 5, או הזזת היעד.</div></div>`:''}
    ${cp.now.length?`<div style="margin-top:${cp.missed.length?'12':'10'}px"><b class="small" style="color:var(--amber)">חייב להתחיל ב-${targetQ}, אחרת המועד יאבד:</b>
      <ul style="padding-inline-start:20px;margin:8px 0 0">${cp.now.map(m=>item(m,'a')).join('')}</ul></div>`:''}
  </div>`;
}

function pcPlanFor(q){
  const out=[]; (S.quarters[q].operational.inventory||[]).filter(i=>i.product==='Y'&&(i.qty||0)>0).forEach(i=>{
    const rid=i.region||'europe'; const reg=REGIONS.find(r=>r.id===rid)||REGIONS[1];
    let price=0, src='';
    const a=S.learning.anchors&&S.learning.anchors[rid+'|Y'];
    const dlPrice=(DATALOG.initialConsumerPrice.Y&&DATALOG.initialConsumerPrice.Y[rid])||0; const mr=mrMarketPrice(rid,'Y');
    if(a&&a.price>0){ price=Math.round(a.price); src='עוגן ביקוש נלמד'; }
    else if(mr){ price=Math.round(mr.median); src='מחיר שוק מ-MR'; }
    else if(dlPrice>0){ price=dlPrice; src='מחיר פתיחה מהמשחק (Data Log)'; }
    else if(i.cost>0){ price=Math.round(i.cost*2); src='עלות ×2'; }
    else { price=300; src='הנחת פתיחה — עדכן לפי עלות בפועל'; }
    // A quarter's sales are bounded by DEMAND, not by what sits in the warehouse. This used to
    // plan the entire stock — 35,000 units in Europe against a 22,100-unit observed market and
    // a demand model predicting 4,900. The headline action, the AI context and the cash inflow
    // all inherited that figure while the options table right beside it capped correctly.
    const ceiling=demandCeiling(rid,'Y',price);
    const units=Math.max(0, Math.min(i.qty, ceiling.units));
    const leftover=Math.max(0, i.qty-units);
    const carry=(DATALOG.carryingCostPerUnit.Y||{})[rid]||0;
    const ar=recommendAdSpend(rid,'Y',units,price,i.cost||0);
    out.push({rid, reg, units, stock:i.qty, leftover, ceiling,
      carryCost:Math.round(leftover*carry), gw:goodwillLoss(rid,'Y'),
      price, src, revenue:units*price, adv:ar.spend, advWhy:ar.why, cost:i.cost||0});
  });

}
/* How many units this market can actually absorb from us in one quarter, and on what
   authority. Calibrated demand first, then the Data Log market potential, so no
   recommendation can quietly exceed what the reports themselves show. */
function demandCeiling(rid, product, price){
  const cap=marketCapUnits(product,rid);
  const pd=(S.learning&&S.learning.market&&S.learning.market[rid+'|'+product]!=null)
    ? predictDemand(rid,product,{price}) : null;
  if(pd && pd.units>0){
    // the learned point estimate is what we sold; the honest ceiling is its upper band,
    // still capped by the Data Log potential for one company in one quarter
    const upper=Math.min(cap, Math.max(pd.units, pd.high||pd.units));
    return {units:upper, src:`מנוע ביקוש מכויל (${S.learning.obs} רבעונים) — נמכר בפועל ${fmt(pd.units)}, גבול עליון ${fmt(upper)}`, calibrated:true, observed:pd.units, cap};
  }
  return {units:cap, src:`פוטנציאל שוק מ-Data Log (~${fmt(cap)} יח׳/חברה/רבעון)`, calibrated:false, cap};
}

function demandOverreach(items){

    Object.entries(it.sim.regions||{}).forEach(([rid,g])=>{
      const qty=g.qtySold||((g.price>0&&g.sales)?Math.round(g.sales/g.price):0);
      if(!qty) return;
      const c=demandCeiling(rid,(g.product==='X'?'X':'Y'),g.price||0);

    });

  const opRegionId=Object.keys(invR).sort((a,b)=>invR[b]-invR[a])[0]||'europe';
  const opReg=REGIONS.find(r=>r.id===opRegionId)||REGIONS[1];

    out.push({cat:'fin',level:'amber',conf:'data',
      title:`מַמֵּן את המטה — העבר ${fmt(full)} ${src.r.cur} מ${src.r.name} → מטה`,form:'A3-1 (Money Transfer — To Home Office)',

      dep:`חייב לקרות לפני מו״פ (H1-1) ותשלומי ריבית ברבעון הבא. המרה כרוכה בשער (${src.r.cur}→SF) ובעמלה ${comm}%.`,
      optionCols:['סכום למקור','שווי SF'],options:[mk('כל הנדרש',1,'סוגר את מלוא הצורך של המטה'),mk('70%',0.7,'חלקי — משאיר מרווח במקור'),mk('50%',0.5,'מינימלי')],
      sim:{q:targetQ,regions:{hq:{transferIn:Math.round(full*fxRate(src.r.cur))}, [src.r.id]:{transferOut:full}}}});

  regs.filter(x=>x.r.id!==opRegionId && Math.round(remaining[x.r.id]*fxRate(x.r.cur))>250000).forEach(x=>{

    out.push({cat:'fin',level:'info',conf:'data',
      title:`רכז מזומן — העבר ${fmt(full)} ${x.r.cur} מ${x.r.name} → ${opReg.name}`,form:'A3-1 (Money Transfer)',
      detail:`ב${x.r.name} ${avail<x.local?'נותרו':'מצטברים'} ${fmt(avail)} ${x.r.cur} (≈ ${fmt(Math.round(avail*fxRate(x.r.cur)))} SF)${avail<x.local?' לאחר מימון המטה':''} שאינם מנוצלים, בעוד הייצור והמכירה מרוכזים ב${opReg.name}. רכזו אותם לשם למימון ייצור/פרסום. <b>מומלץ: העבר ${fmt(full)} ${x.r.cur} (80% מהיתרה ≈ ${fmt(Math.round(full*fxRate(x.r.cur)))} SF) ל${opReg.name}.</b> עמלת המרה ${comm}% תנוכה במקור.`,
      dep:`מזומן באזור לא-פעיל אינו מייצר תשואה. המרה כרוכה בעמלה ${comm}% ובשער (${x.r.cur}→SF).`,
      optionCols:['סכום למקור','שווי SF'],options:[mk('סחוף 80%',1,'מרכז את רוב המזומן לאזור הפעיל'),mk('50%',0.625,'חלקי'),mk('מינימלי',0.375,'משאיר רוב במקור')],
      sim:{q:targetQ,regions:{[opRegionId]:{transferIn:toOpLocal(Math.round(full*fxRate(x.r.cur)))}, [x.r.id]:{transferOut:full}}}});

/* Full-scan verdict for every official form: recommended here / watch / not needed — with the reason. */
function buildActionPlan(q,targetQ){
  const Q=S.quarters[q], f=Q.financial, op=Q.operational, g=S.config.goals, out=[];
  const proj=projectCashflow(q,null); const brk=proj.find(x=>x.breach);
  const mi=Q.marketIntel; const comps=Object.values(mi.competitors||{});
  const us=comps.find(x=>x.num===OUR_CO);
  // 0. TOP PRIORITY — sell the finished PCs already in inventory.
  //    Fires whenever finished stock exists, INDEPENDENT of current revenue. Converting
  //    finished goods to cash is the highest marginal return on the whole score: it feeds the
  //    past-half directly (profit) and funds the potential-half (cash to invest). Ranked first.
  const fg=finishedGoods(q);
  if(fg.hasFinished){
    const plan=fg.plan;
    const simRegions={}; plan.forEach(p=>{ simRegions[p.rid]={sales:p.revenue,advertising:p.adv,product:'Y',unitCost:p.cost,margin:null,advPct:null}; });
    const selling=(f.revenue||0)>0;
    // attach the 3 pricing options (volume/balanced/premium) so the sell action carries its own drill-down
    const so=pcSellOptions(q); const g0=so[0]; let sellOpts=null, sellCols=null;
    if(g0){ sellCols=['מחיר/יח׳','יח׳','הכנסה','רווח גולמי','פרסום'];
      sellOpts=g0.opts.map(o=>({ name:o.name, favors:o.favors,
        cells:[fmt(o.price)+' '+g0.reg.cur, fmt(o.units), fmt(o.revenue), fmt(o.grossMargin),
          o.adv>0?est(fmt(o.adv),`תקציב פרסום לפי גמישות ${advElast(g0.rid,'Y')} וסף ${fmt(o.advThreshold)} ${g0.reg.cur} — הדירוג מהמדריך §5.4, הגודל אומדן מכויל`)
                 :est('0','מתחת לסף האפקטיביות — פרסום כאן לא מחזיר את עצמו')],
        sim:{q:targetQ,regions:{[g0.rid]:{sales:o.revenue,advertising:o.adv,product:'Y',unitCost:g0.cost,margin:null,advPct:null}}} })); }
    out.push({cat:'mkt',level:(fg.anyUnpriced||!selling)?'red':'amber',conf:plan.some(p=>/הנחת/.test(p.src))?'est':'data',
      title:`מכור ${fmt(plan.reduce((a,p)=>a+p.units,0)||fg.pcUnits)} מתוך ${fmt(fg.pcUnits)} מחשבים במלאי${fg.anyUnpriced?' — ללא מחיר, לא נמכרים!':''}`,
      form:'A1-2 (PC Prices & Advertising)',
      detail:`<b>יש ${fmt(fg.pcUnits)} מחשבים מוכנים במלאי</b> (שווי פוטנציאלי ≈${fmt(fg.potentialRevenue)}).`
        +(plan.some(p=>p.leftover>0)?`<div class="tag a" style="display:block;margin:8px 0;line-height:1.7;white-space:normal">${IC('warn')} <b>לא כל המלאי נמכר ברבעון אחד.</b> ${plan.filter(p=>p.leftover>0).map(p=>`ב${p.reg.name} השוק סופג <b>${fmt(p.units)}</b> יח׳ במחיר ${fmt(p.price)} (${esc(p.ceiling.src)}) — <b>${fmt(p.leftover)} יישארו במלאי</b> ועלות האחזקה עליהם ${fmt(p.carryCost)} ${p.reg.cur}/רבעון`).join(' · ')}. <b>העודף הוא בדיוק המקרה ליצוא</b> לשוק עם ביקוש פנוי (שילוח + משרד מכירות), או להורדת מחיר שמגדילה את הכמות הנספגת.</div>`:'')
        +` ${fg.anyUnpriced?'חלקם/כולם ללא מחיר מוזן — "אין מחיר = אין מכירה". ':''}זו הפעולה בעלת התשואה הגבוהה ביותר: המרת מלאי מוגמר למזומן מזינה ישירות את מחצית העבר (רווח) ומממנת את מחצית העתיד.${g0?` מחיר בסיס ${fmt(g0.base)} ${g0.reg.cur} (${g0.priceSrc}). בחר אופציה:`:''}`,
      dep:`מפעל ✓ · שבבים ✓ · מחשבים ✓ ⟵ נותר רק להזין מחיר+פרסום (A1-2). ${fg.anyUnpriced?'המחיר החסר הוא מה שחוסם את המכירה כרגע.':''}`,
      optionCols:sellCols, options:sellOpts, sim:{q:targetQ,regions:simRegions}});
  }
  // 0b. PRODUCTION LOOP — the core operational decision each quarter. Assemble idle chips into
  //     sellable PCs (A2-4), and keep the chip pipeline full (A2-3). Both carry option sets.
  const asm=assemblePcAction(q,targetQ);
  if(asm){ out.push({cat:'ops',level:'amber',conf:'data',
    title:`עבד ${fmt(asm.avail)} שבבים למחשבים — A2-4`,form:'A2-4 (Computer Production)',
    detail:`יש <b>${fmt(asm.avail)} שבבים ב${asm.reg.name}</b> שיושבים במלאי. שבב שלא הופך למחשב לא מייצר הכנסה — כל רבעון של המתנה הוא מכירה אבודה רבעון קדימה. <b>מומלץ: עבד את כל ${fmt(asm.avail)} השבבים → ${fmt(asm.avail)} מחשבים${asm.pcCost?` (עלות ~${fmt(asm.pcCost)} ${asm.reg.cur}/יח׳, סה״כ ≈${fmt(asm.avail*asm.pcCost)})`:''}.</b> אופציות אחרות למטה.`,
    dep:`שבבים ✓ ⟵ עיבוד למחשבים (A2-4) ברבעון זה ⟵ מכירה (A1-2) ברבעון הבא. דורש שבבים במלאי — יש.`,
    optionCols:asm.optionCols, options:asm.options, sim:asm.options[0].sim}); }
  if((op.factories||0)>0){ const cp=chipProdAction(q,targetQ);
    const chipsNow=(op.inventory||[]).filter(i=>i.product==='X').reduce((a,i)=>a+(i.qty||0),0);
    out.push({cat:'ops',level:chipsNow===0?'amber':'info',conf:'data',
      title:`ייצר שבבים לפייפליין — A2-3`,form:'A2-3 (Chip Production)',
      detail:`${chipsNow===0?'<b>מלאי השבבים ריק</b> — בלי שבבים ב-'+targetQ+' לא יהיו מחשבים ברבעון שאחריו, וכל שרשרת המכירות נעצרת. ':`יש ${fmt(chipsNow)} שבבים כרגע. `}שמור על הפייפליין מלא. <b>מומלץ: ייצר ${fmt(cp.base)} שבבים ב${cp.reg.name}${cp.cc?` (עלות ~${fmt(cp.cc)} ${cp.reg.cur}/יח׳, סה״כ ≈${fmt(cp.base*cp.cc)})`:''}.</b> אופציות אחרות למטה.`,
      dep:`שבבים ב-${targetQ} ⟵ מחשבים ברבעון הבא ⟵ מכירה ברבעון שאחריו. כל דילוג = חור של רבעון בהכנסות.`,
      optionCols:cp.optionCols, options:cp.options, sim:cp.options[1].sim}); }
  // 1. Cash floor risk
  if(brk) out.push({cat:'fin',level:'red',title:'סכנת שבירת רצפת מזומן',form:'A3-2 (הלוואה מקומית) / H4 (הלוואה בין-חברות)',
    action:"go('financials')", actionLabel:'פתח את הקרנת התזרים',
    detail:`ההקרנה מראה ירידה מתחת לרצפה ב-<b>${brk.q}</b> (מזומן ${fmt(brk.unified)} מול רצפה ${fmt(brk.floor)}). גייס מימון או הקטן הוצאות עוד לפני כן.`,
    dep:`ההחלטה חייבת להתקבל <b>רבעון-שניים לפני</b> ${brk.q} — מימון וצמצום הוצאות משפיעים על המזומן קדימה, לא רטרואקטיבית.`});
  // 2. Negative currency
  REGIONS.forEach(r=>{ if((f.cash[r.id]||0)<0){ const need=Math.round(Math.abs(f.cash[r.id])*1.2);
    out.push({cat:'fin',level:'red',title:`גירעון מטבע — ${r.name}: העבר ${fmt(need)} ${r.cur}`,form:'A3-1 (Money Transfer אזור↔מטה)',
      detail:`יתרה שלילית ${fmt(f.cash[r.id])} ${r.cur}. סכום מוצע: <b>${fmt(need)} ${r.cur}</b> (הגירעון + כרית 20%) בהעברה מהמטה, Convert in Area? כן.`,
      sim:{q:targetQ,regions:{[r.id]:{transferIn:need}, hq:{transferOut:Math.round(need*fxRate(r.cur))}}}}); } });
  // Capital allocation — fund HQ (R&D+interest) and consolidate idle regional cash (e.g. Brazil→Europe/HQ)
  transferActions(q,targetQ).forEach(t=>out.push(t));
  // 3. Revenue status — judged against the mandatory value-chain timeline
  //    (factory Q1 -> chips Q2 -> PCs Q3 -> first possible sale Q4): zero revenue
  //    before PCs exist is ON PLAN, not an alarm.
  //    (the sell-down of existing finished PCs is handled above, priority 0). Here we only

  if((f.revenue||0)===0 && !fg.hasFinished){
    const st=chainStage(q);
    out.push({cat:'ops',level:'info',conf:'rule',title:'מחזור 0 — במסלול ההבשלה, לא טעות',
      detail:`אי-אפשר למכור לפני שיש מחשבים: מפעל (רבעון) ← שבבים (רבעון) ← מחשבים (רבעון) ← מכירה. מצב נוכחי: <b>${st.txt}</b>${st.chips?` (${fmt(st.chips)} שבבים)`:''}. שריפת המזומן (רווח נקי ${fmt(f.netProfit)}) היא עלות ההקמה המתוכננת — עקוב שהיא לא שוברת רצפה.`,
      dep:`הכן מראש את החוליה הבאה בשרשרת, ואת המחיר — כדי שלא יאבד רבעון כשהמכירה תיפתח.`});
  }

      out.push({cat:'strat',level:'amber',conf:'data',title:`אתה #${rank}/${comps.length} ברווחים צבורים — פער ${fmt(Math.round(gap))} מהמוביל`,
      detail:`רווחים צבורים = 50% מהציון הסופי, ואתה בחצי התחתון (מוביל: חברה ${sorted[0].num} עם ${fmt(sorted[0].retainedEarnings)}). הדרך היחידה לסגור פער: <b>למכור ברווחיות כל רבעון</b>. הפעולות הקונקרטיות לכך כבר למעלה — מכירת המלאי המוגמר (A1-2) ועיבוד השבבים למחשבים (A2-4). בצע אותן, אל תחכה.`}); }
  }
  // 6+7. R&D (H1-1) — one decision with amount options + competitor context
  {
    let lastRd=0; enteredQuarters().forEach(x=>{ const v=S.quarters[x].operational.rd||0; if(v>0) lastRd=v; });
    const baseRd=lastRd||800000;
    const chipLeaders=comps.filter(x=>x.num!==OUR_CO&&x.rdChip>0).sort((a,b)=>b.rdChip-a.rdChip).slice(0,2);
    const ourRd=(op.rd||0), avgRd=comps.length?comps.reduce((a,x)=>a+((x.rdChip||0)+(x.rdPc||0)),0)/comps.length*1000:0;

      title:`${(op.rd||0)===0?'מו״פ נעצר (0) — חדש השקעה':'החלטת מו״פ לרבעון'} — H1-1`,form:'H1-1 (מו״פ, בליכטנשטיין)',
      detail:`רמות נוכחיות Chip ${op.techX}/Computer ${op.techY} · ${tgt}.${chipLeaders.length?` חברות ${chipLeaders.map(x=>x.num).join(', ')} מובילות במו״פ Chip — ${ourRd>=avgRd?'אתה מעל ממוצע השוק':'אתה מתחת לממוצע, סיכון לפיגור דרגה'}.`:''}${(op.rd||0)===0?' <b>המו״פ ברבעון זה 0 — מחצית הפוטנציאל נתקעת.</b>':''} <b>מומלץ ל-${targetQ}: ${fmt(baseRd)} SF</b> (${lastRd?'הקצב האחרון שלך':'ברירת מחדל'}). אופציות אחרות למטה.`,

        dep:`אשראי הספקים יקר (${S.config.params.interest.supplierCredit}%) ופוגע ברכיב האיתנות — צמצמו את משכו ע״י האצת מכירות וגבייה. אין לבקש הלוואה מאף גורם.`});
